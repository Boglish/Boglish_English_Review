 if(pc){return `<div class="task-grid"><div><span class="tag">${icon(({읽기:'book-open',듣기:'headphones',쓰기:'keyboard',말하기:'mic'})[q().mode])}${q().mode}</span>${q().mode==='읽기'?`<p class="passage" lang="en">${esc(q().passage)}</p><p>${esc(q().ko)}</p><p class="stem" lang="en">${esc(q().target.replace(q().chunk,'___'))}</p>`:q().mode==='듣기'?`<p>문장을 듣고 들리는 내용을 적어 보세요.</p>${listenButton()}`:`<p>${esc(q().ko)}</p><p class="minor">${esc(q().chunk)} 표현을 활용해 보세요.</p>`}</div><div>${q().mode==='말하기'?`<div class="concealed">${icon('message-circle')}예문을 보기 전에 영어로 답해 보세요.</div><button class="primary" data-action="oral">내 답변을 말했습니다</button>`:`<form id="answer-form"><label for="answer">${q().mode==='읽기'?'빈칸에 들어갈 영어 덩어리':'영어 문장'}</label><textarea id="answer" lang="en" maxlength="500" spellcheck="false" autocapitalize="off" autocomplete="off">${esc(draft)}</textarea><button class="primary" type="submit">${icon('check')}답안 확인</button></form>${wrong?'<p class="feedback">등록된 예시와 달라요. 다른 올바른 답일 수도 있습니다.</p><button class="secondary" data-action="model">예시와 직접 비교</button>':''}`}</div></div>`;}
 const t=q();return `<div class="scene-symbol">${icon(course.icon)}<span>${esc(t.context||t.ko)}</span></div>${t.type==='scene'?'<p>문장에 가장 알맞은 상황을 고르세요.</p>':''}${t.stem?`<p class="english">${esc(t.stem)}</p>`:''}${t.type==='assembly'?`<div class="assembly">${selected.length?selected.map((k,j)=>`<button data-remove="${j}" class="piece">${esc(t.pieces[k])}${icon('x')}</button>`).join(''):'<span class="minor">영어 덩어리를 순서대로 선택하세요.</span>'}</div><div class="piece-bank">${t.pieces.map((_,i)=>(i+1)%t.pieces.length).reverse().map(k=>`<button class="piece" data-piece="${k}" ${selected.includes(k)?'disabled':''}>${esc(t.pieces[k])}</button>`).join('')}</div><button class="primary" data-action="assemble" ${!selected.length?'disabled':''}>${icon('check')}정답 확인</button>`:`<div class="choices">${t.choices.map((s,i)=>`<button data-choice="${i}" class="choice"><span>${'ABC'[i]}</span>${esc(s)}</button>`).join('')}</div>`}${wrong?'<p class="feedback">상황의 단서를 다시 확인해 보세요. 한 번 더 시도할 수 있어요.</p>':''}`;
}
function readView(){return `<p class="tag">${reviewAnswer?'예시 답안':'정답 확인'}</p>${sentence()}${listenButton()}<p>${esc(q().ko)}</p>${draft?`<div class="comparison"><span class="minor">내 답안</span><p>${esc(draft)}</p></div>`:''}<p class="branch">${esc(q().branch)}의 영주</p><p class="note">${esc(q().reason)}</p>${coreView()}${readControls()}${q().image?`<details><summary>관련 카툰 · ${q().source}쪽</summary><img class="cartoon" src="${q().image}" alt="${'OUT'} 카툰 ${q().source}쪽" loading="lazy"></details>`:''}`;}
function recallView(){return `<p>${esc(q().ko)}</p><div class="concealed">${icon(recording?'mic':'eye-off')}<span>${pending?'마이크 연결 중':stopping?'녹음 마무리 중':recording?'녹음 중':'영어 문장을 가렸어요.'}</span>${recording?'<span><b id="seconds">0</b>초</span>':''}</div>${recording?`<div class="mic-panel"><label for="mic-level">입력 음량 · <span id="mic-label">${esc(rec.label)}</span></label><meter id="mic-level" min="0" max="1" value="0"></meter><p id="mic-status" class="minor">말할 때 입력을 확인하고 있어요.</p></div>`:`<label for="mic-device">녹음할 마이크</label><select id="mic-device"><option value="">시스템 기본 마이크</option>${rec.devices.map((d,i)=>`<option value="${esc(d.deviceId)}" ${device===d.deviceId?'selected':''}>${esc(d.label||'마이크 '+(i+1))}</option>`).join('')}</select>`}<div class="actions"><button class="primary" data-action="${recording?'stop':'record'}" ${pending||stopping?'disabled':''}>${icon(recording?'square':'mic')}${recording?'녹음 마치고 비교':'녹음 시작'}</button>${!recording&&!pending&&!stopping?'<button class="secondary" data-action="manual">마이크 없이 소리 내어 말했어요</button>':''}</div>`;}
function compareView(){return `${sentence()}<p class="meaning">${esc(q().ko)}</p>${listenButton()}${result?.url?`<label for="playback">내 녹음</label><audio id="playback" controls src="${result.url}"></audio>`:''}${result?.silent?'<p class="feedback">입력이 거의 없었습니다. 노트북 마이크 음소거·입력 장치를 확인한 뒤 다시 녹음해 주세요.</p>':''}<div class="comparison"><p>${esc(transcript||'내가 말한 문장과 원문의 단어·순서를 비교해 보세요.')}</p>${transcript?`<p class="${norm(transcript)===norm(q().target)?'good':'minor'}">${norm(transcript)===norm(q().target)?'원문과 일치합니다.':'다른 표현이나 음성 인식 오류일 수 있어요. 녹음도 확인해 주세요.'}</p>`:''}</div><label class="check"><input id="verified" type="checkbox" ${checked?'checked':''}>내가 말한 내용과 원문을 비교했습니다</label><div class="actions"><button class="primary" data-action="next" ${!checked?'disabled':''}>${icon('arrow-right')}${index===qs.length-1?'결과 보기':'다음 문제'}</button><button class="secondary" data-action="retry">${icon('mic')}다시 가리고 말하기</button></div><details><summary>다시 말해 자동으로 비교하기</summary><p class="minor">이 기능은 녹음한 파일을 분석하지 않습니다. 새로 말한 음성이 브라우저의 음성 인식 서비스로 전송될 수 있습니다. 발음 평가가 아닌 문장 비교입니다.</p><button class="secondary" data-action="recognize" ${recognizing?'disabled':''}>${recognizing?'듣고 있어요…':'음성 인식 시작'}</button></details>`;}
function summaryView(){return `<h2>${'OUT'} 복습을 마쳤어요.</h2><div class="stats"><div><strong>${Object.keys(results).length}/${qs.length}</strong><span>읽고 말한 문장</span></div><div><strong>${Object.values(first).filter(Boolean).length}/${qs.filter(t=>t.mode!=='말하기').length}</strong><span>첫 답안 자동 확인</span></div></div><p class="minor">영작은 등록된 답안을 기준으로 확인하며, 다른 올바른 표현도 가능합니다.</p><ol class="results">${qs.map((t,i)=>`<li><span>${esc(t.target)}</span><small>${results[i]?(results[i].recorded?'녹음 완료':'직접 말하기 완료'):'미완료'}</small></li>`).join('')}</ol><div class="actions"><button class="primary" data-action="weak">다시 확인할 문장</button><button class="secondary" data-action="restart">처음부터</button><a href="review.html">다른 전치사</a></div>`;}
function answer(ok){if(!(index in first))first[index]=ok;if(ok){stage='read';wrong=false;render(true);}else{wrong=true;render();}}
async function startRecord(){if(pending||recording||stopping)return;voice.pause();error='';pending=true;render();const token=generation;try{const started=await rec.start(device);if(token!==generation)return;pending=false;recording=!!started;render();}catch(e){if(token!==generation)return;pending=false;error=e.message;render();}}
async function stopRecord(){if(!recording)return;recording=false;stopping=true;render();const token=generation;try{result=await rec.stop();if(token!==generation)return;stopping=false;stage='compare';checked=false;render(true);}catch(e){if(token!==generation)return;stopping=false;error=e.message;render();}}
function listen(){if(!['read','compare'].includes(stage)&&!(pc&&q().mode==='듣기'&&stage==='task'))return;document.querySelector('audio')?.pause();voice.src=q().audio;const token=generation;voice.play().catch(()=>{if(token===generation){error='원문 음성을 불러오지 못했어요. 인터넷 연결을 확인하고 다시 눌러 주세요.';render();}});}
function recognize(){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){error='이 브라우저에서는 자동 음성 인식을 지원하지 않아요. 직접 비교해 주세요.';render();return;}voice.pause();document.querySelector('audio')?.pause();recognizing=true;error='';const token=generation;recognizer=new R();recognizer.lang='en-US';recognizer.continuous=false;recognizer.interimResults=false;recognizer.onresult=e=>{if(token!==generation)return;transcript=e.results[0][0].transcript;recognizing=false;render();};recognizer.onerror=()=>{if(token!==generation)return;recognizing=false;error='음성 인식을 완료하지 못했어요. 녹음을 듣고 직접 비교해 주세요.';render();};recognizer.onend=()=>{if(token===generation){recognizing=false;render();}};try{recognizer.start();recognitionTimer=setTimeout(()=>recognizer?.stop(),20000);render();}catch{recognizing=false;error='음성 인식을 시작할 수 없어요.';render();}}
app.addEventListener('input',e=>{if(e.target.id==='answer')draft=e.target.value;});
app.addEventListener('change',e=>{if(e.target.id==='mic-device')device=e.target.value;if(e.target.id==='verified'){checked=e.target.checked;document.querySelector('[data-action="next"]').disabled=!checked;}});
app.addEventListener('submit',e=>{if(e.target.id!=='answer-form')return;e.preventDefault();if(!draft.trim()){error='답안을 먼저 입력해 주세요.';render();return;}const accepted=q().mode==='읽기'?[q().chunk]:[q().target,...q().alternatives||[]];answer(accepted.some(s=>norm(s)===norm(draft)));});
app.addEventListener('play',e=>{if(e.target.tagName==='AUDIO')voice.pause();},true);
app.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b||b.disabled)return;
 if(b.dataset.section!==undefined){const s=Number(b.dataset.section);if(confirm('이 영역의 첫 문제로 이동할까요? 현재 녹음은 삭제됩니다.')){retry=null;go(pc?qs.findIndex(t=>t.mode===groups[s]):s*5);}return;}
 if(stage==='task'&&b.dataset.choice!==undefined){answer(Number(b.dataset.choice)===q().answer);return;}
 if(stage==='task'&&b.dataset.piece!==undefined){selected.push(Number(b.dataset.piece));render();return;}
 if(stage==='task'&&b.dataset.remove!==undefined){selected.splice(Number(b.dataset.remove),1);render();return;}
 const a=b.dataset.action;
 if(a==='assemble'&&stage==='task')answer(norm(selected.map(k=>q().pieces[k]).join(' '))===norm(q().target));
 if(a==='oral'||a==='model'){reviewAnswer=true;stage='read';voice.pause();render(true);}
 if(a==='read'&&stage==='read'){reads=Math.min(2,reads+1);render();}
 if((a==='hide'&&reads===2)||(a==='retry'&&stage==='compare')){cleanup();stage='recall';checked=false;transcript='';result=null;error='';render(true);}
 if(a==='record')startRecord();if(a==='stop')stopRecord();if(a==='listen')listen();if(a==='recognize'&&stage==='compare')recognize();
 if(a==='manual'&&stage==='recall'&&!recording&&!pending){cleanup();manual=true;stage='compare';result=null;checked=false;render(true);}
 if(a==='next'&&stage==='compare'&&checked){results[index]={recorded:!!result?.url&&!result?.silent};cleanup();const next=retry?retry[++retryAt]:index+1;if(next===undefined||next>=qs.length){stage='summary';render(true);}else go(next);}
 if(a==='weak'){retry=qs.map((_,i)=>i).filter(i=>!results[i]||first[i]===false);if(!retry.length)retry=qs.map((_,i)=>i);retryAt=0;go(retry[0]);}
 if(a==='restart'&&confirm('처음부터 다시 연습할까요?')){results={};first={};retry=null;go(0);}
});
window.addEventListener('pagehide',cleanup);render();
