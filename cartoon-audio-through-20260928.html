<script>
'use strict';
const entries=JSON.parse(document.getElementById('sentences').textContent);
const translation=document.getElementById('translation');
const audio=document.getElementById('audio'),play=document.getElementById('play'),status=document.getElementById('status'),sentence=document.getElementById('sentence'),page=document.getElementById('page'),list=document.getElementById('list');
async function listen(){try{audio.currentTime=0;await audio.play()}catch(error){status.textContent=error.name==='NotAllowedError'?'재생 버튼을 눌러 주세요.':'소리를 재생하지 못했습니다. 인터넷 연결을 확인한 뒤 다시 눌러 주세요.'}}
function select(){audio.pause();const id=location.hash.slice(1),entry=entries.find(item=>item.id===id);list.hidden=!!entry;play.hidden=!entry;audio.hidden=!entry;play.disabled=!entry;
if(!entry){translation.textContent='';sentence.textContent=id?'문장을 찾을 수 없습니다.':'듣고 싶은 문장을 선택하세요.';page.textContent='';status.textContent='';list.replaceChildren();for(const item of entries){const li=document.createElement('li'),a=document.createElement('a');a.href='#'+item.id;a.textContent=item.page+'쪽 · '+item.text;li.append(a);const meaning=document.createElement('span');meaning.className='meaning';meaning.textContent=item.translation;li.append(meaning);list.append(li)}return}
sentence.textContent=entry.text;translation.textContent=entry.translation;page.textContent='카툰 PDF '+entry.page+'쪽';status.textContent='재생 준비 중';audio.src='data:audio/mpeg;base64,'+entry.audio;listen()}
play.addEventListener('click',listen);audio.addEventListener('playing',()=>status.textContent='재생 중');audio.addEventListener('ended',()=>status.textContent='재생 완료');audio.addEventListener('pause',()=>{if(!audio.ended)status.textContent='일시 정지'});audio.addEventListener('error',()=>status.textContent='소리를 불러오지 못했습니다. 페이지를 새로 열어 주세요.');window.addEventListener('hashchange',select);select();
