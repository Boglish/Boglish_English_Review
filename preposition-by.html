const questions=[
{title:'어느 자리에 앉을까요?',context:'친구와 카페에 왔어요. “창문 곁에 앉자”에 맞는 자리를 고르세요.',target:'Let’s sit by the window.',chunk:'by the window',hint:'창문 곁에 앉자.',choices:['창가 자리','방 가운데 자리','창문에서 먼 자리'],answer:0,icons:['armchair','app-window'],labels:['카페','자리'],explain:'by the window는 창문 곁이라는 위치예요.',source:39},
{title:'평소 출근하는 방법은?',context:'나는 보통 버스를 타고 출근해요.',stem:'I usually go to work ___ bus.',target:'I usually go to work by bus.',chunk:'by bus',hint:'나는 보통 버스로 출근해요.',choices:['on','by','with'],answer:1,icons:['bus','briefcase-business'],labels:['버스','출근'],explain:'교통수단을 말할 때 by bus를 써요. on the bus는 특정 버스에 타고 있는 상황을 말할 때 쓸 수 있어요.',source:5},
{title:'파일을 어떻게 받을까요?',context:'종이로 받는 대신 이메일로 파일을 보내 달라고 해요.',stem:'Can you send me the file ___?',target:'Can you send me the file by email?',chunk:'by email',hint:'그 파일을 이메일로 보내줄 수 있어요?',choices:['by hand','by bus','by email'],answer:2,icons:['file','mail'],labels:['파일','이메일'],explain:'by email은 전달하는 수단이에요. send the file by email처럼 함께 읽어보세요.',source:6},
{title:'금요일이 제출 마감이에요.',context:'목요일에 미리 보내도 괜찮아요. 늦어도 금요일에는 보내야 해요.',stem:'Please send it ___ Friday.',target:'Please send it by Friday.',chunk:'by Friday',hint:'금요일까지 보내 주세요.',choices:['until','by','after'],answer:1,icons:['send','calendar-days'],labels:['보내기','금요일 마감'],explain:'by Friday는 완료의 마감이에요. 금요일까지 계속 보내라는 뜻은 아니에요.',source:8},
{title:'어떤 가방이 내 것일까요?',context:'의자 위 가방은 친구 것이고, 문 곁의 가방이 내 것이에요.',stem:'The bag ___ is mine.',target:'The bag by the door is mine.',chunk:'by the door',hint:'문 곁에 있는 가방은 내 것이에요.',choices:['on the chair','by the door','under the table'],answer:1,icons:['backpack','door-closed'],labels:['가방','문'],explain:'by the door가 앞의 the bag을 꾸며서 어떤 가방인지 알려줘요.',fresh:true},

const icon=name=>`<i data-lucide="${name}" aria-hidden="true"></i>`;

let group=0,order=[0,1,2,3,4],pos=0,stage='quiz',reads=0,wrong=null,picked=[];

let recorder,stream,recognition,timer,asrTimer;
const q=()=>questions[bonus?group*5:order[pos]];

function cleanup(){
 token++;clearInterval(timer);clearTimeout(asrTimer);
 if(recorder&&recorder.state!=='inactive'){try{recorder.stop();}catch{}}
 try{recognition?.abort();}catch{}
 stream?.getTracks().forEach(t=>t.stop());window.speechSynthesis?.cancel();

const listenButton=()=>`<button class="icon" data-action="speak" aria-label="원문 듣기" title="원문 듣기">${icon('volume-2')}</button>`;
const errorView=()=>error?`<p class="status error" role="alert">${esc(error)}</p>`:'';
function recallView(){return `<div class="eyebrow">${bonus?'묶음 마무리 · 다시 꺼내기':'가리고 말하기'}</div><h2>${bonus?'아까 그 문장, 기억나나요?':'장면을 떠올려 말해 보세요.'}</h2><p>${esc(q().hint)}</p>
 <div class="recall ${recording?'recording':''}">${icon(recording?'mic':'eye-off')}<p>${recording?`녹음 중 <span id="seconds">${seconds}</span>초`:pending?'마이크 권한을 확인하고 있어요.':stopping?'녹음을 마무리하고 있어요.':'영어 문장을 가렸어요.'}</p></div>
 ${!recording&&!pending&&!stopping?`<label class="check"><input id="asr" type="checkbox" ${asrOpt?'checked':''} ${!SpeechRecognition?'disabled':''}>음성 인식으로 원문과 비교하기</label><p class="privacy">${SpeechRecognition?'선택하면 음성이 브라우저 제공업체로 전송될 수 있어요. 인식 결과는 발음 점수가 아니에요.':'이 브라우저는 자동 음성 인식을 지원하지 않아요. 녹음을 듣고 직접 비교할 수 있어요.'} 녹음은 다음 문제로 넘어갈 때 지워져요.</p>`:''}
 <div class="actions"><button class="primary" data-action="${recording?'stop':'record'}" ${pending||stopping?'disabled':''}>${icon(recording?'square':'mic')}${recording?'녹음 마치고 비교':'녹음 시작'}</button></div>${errorView()}
 ${!recording&&!stopping?'<div class="quiet"><button class="text" data-action="quiet">마이크 없이 소리 내어 말했어요</button></div>':''}`;}
function compareView(){const exact=match();return `<div class="eyebrow">${bonus?'다시 꺼내기 · ':''}원문과 비교</div><h2>${exact?'인식된 문장이 원문과 같아요.':'내가 말한 문장을 확인해요.'}</h2><div class="sentence-head"><span>원문</span>${listenButton()}</div><p class="english">${highlighted()}</p>
 ${audioUrl?`<label class="muted" for="playback">내 녹음</label><audio id="playback" controls src="${audioUrl}"></audio>`:''}<div class="comparison"><div class="muted">${quiet?'직접 말하기':'음성 인식 결과'}</div><p>${quiet?'녹음 없이 연습했어요. 내가 말한 문장을 원문과 비교해 주세요.':transcript?esc(transcript):esc(asrError||'자동 인식 결과가 없어요. 녹음을 듣고 원문과 직접 비교해 주세요.')}</p></div>
 ${transcript&&!exact?'<p class="diff">원문과 다른 부분이 있어요. 단어와 순서를 비교해 보세요.</p><p class="privacy">인식 오류일 수도 있으니 녹음도 직접 들어보세요.</p>':''}${exact?'<p class="status success">대소문자와 문장부호를 제외한 문장이 일치해요.</p>':`<label class="check"><input id="checked" type="checkbox" ${checked?'checked':''}>${audioUrl?'녹음을 듣고':'내가 말한 내용과'} 원문을 비교했습니다</label>`}
 <div class="actions"><button class="primary" data-action="next" ${exact||checked?'':'disabled'}>${bonus?'묶음 결과 보기':pos===order.length-1?(retryMode?'결과 보기':'한 문장 다시 꺼내기'):'다음 문제'}${icon('arrow-right')}</button><button class="secondary" data-action="retry">${icon('mic')}다시 가리고 말하기</button></div>${errorView()}`;}
function summaryView(){const ids=Array.from({length:5},(_,i)=>group*5+i),correct=ids.filter(i=>attempts[i]===true).length,recorded=ids.filter(i=>completed[i]==='recorded').length;
 return `<div class="eyebrow">${group+1}묶음 · ${groups[group]}</div><h2>고르고, 읽고, 말했어요.</h2><div class="score">${correct} <span class="muted">/ 5</span></div><p class="muted">첫 시도에 맞힌 문제</p><div class="stats"><div><b>${ids.filter(i=>completed[i]).length}문장</b><span class="muted">읽기 · 말하기 완료</span></div><div><b>${recorded}문장</b><span class="muted">녹음하며 연습</span></div></div><p class="status">${recaps[group]?'한 문장 다시 꺼내기 완료 · ':''}전체 ${Object.keys(completed).length} / 20문장</p>
 ${group<3?`<button class="primary" data-action="next-group">${group+2}묶음으로${icon('arrow-right')}</button>`:'<div class="note">오늘 익힌 표현 하나를 내 상황에 바꿔 말해보세요.</div>'}<button class="secondary" data-action="weak" ${ids.some(i=>attempts[i]===false)?'':'disabled'}>${icon('repeat-2')}처음에 틀린 문제 다시 풀기</button><button class="secondary" data-action="restart">이 묶음 처음부터</button>`;}
function answer(correct,choice){if(!(order[pos] in attempts))attempts[order[pos]]=correct;if(correct){stage='read';reads=0;wrong=null;render(true);}else{wrong=choice;render();}}
async function record(){
 if(stage!=='recall'||recording||pending||stopping)return;
 cleanup();const id=token;pending=true;error='';transcript='';asrError='';quiet=false;checked=false;render();
 try{
  if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)throw new Error('unsupported');
  const acquired=await navigator.mediaDevices.getUserMedia({audio:true});if(id!==token){acquired.getTracks().forEach(t=>t.stop());return;}
  stream=acquired;const active=new MediaRecorder(stream);recorder=active;const chunks=[];
  active.ondataavailable=e=>{if(id===token&&e.data.size)chunks.push(e.data);};
  active.onstop=()=>{if(id!==token)return;clearInterval(timer);recording=false;pending=false;stopping=false;try{recognition?.stop();}catch{}stream?.getTracks().forEach(t=>t.stop());if(chunks.length)audioUrl=URL.createObjectURL(new Blob(chunks,{type:active.mimeType||'audio/webm'}));else error='녹음된 소리가 없어요. 다시 녹음하거나 직접 말한 내용과 비교해 주세요.';stage='compare';render(true);};
  active.onerror=()=>{if(id===token){error='녹음을 완료하지 못했어요. 다시 시도해 주세요.';stop();}};
  if(asrOpt&&SpeechRecognition){recognition=new SpeechRecognition();recognition.lang='en-US';recognition.continuous=true;recognition.interimResults=false;
   recognition.onresult=e=>{if(id!==token)return;transcript=Array.from(e.results).filter(r=>r.isFinal).map(r=>r[0].transcript).join(' ');if(stage==='compare')render();};
   recognition.onerror=()=>{if(id!==token)return;asrError='음성 인식을 완료하지 못했어요. 녹음을 듣고 직접 비교해 주세요.';if(stage==='compare')render();};
   try{recognition.start();}catch{asrError='음성 인식을 시작하지 못했어요. 직접 비교해 주세요.';}
  }
  active.start();pending=false;recording=true;seconds=0;render();timer=setInterval(()=>{seconds++;const el=document.querySelector('#seconds');if(el)el.textContent=seconds;if(seconds>=60)stop();},1000);
 }catch(e){if(id!==token)return;cleanup();error=e.name==='NotAllowedError'?'마이크 사용이 허용되지 않았어요. 브라우저 권한을 확인하거나 마이크 없이 연습해 주세요.':'마이크를 사용할 수 없어요. 장치 연결을 확인하거나 마이크 없이 연습해 주세요.';render();}
}
function stop(){if(!recording)return;recording=false;stopping=true;clearInterval(timer);try{recognition?.stop();}catch{}const id=token;asrTimer=setTimeout(()=>{if(id===token){try{recognition?.abort();}catch{}}},3000);if(recorder?.state==='recording')recorder.stop();render();}
function speak(){if(!['read','compare'].includes(stage))return;error='';if(!window.speechSynthesis){error='이 브라우저에서는 원문 듣기를 사용할 수 없어요.';render();return;}window.speechSynthesis.cancel();document.querySelector('audio')?.pause();const id=token;const u=new SpeechSynthesisUtterance(q().target);u.lang='en-US';u.rate=.85;u.onerror=e=>{if(id===token&&!['interrupted','canceled'].includes(e.error)){error='영어 음성을 재생하지 못했어요. 기기의 음성 설정을 확인해 주세요.';render();}};window.speechSynthesis.speak(u);}
app.addEventListener('change',e=>{if(e.target.id==='asr')asrOpt=e.target.checked;if(e.target.id==='checked'){checked=e.target.checked;document.querySelector('[data-action="next"]').disabled=!(checked||match());}});
app.addEventListener('click',e=>{
 const groupButton=e.target.closest('[data-group]');if(groupButton){const next=Number(groupButton.dataset.group);if(next!==group&&(stage==='summary'||confirm('다른 묶음으로 이동할까요? 현재 녹음은 지워지며, 이 묶음은 처음부터 다시 풀게 됩니다.')))startGroup(next);return;}
 const choice=e.target.closest('[data-choice]');if(choice&&stage==='quiz'){const index=Number(choice.dataset.choice);answer(index===q().answer,index);return;}
 const piece=e.target.closest('[data-piece]');if(piece&&stage==='quiz'){const index=Number(piece.dataset.piece);if(!picked.includes(index))picked.push(index);wrong=null;render();return;}
 const remove=e.target.closest('[data-remove]');if(remove&&stage==='quiz'){picked.splice(Number(remove.dataset.remove),1);wrong=null;render();return;}
 const action=e.target.closest('[data-action]')?.dataset.action;if(!action)return;
 if(action==='submit'&&stage==='quiz'&&q().pieces)answer(JSON.stringify(picked)===JSON.stringify(q().sequence),-1);
 if(action==='clear'&&stage==='quiz'){picked=[];wrong=null;render();}
 if(action==='speak')speak();if(action==='read'&&stage==='read'){reads=Math.min(2,reads+1);render();}
 if((action==='hide'&&stage==='read'&&reads===2)||(action==='retry'&&stage==='compare')){cleanup();stage='recall';checked=false;error='';transcript='';render(true);}
 if(action==='record')record();if(action==='stop')stop();
 if(action==='quiet'&&stage==='recall'&&!recording&&!stopping){cleanup();quiet=true;checked=false;transcript='';stage='compare';error='';render(true);}
 if(action==='next'&&stage==='compare'&&(checked||match())){
  if(bonus){recaps[group]=true;cleanup();bonus=false;stage='summary';}
  else{completed[order[pos]]=audioUrl?'recorded':completed[order[pos]]||'self';cleanup();pos++;if(pos>=order.length){if(retryMode)stage='summary';else{bonus=true;stage='recall';}}else stage='quiz';}
  resetQuestion();render(true);
 }
 if(action==='next-group'&&stage==='summary'&&group<3)startGroup(group+1);
 if(action==='restart'&&(stage==='summary'||confirm('이 묶음의 점수와 진행을 지우고 처음부터 시작할까요?'))){for(let i=group*5;i<group*5+5;i++){delete attempts[i];delete completed[i];}delete recaps[group];startGroup(group);}
 if(action==='weak'&&stage==='summary'){const ids=Array.from({length:5},(_,i)=>group*5+i).filter(i=>attempts[i]===false);if(ids.length){cleanup();order=ids;pos=0;stage='quiz';bonus=false;retryMode=true;resetQuestion();render(true);}}
});
window.addEventListener('pagehide',cleanup);
window.addEventListener('pageshow',()=>{if(stage==='recall'){pending=false;recording=false;stopping=false;render();}});
if(document.modelContext?.registerTool)document.modelContext.registerTool({name:'review_state',description:'Read BY review progress without revealing hidden answers.',inputSchema:{type:'object',properties:{}},execute:async()=>({content:[{type:'text',text:JSON.stringify({stage,group:group+1,question:bonus?'recap':pos+1,total:order.length,reads,recording})}]})});
render();
</script></body></html>
