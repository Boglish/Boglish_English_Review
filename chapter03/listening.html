<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chapter 3 · 듣기와 번역</title><link rel="stylesheet" href="style.css"><style>.listen{max-width:700px;margin:35px auto;background:white;padding:34px;border-radius:22px}.tools{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0}.tools button{min-height:46px}.row{padding:30px 0;border-top:1px solid #e5eaf2}.en{font-size:26px;font-weight:700;line-height:1.5;margin:0 0 14px;overflow-wrap:anywhere}.ko{font-size:19px;color:#576779;line-height:1.8;margin:12px 0}.note{font-size:14px;line-height:1.8;color:#7a8798}audio{width:100%;height:40px;margin-top:12px}.playing{border-left:4px solid #1c60df;padding-left:16px}.translations-off .ko,.translations-off .note{display:none}select{font:inherit;padding:12px;border:1px solid #d6deeb;border-radius:9px;width:100%;background:#fff;color:#213551}.toggle{background:#eff5ff;color:#205fbf;border:1px solid #d3e2fa;border-radius:10px;padding:12px 16px}#state{font-size:14px;color:#536780;min-height:22px}@media(max-width:700px){.listen{margin:0;padding:28px 24px;border-radius:0}h1{font-size:34px}.en{font-size:25px}}
</style></head><body><header class="top"><a class="brand" href="index.html">도형영어 <span>CH. 3</span></a><a id="return" class="mode" href="index.html">설명으로 돌아가기</a></header><main class="listen"><div class="label">LISTEN & UNDERSTAND</div><h1>소리로 듣고,<br><em>뜻을 연결해요.</em></h1><p class="body" style="min-height:0">영어 문장을 듣고 우리말 뜻을 확인하세요.<br>익숙해지면 번역을 가리고 다시 들어보세요.</p><p class="small">미국 영어 합성음성 시안 · 우리말 번역은 글로 제공됩니다.<br>강세·억양 비교용 최종 녹음은 추후 별도 검수할 예정입니다.</p><label for="filter" class="label">학습 화면 선택</label><select id="filter"><option value="0">모든 문장</option><option value="1">1. give 뒤의 두 자리</option><option value="2">2. 같은 장면, 두 구조</option><option value="3">3. 묻는 자리와 초점</option><option value="4">4. 의문문 만들기</option><option value="5">5. 하나의 문장 덩어리</option><option value="6">6. 직접 질문하기</option></select><div class="tools"><button class="primary" id="all">▶ 선택 문장 이어 듣기</button><button class="toggle" id="stop">정지</button><button class="toggle" id="translation" aria-pressed="false">번역 가리기</button></div><p id="state" role="status">아래 재생 버튼으로 한 문장씩 들을 수도 있어요.</p><div id="sentences"></div><p class="small">Give me that. / Give it to me.는 자연스러운 우리말 번역이 같을 수 있어요. 두 영어 표현의 어순과 초점은 설명 화면에서 함께 확인하세요.</p></main><script src="listening-data.js"></script><script>
const rows=document.getElementById('sentences'),filter=document.getElementById('filter'),state=document.getElementById('state');let players=[],sequence=false,active=-1;
function stop(){sequence=false;players.forEach(a=>{a.pause();a.currentTime=0});document.querySelectorAll('.row').forEach(r=>r.classList.remove('playing'));active=-1;state.textContent='재생을 멈췄어요.';}
function play(i){if(i>=players.length){sequence=false;state.textContent='선택한 문장을 모두 들었어요.';return}active=i;players[i].play().catch(()=>{sequence=false;state.textContent='재생 버튼을 다시 눌러 주세요.'});}
function render(){stop();rows.replaceChildren();players=[];const n=Number(filter.value);LISTENING.filter(d=>!n||d.pages.includes(n)).forEach(d=>{const el=document.createElement('section');el.className='row';el.id='track-'+d.id;const en=document.createElement('p');en.className='en';en.lang='en';en.textContent=d.en;const ko=document.createElement('p');ko.className='ko';ko.textContent=d.ko;const a=document.createElement('audio');a.controls=true;a.preload='none';a.src=`audio/${d.id}.wav`;a.setAttribute('aria-label',d.en+' 듣기');const i=players.length;players.push(a);a.onplay=()=>{if(sequence&&active!==i)sequence=false;active=i;players.forEach((x,j)=>{if(j!==i)x.pause()});document.querySelectorAll('.row').forEach(r=>r.classList.remove('playing'));el.classList.add('playing');state.textContent=d.en};a.onended=()=>{el.classList.remove('playing');if(sequence)play(i+1)};a.onerror=()=>{sequence=false;state.textContent='음성 파일을 불러오지 못했어요. audio 폴더가 함께 있는지 확인해 주세요.'};el.append(en,ko,a);if(d.note){const note=document.createElement('p');note.className='note';note.textContent=d.note;el.append(note)}rows.append(el)});document.getElementById('return').href='index.html#page='+(n||1);state.textContent=players.length+'개 문장 · 영어를 듣고 뜻을 확인해 보세요.';}
filter.onchange=()=>{location.hash='page='+filter.value;render()};document.getElementById('all').onclick=()=>{stop();sequence=true;play(0)};document.getElementById('stop').onclick=stop;document.getElementById('translation').onclick=e=>{const hidden=rows.classList.toggle('translations-off');e.target.textContent=hidden?'번역 보기':'번역 가리기';e.target.setAttribute('aria-pressed',String(hidden))};window.addEventListener('pagehide',stop);const m=location.hash.match(/page=([0-6])/);if(m)filter.value=m[1];render();const selectedTrack=location.hash.match(/track=(\d{2})/);if(selectedTrack){const row=document.getElementById('track-'+selectedTrack[1]);if(row){row.classList.add('playing');row.scrollIntoView({block:'center'});state.textContent='PDF에서 선택한 문장이에요. 재생 버튼을 눌러 들어보세요.'}}
</script></body></html>
