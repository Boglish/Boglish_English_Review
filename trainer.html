<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>영어 자동화 트레이너</title>
<style>
:root{
  --bg:#f6f5f2; --card:#ffffff; --ink:#1c1b1a; --ink2:#5f5b57; --ink3:#928c86;
  --line:#e6e2dc; --accent:#2f6f5e; --accent-soft:#e6f0ec; --accent-ink:#1d4a3e;
  --warn:#b4552a; --warn-soft:#fbeee7; --good:#2f6f5e; --bad:#b03a2e; --bad-soft:#fbe9e7;
  --gold:#a8802a; --shadow:0 1px 2px rgba(28,27,26,.05),0 6px 20px rgba(28,27,26,.06);
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--ink);
  font-family:'Pretendard','Pretendard Variable',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Segoe UI','Malgun Gothic',system-ui,sans-serif;
  font-size:16px;line-height:1.55;letter-spacing:-.01em;
  padding-bottom:40px;
}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,textarea{font-family:inherit;font-size:inherit}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}

/* ---------- header ---------- */
header{
  position:sticky;top:0;z-index:40;background:rgba(246,245,242,.88);
  backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line);
}
.hbar{display:flex;align-items:center;gap:10px;height:56px}
.brand{display:flex;align-items:center;gap:9px;font-weight:750;letter-spacing:-.02em;cursor:pointer}
.brand .dot{width:22px;height:22px;border-radius:7px;background:var(--accent);color:#fff;
  display:grid;place-items:center;font-size:12px;font-weight:800}
.spacer{flex:1}
.iconbtn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--ink2);
  border:1px solid transparent}
.iconbtn:hover{background:#eeece7;color:var(--ink)}
.iconbtn.on{background:var(--accent-soft);color:var(--accent-ink);border-color:#cfe2da}

/* ---------- generic ---------- */
h1{font-size:26px;font-weight:800;letter-spacing:-.03em;margin:22px 0 4px}
h2{font-size:15px;font-weight:750;letter-spacing:-.02em;margin:0 0 10px;color:var(--ink)}
.sub{color:var(--ink2);font-size:14px;margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:16px}
.muted{color:var(--ink3)}
.row{display:flex;align-items:center;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:#fff;
  font-size:13.5px;font-weight:600;color:var(--ink2);transition:.12s}
.chip:hover{border-color:#cdc7c0}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.sm{font-size:12.5px;padding:4px 9px}
.btn{padding:10px 16px;border-radius:11px;background:var(--accent);color:#fff;font-weight:700;font-size:14.5px}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:#f3f1ed}
.btn.wide{width:100%;text-align:center}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* ---------- home ---------- */
.scope{margin:14px 0 20px}
.scopehead{display:flex;align-items:baseline;gap:8px;margin-bottom:9px;flex-wrap:wrap}
.scopehead b{font-size:13px;font-weight:750;letter-spacing:-.01em;white-space:nowrap}
.scopehead span{font-size:12.5px;color:var(--ink3)}
.modegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(238px,1fr));gap:11px;margin-bottom:26px}
.mode{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px 15px 14px;
  text-align:left;box-shadow:var(--shadow);transition:.14s;display:block;position:relative;overflow:hidden}
.mode:hover{transform:translateY(-2px);border-color:#d6d0c8;box-shadow:0 2px 4px rgba(28,27,26,.05),0 12px 28px rgba(28,27,26,.09)}
.mode .ic{font-size:19px;margin-bottom:9px;display:block}
.mode .t{display:block;font-weight:750;font-size:15.5px;letter-spacing:-.02em}
.mode .d{display:block;font-size:12.8px;color:var(--ink2);margin-top:3px;line-height:1.45}
.mode .tag{position:absolute;top:13px;right:13px;font-size:10.5px;font-weight:700;color:var(--accent-ink);
  background:var(--accent-soft);padding:2px 7px;border-radius:999px}

/* unit picker */
.unitgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;max-height:290px;overflow:auto;
  padding:3px;margin-top:4px}
.ubtn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 9px;text-align:left;
  font-size:12.8px;line-height:1.3;transition:.1s;display:flex;gap:6px;align-items:baseline}
.ubtn:hover{border-color:#cdc7c0;background:#faf9f7}
.ubtn.on{background:var(--accent-soft);border-color:#b9d5cb;color:var(--accent-ink)}
.ubtn .n{font-weight:800;font-size:11px;color:var(--ink3);min-width:17px}
.ubtn.on .n{color:var(--accent)}
.ubtn .tt{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.ubtn .c{font-size:10.5px;color:var(--ink3);font-weight:600}

/* ---------- study ---------- */
.topbar{display:flex;align-items:center;gap:10px;margin:16px 0 12px}
.topbar .ttl{font-weight:750;letter-spacing:-.02em;font-size:16px}
.prog{height:5px;background:#e9e6e1;border-radius:99px;overflow:hidden;margin-bottom:16px}
.prog i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.stat{display:flex;gap:14px;font-size:12.5px;color:var(--ink2);font-weight:650}
.stat b{color:var(--ink);font-weight:800}

.stage{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);
  padding:24px 20px;min-height:250px;display:flex;flex-direction:column}
.qlabel{font-size:11.5px;font-weight:750;letter-spacing:.04em;color:var(--ink3);text-transform:uppercase;margin-bottom:10px}
.ko{font-size:20px;font-weight:700;letter-spacing:-.02em;line-height:1.45}
.en{font-size:21px;font-weight:650;letter-spacing:-.01em;line-height:1.5;word-break:break-word}
.en.big{font-size:24px}
.meta{font-size:11.5px;color:var(--ink3);margin-top:14px;font-weight:600}

/* flashcard */
.fc{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;
  padding:10px 0;cursor:pointer}
.fc .hint{font-size:12px;color:var(--ink3)}
.reveal{border-top:1px dashed var(--line);padding-top:14px;width:100%}

/* word bank */
.answerbox{min-height:64px;border:1.5px dashed var(--line);border-radius:12px;padding:10px;
  display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;background:#fcfbf9;margin:14px 0}
.answerbox.ok{border-color:#a9cbc0;background:#f2f8f5;border-style:solid}
.answerbox.no{border-color:#e3b5ae;background:var(--bad-soft);border-style:solid}
.bank{display:flex;flex-wrap:wrap;gap:6px}
.tok{padding:7px 12px;border-radius:9px;border:1px solid var(--line);background:#fff;font-size:15px;font-weight:600;
  transition:.1s;box-shadow:0 1px 1px rgba(0,0,0,.03)}
.tok:hover{border-color:#c3bcb3;background:#faf9f7}
.tok.used{opacity:.22;pointer-events:none}
.tok.sel{background:var(--accent-soft);border-color:#b9d5cb;color:var(--accent-ink)}

/* choices */
.choices{display:grid;gap:8px;margin-top:16px}
.choice{padding:12px 14px;border:1px solid var(--line);border-radius:11px;background:#fff;text-align:left;
  font-size:15.5px;font-weight:600;transition:.1s}
.choice:hover{border-color:#c3bcb3;background:#faf9f7}
.choice.ok{background:var(--accent-soft);border-color:#8fbfae;color:var(--accent-ink);font-weight:750}
.choice.no{background:var(--bad-soft);border-color:#e3b5ae;color:var(--bad)}
.blankw{display:inline-block;min-width:78px;border-bottom:2.5px solid var(--accent);margin:0 3px;
  text-align:center;font-weight:800;color:var(--accent)}

/* input */
.tinput{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fcfbf9;
  font-size:17px;font-weight:600;outline:none;transition:.12s}
.tinput:focus{border-color:var(--accent);background:#fff}
.diffline{font-size:19px;font-weight:650;line-height:1.6;word-break:break-word}
.diffline .g{color:var(--good)}
.diffline .b{color:var(--bad);text-decoration:line-through;text-decoration-thickness:1.5px;opacity:.75}
.diffline .m{color:var(--bad);background:var(--bad-soft);border-radius:4px;padding:0 3px}

/* roleplay */
.turns{display:flex;flex-direction:column;gap:9px;margin-bottom:6px}
.turn{display:flex;gap:9px;align-items:flex-start}
.av{width:26px;height:26px;border-radius:8px;flex:none;display:grid;place-items:center;font-size:11.5px;font-weight:800;
  background:#eeece7;color:var(--ink2);margin-top:2px}
.turn.me .av{background:var(--accent);color:#fff}
.bub{background:#f4f2ee;border-radius:12px;padding:9px 13px;font-size:15.5px;font-weight:600;line-height:1.45}
.turn.me .bub{background:var(--accent-soft);color:var(--accent-ink)}
.bub .kot{display:block;font-size:12.5px;color:var(--ink3);font-weight:550;margin-top:3px}
.bub .play{margin-left:6px;opacity:.45;font-size:12px}

/* mic */
.micbtn{width:60px;height:60px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;
  font-size:23px;box-shadow:0 4px 14px rgba(47,111,94,.3);transition:.15s;flex:none}
.micbtn:hover{transform:scale(1.05)}
.micbtn.rec{background:var(--warn);animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(180,85,42,.45)}50%{box-shadow:0 0 0 13px rgba(180,85,42,0)}}
.score{font-size:34px;font-weight:850;letter-spacing:-.03em}
.score.g{color:var(--good)} .score.y{color:var(--gold)} .score.r{color:var(--bad)}

.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px;align-items:center}
.fb{padding:9px 13px;border-radius:10px;font-size:14px;font-weight:700}
.fb.ok{background:var(--accent-soft);color:var(--accent-ink)}
.fb.no{background:var(--bad-soft);color:var(--bad)}

/* settings sheet */
.sheet{position:fixed;inset:0;background:rgba(28,27,26,.35);display:none;z-index:60;align-items:flex-end;justify-content:center}
.sheet.open{display:flex}
.sheetin{background:#fff;border-radius:18px 18px 0 0;width:100%;max-width:520px;padding:20px 18px 26px;
  box-shadow:0 -8px 40px rgba(0,0,0,.18);max-height:86vh;overflow:auto}
@media(min-width:560px){.sheet{align-items:center}.sheetin{border-radius:18px}}
.frow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.frow:last-child{border:0}
.frow label{font-size:14.5px;font-weight:650}
.frow .hintt{font-size:12px;color:var(--ink3);font-weight:500;margin-top:2px}
select{padding:7px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;font-size:14px;max-width:200px}
input[type=range]{width:150px;accent-color:var(--accent)}

.done{text-align:center;padding:34px 16px}
.done .big{font-size:44px;font-weight:850;letter-spacing:-.04em;margin:8px 0}
.summary{display:flex;justify-content:center;gap:26px;margin:18px 0 24px;flex-wrap:wrap}
.summary div{text-align:center}
.summary b{display:block;font-size:24px;font-weight:800}
.summary span{font-size:12px;color:var(--ink3);font-weight:650}
.revlist{text-align:left;max-height:260px;overflow:auto;margin-top:14px}
.revitem{padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.revitem .e{font-weight:650} .revitem .k{color:var(--ink3);font-size:12.5px}
.notice{background:var(--warn-soft);color:var(--warn);padding:9px 12px;border-radius:10px;font-size:13px;font-weight:600;margin-top:12px}
kbd{background:#eeece7;border-radius:5px;padding:1px 6px;font-size:11.5px;font-weight:700;font-family:inherit;color:var(--ink2)}
</style>
</head>
<body>
<header><div class="wrap hbar">
  <div class="brand" onclick="go('home')"><span class="dot">A</span><span>영어 자동화 트레이너</span></div>
  <div class="spacer"></div>
  <a class="iconbtn" href="index.html" title="목록으로" style="text-decoration:none;font-weight:700">☰</a>
  <button class="iconbtn" id="btnSound" title="음성 켜기/끄기" onclick="toggleSound()">🔊</button>
  <button class="iconbtn" title="설정" onclick="openSheet()">⚙️</button>
</div></header>

<main class="wrap" id="view"></main>

<div class="sheet" id="sheet" onclick="if(event.target.id==='sheet')closeSheet()">
 <div class="sheetin">
  <h2 style="font-size:17px;margin-bottom:14px">설정</h2>
  <div class="frow"><div><label>영어 음성</label><div class="hintt" id="voiceHint">브라우저에 설치된 음성</div></div>
    <select id="voiceSel" onchange="S.voice=this.value"></select></div>
  <div class="frow"><div><label>읽기 속도</label><div class="hintt"><span id="rateVal">0.9</span>배</div></div>
    <input type="range" min="0.5" max="1.3" step="0.05" value="0.9" oninput="S.rate=+this.value;document.getElementById('rateVal').textContent=this.value"></div>
  <div class="frow"><div><label>정답 자동 읽어주기</label><div class="hintt">정답을 맞히면 문장을 읽어줍니다</div></div>
    <input type="checkbox" id="autoSpeak" checked onchange="S.autoSpeak=this.checked" style="width:20px;height:20px;accent-color:var(--accent)"></div>
  <div class="frow"><div><label>한국어 뜻 먼저 보기</label><div class="hintt">플래시카드에서 한국어를 먼저 보여줍니다</div></div>
    <input type="checkbox" id="koFirst" checked onchange="S.koFirst=this.checked" style="width:20px;height:20px;accent-color:var(--accent)"></div>
  <div class="frow"><div><label>문항 수</label><div class="hintt">한 세션에 풀 문제 개수</div></div>
    <select id="lenSel" onchange="S.sessionLen=+this.value">
      <option value="10">10문제</option><option value="20" selected>20문제</option>
      <option value="30">30문제</option><option value="9999">전체</option></select></div>
  <button class="btn wide" style="margin-top:18px" onclick="closeSheet()">닫기</button>
 </div>
</div>

","d":2},{"i":374,"en":"Hmm.. Do you guys always eat together in groups at restaurants?","ko":"음.. 너희는 항상 식당에서 같이 모여서 먹어?","u":7,"ut":"Are you","sec":"대화해보기","lv":"talk","nw":11,"sp":"B","d":2},{"i":375,"en":"Most of time, yes. Eating together is important here.","ko":"대부분은 그래. 같이 먹는 게 여기서는 중요하지.","u":7,"ut":"Are you","sec":"대화해보기","lv":"talk","nw":9,"sp":"A","d":2},{"i":376,"en":"I noticed that. Does this mean it’s rude to eat alone or before others?","ko":"나도 그렇게 느꼈어. 혼자 혹은 먼저 먹는 게 실례라는 의미인가?","u":7,"ut":"Are you","sec":"대화해보기","lv":"talk","nw":14,"sp":"B","d":3},{"i":377,"en":"Not really. You can eat alone, but people around you might be curious about it.","ko":"꼭 그런 건 아니야. 혼자 먹어도 돼, 하지만 주변 사람들이 궁금해할 수도 있어.","u":7,"ut":"Are you","sec":"대화해보기","lv":"talk","nw":15,"sp":"A","d":3},{"i":378,"en":"Oh, I see. By the way, can I get some tips on using public transportation here?","ko":"아 알겠어. 그건 그렇고 대중교통 이용하는데 팀 좀 얻을 수 있을까?","u":7,"ut":"Are you","sec":"대화해보기","lv":"talk","nw":16,"sp":"B","d":3},{"i":379,"en":"Sure! The subway is very convenient. There are signs in English everywhere. You don’t have to worry.","ko":"물론이지. 여긴 지하철이 아주 편리해. 어디나 영어로 된 표지판이 있어. 걱정할 필요 없어.","u":7,"ut":"Are you","sec":"대화해보기","lv":"talk","nw":17,"sp":"A","d":3},{"i":380,"en":"That’s good to know. And is this why people prefer to use the subway instead of driving?","ko":"알아서 다행이다. 그래서 사람들이 운전보다는 항상 지하철을 이용하는 걸 좋아하는 거야?","u":7,"ut":"Are you","sec":"대화해보기","lv":"talk","nw":17,"sp":"B","d":3},{"i":381,"en":"Exactly. Traffic can be bad, so it’s faster and cheaper.","ko":"정확해. 교통체증이 심할 수 있어서, 그게 더 빠르거든 그리고 싸고.","u":7,"ut":"Are you","sec":"대화해보기","lv":"talk","nw":10,"sp":"A","d":2},{"i":382,"en":"Make sense. Oh let me ask one more. How do people usually greet each other here?","ko":"그렇구나. 아, 하나만 더 물어볼게. 여기 사람들은 보통 인사를 어떻게 해?","u":7,"ut":"Are you","sec":"대화해보기","lv":"talk","nw":16,"sp":"B","d":3},{"i":383,"en":"A small bow is common. And if it’s a friend, just a wave is fine.","ko":"가벼운 목례가 일반적이지. 친구라면 ng?","ko":"나는 보통 토스트나 시리얼을 먹어. 아침에 국 먹는 게 흔해?","u":8,"ut":"What do you What are you","sec":"대화해보기","lv":"talk","nw":17,"sp":"Ashley","d":3},{"i":427,"en":"Yes, it’s very common here. Does this sound strange to you?","ko":"응, 여기선 아주 흔해. 너에게는 좀 이상하게 들려?","u":8,"ut":"What do you What are you","sec":"대화해보기","lv":"talk","nw":11,"sp":"Minji","d":2},{"i":428,"en":"A little, but I’d love to try it. Can I get a recommendation for a good place to try a Korean breakfast?","ko":"조금? 하지만 먹어보고 싶어. 한국식 아침을 먹을 만한 좋은 곳 추천해 줄 수 있어?","u":8,"ut":"What do you What are you","sec":"대화해보기","lv":"talk","nw":22,"sp":"Ashley","d":3},{"i":429,"en":"Sure! There’s a small restaurant near my place. It’s getting pretty popular these days because of its traditional vibe.","ko":"그럼! 우리 집 근처에 작은 식당이 있어. 요즘 전통적인 분위기 덕분에 꽤 인기 있어지고 있어.","u":8,"ut":"What do you What are you","sec":"대화해보기","lv":"talk","nw":19,"sp":"Minji","d":3},{"i":430,"en":"That sounds great. What are you planning to do this weekend?","ko":"그거 좋다. 너 이번 주말에 뭐 할 계획이야?","u":8,"ut":"What do you What are you","sec":"대화해보기","lv":"talk","nw":11,"sp":"Ashley","d":2},{"i":431,"en":"I’m going to visit a traditional market. Do you wanna come with me?","ko":"전통 시장 좀 가 보려고. 같이 갈래?","u":8,"ut":"What do you What are you","sec":"대화해보기","lv":"talk","nw":13,"sp":"Minji","d":3},{"i":432,"en":"That sounds fun! Are there any special foods or things I should look for there?","ko":"그거 재밌겠다! 거기에 특별한 음식이나 봐야 할 게 있어?","u":8,"ut":"What do you What are you","sec":"대화해보기","lv":"talk","nw":15,"sp":"Ashley","d":3},{"i":433,"en":"Yes! Let me show you the street food there. You’ll love tteokbokki and hotteok.","ko":"응! 내가 거기서 길거리 음식을 보여줄게. 떡볶이랑 호떡 좋아할 거야.","u":8,"ut":"What do you What are you","sec":"대화해보기","lv":"talk","nw":14,"sp":"Minji","d":3},{"i":434,"en":"Is this where I can also find handmade goods?","ko":"거기가 수공예품도 찾을 수 있는 곳이야?","u":8,"ut":"What do you What are you","sec":"대화해보기","lv":"talk","nw":9,"sp":"Ashley","d":2},{"i":435,"en":"Absolutely! There’s a stal ’s interesting. Is this common in all Southeast Asian countries?","ko":"그거 재미있네. 이게 모든 동남아 국가에서 흔한 일인가?","u":9,"ut":"What are you gonna","sec":"대화해보기","lv":"talk","nw":10,"sp":"Alex","d":2},{"i":471,"en":"Mostly, yes. But of course, it depends on the country and the family. Oh, and they love street food! Have you ever tried Southeast Asian Street food?","ko":"대부분 그래. 하지만 물론 나라나 가족에 따라 다르기도 하지. 아 그리고 길거리 음식을 정말 좋아해. 동남아시아 길거리 음식 먹어본 적 있어?","u":9,"ut":"What are you gonna","sec":"대화해보기","lv":"talk","nw":27,"sp":"Emily","d":3},{"i":472,"en":"Yeah, I had Thai food once. Does this mean they eat street food every day?","ko":"응, 태극 음식 한번 먹어봤어. (그럼) 그들은 매일 길거리 음식을 먹는다는 거야?","u":9,"ut":"What are you gonna","sec":"대화해보기","lv":"talk","nw":15,"sp":"Alex","d":3},{"i":473,"en":"Not every day, but very often. It’s cheaper than eating at home, so it can be convenient. Can I get Thai street food in our city?","ko":"매일은 아니지만, 꽤 자주 먹어. 집에서 먹는 것보다 싸니, 편리할 수 있거든. 우리 도시에서도 태국 길거리 음식을 먹을 수 있나?","u":9,"ut":"What are you gonna","sec":"대화해보기","lv":"talk","nw":26,"sp":"Emily","d":3},{"i":474,"en":"Yeah, there’s a Thai food truck downtown. Do you want me to take you there this weekend?","ko":"응, 시내에 태국 음식 트럭이 있어. 이번 주말에 내가 거기 데려갈까?","u":9,"ut":"What are you gonna","sec":"대화해보기","lv":"talk","nw":17,"sp":"Alex","d":3},{"i":475,"en":"Sounds great! Oh, and I heard that in Southeast Asia, people don’t rush much. Is this true?","ko":"그거 좋지! 아, 그리고 동남아에서는 사람들이 그렇게 급하게 행동하지 않는다고 들었어. 이거 사실이야?","u":9,"ut":"What are you gonna","sec":"대화해보기","lv":"talk","nw":17,"sp":"Emily","d":3},{"i":476,"en":"Yeah, it seems like that. Everything’s getting late. By the way, I should go now.","ko":"응, 그런 거 같아. 모든 게 늦어지지. 암튼 나 가야겠다.","u":9,"ut":"What are you gonna","sec":"대화해보기","lv":"talk","nw":15,"sp":"Alex","d":3},{"i":477,"en":"Alright! What are you gonna do tomorrow?","ko":"알겠어! 내일 뭐 할 거야?","u":9,"ut":"What are you gonna","sec":"대화해보기","lv":"talk","nw":7,"sp":"Emily","d":2},{"i":478,"en":"I’m gonna meet some friends. till valid? It can be a big problem if it expires before your trip.","ko":"먼저 여권이 아직 유효한지 확인하시겠어요? 만약 여행 전에 만료되면 큰 문제가 될 수 있어요","u":10,"ut":"It can be","sec":"연습하기","lv":"basic","nw":22,"sp":null,"d":3},{"i":516,"en":"Also, there is always a chance that you might need a visa, depending on where you're going. Do you want me to help you check that?","ko":"또한, 어디로 가느냐에 따라 비자가 필요할 가능성도 있어요. 확인하는 거 도와줄까요?","u":10,"ut":"It can be","sec":"연습하기","lv":"basic","nw":26,"sp":null,"d":3},{"i":517,"en":"Now, what are you gonna pack? It’s getting colder these days, but if you're going somewhere hot, a light jacket might be enough.","ko":"자 이제 뭘 쌀 건가요? 요즘 추워지고 있지만 더운 곳으로 간다면 가벼운 재킷 정도면 충분할 수도 있어요","u":10,"ut":"It can be","sec":"연습하기","lv":"basic","nw":23,"sp":null,"d":3},{"i":518,"en":"There are also many travel-size items you can get, like shampoo and toothpaste, so your bag doesn’t get too heavy.","ko":"챙겨갈 수 있는 샴푸나 치약도 여행용 사이즈 제품들이 많아요. 그래서 가방을 무겁지 않게 할 수 있죠","u":10,"ut":"It can be","sec":"연습하기","lv":"basic","nw":20,"sp":null,"d":3},{"i":519,"en":"Does this sound like too much to prepare? It can be a little stressful, but it’ll be worth it. Also don’t forget to check your flight time.","ko":"준비할 게 너무 많아 보이나요? 스트레스를 좀 받을 수 있지만, 충분히 가치가 있을 거예요. 그리고 비행기 시간도 꼭 확인하는 거 잊지 마세요","u":10,"ut":"It can be","sec":"연습하기","lv":"basic","nw":27,"sp":null,"d":3},{"i":520,"en":"What do you usually do before a long flight? Some people download movies, and others bring books. It would be nice to have something to keep you entertained.","ko":"긴 비행 전에 보통 뭘 (준비) 하세요? 어떤 사람들은 영화를 다운로드하고, 책을 가져가는 이들도 있죠. 즐길 수 있는 뭔가를 준비하는 게 좋을 거에요","u":10,"ut":"It can be","sec":"연습하기","lv":"basic","nw":28,"sp":null,"d":3},{"i":521,"en":"And one more thing—money! Can I get cash at the airport, or should I exchange money before I go? It must be more expensive at the airport, so it's better to prepare in advance.","ko":"그리고 한 가지 더, 돈이죠. 공항에서 현금을 찾을 수 있을까요? 아니면 떠나기 전에 환전을 해야 할 까요? 공항에서는 환율이 더 비쌀 테니 미리 준비하는 게 나아요","u":10,"ut":"It can be","sec":"연습하기","lv":"basic","nw":35,"sp":null,"d":3},{"i":522,"en":"Anyway, I hope your trip goes well! Traveling can be so exciting, but a little planning makes everything much easier.","ko":"어쨌든, 여행 잘 하길 바라요. 여행은 신나는 일이지만, 조금만 준비하면 훨씬 더 손쉬워질 거에요","u":10,"ut":"It can be","sec":"연습하기","lv":"basic","nw":20,"sp":null,"d":3},{"i":523,"en":"What would you do?","ko":"어떻게 할 것 같아?","u":11,"ut":"What would you","sec":"기본 표현","lv":"basic","nw":4,"sp":null,"d":1},{"i":524,"en":"What would you say?","ko":"뭐라고 말할 것 같아?","u":11,"ut":"What would you","sec":"기본 표현","lv":"basic","nw":4,"sp":null,"d":1},{"i":525,"en":"What would you suggest?","ko":"어떤 걸 제안하시겠어요?","u":11,"ut":"What would you","sec":"기본 표현","lv":"basic","nw":4,"sp":null,"d":1},{"i":526,"en":"What would you like to do?","ko":"뭐 하고 싶을 것 같아?","u":11,"ut":"What would you","sec":"기본 표현","lv":"basic","nw":6,"sp":null,"d":1},{"i":527,"en":"What would you like to be?","ko":"뭐 되고 싶을 것 같아?","u":11,"ut":"What would you","sec":"기본 표현","lv":"basic","nw":6,"sp":null,"d":1},{"i":528,"en":"What would you do in this situation?","ko":"이런 상황에서는 어떻게 하시겠어요?","u":11,"ut":"What would you","sec":"기본 표현","lv":"basic","nw":7,"sp":null,"d":2},{"i":529,"en":"What would you prefer, coffee or tea?","ko":"커피랑 차 중에 뭘 더 좋아하니?","u":11,"ut":"What would you","sec":"기본 표현","lv":"basic","nw":7,"sp":null,"d":2},{"i":530,"en":"What would you choose: money or happiness?","ko":"돈과 행복 중에 뭘 선택할 거니?","u":11,"ut":"What would you","sec":"기본 표현","lv":"basic","nw":7,"sp":null,"d":2},{"i":531,"en":"What would you like to do this weekend?","ko":"이번 주말에 뭘 하고 싶어?","u":11,"ut":"What would you","sec":"기본 표현","lv":"basic","nw":8,"sp":null,"d":2},{"i":532,"en":"What would you think about going to the movies tonight?","ko":"오늘 저녁에 영화 보는 거 어떻게 생각해?","u":11,"ut":"What would you","sec":"기본 표현","lv":"basic","nw":10,"sp":null,"d":2},{"i":533,"en":"What would you do if you won the lottery?","ko":"복권 당첨되면 뭐 할 거야?","u":11,"ut":"What would you","sec":"가정하기","lv":"basic","nw":9,"sp":null,"d":2},{"i":534,"en":"What would you do if you lost your phone overseas?","ko":"해외에서 전화기 잃어버리면 어떻게 할 거야?","u":11,"ut":"What would you","sec":"가정하기","lv":"basic","nw":10,"sp":null,"d":2},{"i":535,"en":"What would you ask if you met the president?","ko":"대통령 만나면 뭘 물어볼 거니?","u":11,"ut":"What would you","sec":"가정하기","lv":"basic","nw":9,"sp":null,"d":2},{"i":536,"en":"What would you like to be when you grow up?","ko":"크면 뭐 되고 싶어?","u":11,"ut":"What would you","sec":"가정하기","lv":"basic","nw":10,"sp":null,"d":2},{"i":537,"en":"What would you say to someone who wants to learn English?","ko":"영어 배우고 싶어 하는 사람한테 뭐라고 말해 줄 거야?","u":11,"ut":"What would you","sec":"가정하기","lv":"basic","nw":11,"sp":null,"d":2},{"i":538,"en":"Can I ask you something? What would you do if a local liked you while you were overseas? Would you date them?","ko":"뭐 물어봐도 될까? 외국 갔을 때 현지인이 너 좋아하면 어떻게 할 거야? 사귈 거야?","u":11,"ut":"What would you","sec":"다른 문장과 함께 쓰기","lv":"basic","nw":22,"sp":null,"d":3},{"i":539,"en":"Can you help me decide? What would you buy, an electric car or a gasoline one?","ko":"결정하는 거 도와줄 수 있어? 넌 전기차랑 가솔린차 중에 어떤 걸 살 거 같아?","u":11,"ut":"What would you","sec":"다른 문장과 함께 쓰기","lv":"basic","nw":16,"sp":null,"d":3},{"i":540,"en":"There is a big sale next week! What would you buy when you get there?","ko":"다음 주에 대박 세일 있어! 거기 가면 뭘 살 거야?","u":11,"ut":"What would you","sec":"다른 문장과 함께 쓰기","lv":"basic","nw":15,"sp":null,"d":3},{"i":541,"en":"Is there a masterpiece movie you’d recommend? What would you say is the best movie ever?","ko":"추천해 줄만한 명작 영화가 있어? 이때까지의 최고의 영화는 뭐라고 말 할래?","u":11,"ut":"What would you","sec":"다른 문장과 함께 쓰기","lv":"basic","nw":16,"sp":null,"d":3},{"i":542,"en":"Why not? It could be the beginning of my own international love story!","ko":"못할 이유 없지. 나의 국제 연애 스토리의 시작이 될 수 있지","u":11,"ut":"What would you","sec":"들어보기","lv":"talk","nw":13,"sp":null,"d":3},{"i":543,"en":"Oh, that’s a tough one! But let me think. An electric car sounds great—quiet, eco-friendly. Plus, it can be super-fast! But… what if I forget to charge it? That might be a nightmare! So, what would I buy? Hmm… Since I live in a city, I'd go electric.","ko":"오, 그거 어렵다! 하지만 생각해보자... 전기차가 좋아 보여. 조용하고 환경친화적이네. 플러스, 엄청 빠를 수 있잖아. 하지만... 충전을 깜박 한다면? 악몽이겠는 걸? 그러면 난 뭘 사야 할까? 음... 나는 시내에 사니까 난 전기로 가야겠다","u":11,"ut":"What would you","sec":"들어보기","lv":"talk","nw":49,"sp":null,"d":3},{"i":544,"en":"While it might not be the first time-loop film ever made, it definitely popularized the genre. The story follows a man who keeps reliving the same day over and over again, stuck in an endless cycle until he learns how to change himself. Many later films, like Edge of Tomorrow, were inspired by this concept. Would you like to watch a time-loop movie by any chance?\"","ko":"Oh, that’s a tough question! There are so many great movies out there. But if I had to pick just one, I’d say Groundhog Day, released in 1993). In Korea, it was titled ‘Love’s Black Hall’, 사랑의 블랙홀.","u":11,"ut":"What would you","sec":"들어보기","lv":"talk","nw":66,"sp":null,"d":3},{"i":545,"en":"Where would you like to sit?","ko":"어디 앉고 싶어?","u":11,"ut":"What would you","sec":"다른 표현","lv":"mid","nw":6,"sp":null,"d":1},{"i":546,"en":"When would you like to meet me?","ko":"나 언제 만나고 싶어?","u":11,"ut":"What would you","sec":"다른 표현","lv":"mid","nw":7,"sp":null,"d":2},{"i":547,"en":"Why would you say that?","ko":"왜 그렇게 말하는 거야?","u":11,"ut":"What would you","sec":"다른 표현","lv":"mid","nw":5,"sp":null,"d":1},{"i":548,"en":"How would you handle this situation?","ko":"이 상황을 어떻게 해결할 거야?","u":11,"ut":"What would you","sec":"다른 표현","lv":"mid","nw":6,"sp":null,"d":1},{"i":549,"en":"Would you rather stay in or go out?","ko":"집에 있을래? 나갈래?","u":11,"ut":"What would you","sec":"다른 표현","lv":"mid","nw":8,"sp":null,"d":2},{"i":550,"en":"Would you ever move to another country?","ko":"다른 나라로 이사 갈 생각 있어?","u":11,"ut":"What would you","sec":"다른 표현","lv":"mid","nw":7,"sp":null,"d":2},{"i":551,"en":"I was wondering if you could help me with this.","ko":"이거 좀 네가 날 도와줄 수 있을까 해서요","u":12,"ut":"I was wondering","sec":"기본 표현","lv":"basic","nw":10,"sp":null,"d":2},{"i":552,"en":"I was wondering when you’re free to meet up","ko":"언제 만날 시간 되니?","u":12,"ut":"I was wondering","sec":"기본 표현","lv":"basic","nw":9,"sp":null,"d":2},{"i":553,"en":"I was wondering if you’d like to grab some coffee later.","ko":"나중에 커피 마실 수 있을까요? (나중에 커피 마시고 싶어할지 궁금해)","u":12,"ut":"I was wondering","sec":"다른 표현과 비교","lv":"mid","nw":11,"sp":null,"d":2},{"i":554,"en":"I wonder why he’s late.","ko":"난 그가 왜 늦는지 (평상 시) 궁금해","u":12,"ut":"I was wondering","sec":"다른 표현과 비교","lv":"mid","nw":5,"sp":null,"d":1},{"i":555,"en":"I’m wondering why he’s late.","ko":"그가 (지금) 왜 늦고 있지?","u":12,"ut":"I was wondering","sec":"다른 표현과 비교","lv":"mid","nw":5,"sp":null,"d":1},{"i":556,"en":"I was wondering if I could get a discount.","ko":"할인 받을 수 있을까요?","u":12,"ut":"I was wondering","sec":"다른 표현과 비교","lv":"mid","nw":9,"sp":null,"d":2},{"i":557,"en":"I was wondering if It’s possible to change my flight.","ko":"비행기표 변경이 가능할까요?","u":12,"ut":"I was wondering","sec":"다른 표현과 비교","lv":"mid","nw":10,"sp":null,"d":2},{"i":558,"en":"I was wondering if I could leave work a little early today.","ko":"오늘 조금 일찍 퇴근해도 될까요?","u":12,"ut":"I was wondering","sec":"다른 표현과 비교","lv":"mid","nw":12,"sp":null,"d":2},{"i":559,"en":"I was wondering how much this would cost (how much it would be).","ko":"이게 가격이 얼마인지 궁금했어요.","u":12,"ut":"I was wondering","sec":"다른 표현과 비교","lv":"mid","nw":13,"sp":null,"d":3},{"i":560,"en":"I was wondering what you think about this idea.","ko":"이 아이디어에 대해 어떻게 생각하는지 궁금했어요","u":12,"ut":"I was wondering","sec":"다른 표현과 비교","lv":"mid","nw":9,"sp":null,"d":2},{"i":561,"en":"I was wondering what time the meeting starts.","ko":"회의가 몇 시에 시작하는지 알고 싶었어요","u":12,"ut":"I was wondering","sec":"다른 표현과 비교","lv":"mid","nw":8,"sp":null,"d":2},{"i":562,"en":"I was wondering how you did that.","ko":"당신이 그걸 어떻게 했는지 궁금했어요","u":12,"ut":"I was wondering","sec":"다른 표현과 비교","lv":"mid","nw":7,"sp":null,"d":2},{"i":563,"en":"I was wondering if you’re available tomorrow.","ko":"내일 시간이 되는지 궁금해요","u":12,"ut":"I was wondering","sec":"다른 표현과 비교","lv":"mid","nw":7,"sp":null,"d":2},{"i":564,"en":"I was wondering if we could meet sometime this week.","ko":"우리가 이번 주에 언제 만날 수 있으면 좋겠어요","u":12,"ut":"I was wondering","sec":"다른 표현과 비교","lv":"mid","nw":10,"sp":null,"d":2},{"i":565,"en":"Hey, I was wondering if you could give me a ride to the airport tomorrow.","ko":"내일 공항에 날 태워줄 수 있으려나","u":12,"ut":"I was wondering","sec":"다른 문장과 함께 쓰기","lv":"basic","nw":15,"sp":null,"d":3},{"i":566,"en":"Sure! What time do you need to be there?","ko":"당연! 니가 거기 몇 시까지 가야 돼?","u":12,"ut":"I was wondering","sec":"다른 문장과 함께 쓰기","lv":"basic","nw":9,"sp":null,"d":2},{"i":567,"en":"Hi, I was wondering if you have this in a small size.","ko":"안녕하세요, 이거 더 작은 사이즈 가지고 있으세요?","u":12,"ut":"I was wondering","sec":"다른 문장과 함께 쓰기","lv":"basic","nw":12,"sp":null,"d":2},{"i":568,"en":"Let me check for you. One moment, please.","ko":"확인해 볼게요. 잠시만요","u":12,"ut":"I was wondering","sec":"다른 문장과 함께 쓰기","lv":"basic","nw":8,"sp":null,"d":2},{"i":569,"en":"Hey, I was wondering if you’re free this Friday.","ko":"이번 금요일에 시간이 되니?","u":12,"ut":"I was wondering","sec":"들어보기","lv":"talk","nw":9,"sp":null,"d":2},{"i":570,"en":"I think so! What are you gonna do?","ko":"될 것 같은데! 뭐 하려 하는데?","u":12,"ut":"I was wondering","sec":"들어보기","lv":"talk","nw":8,"sp":null,"d":2},{"i":571,"en":"There’s a new Italian place. Do you want me to make a reservation?","ko":"새로운 이탈리안 레스토랑이 있어. 내가 예약할까?","u":12,"ut":"I was wondering","sec":"들어보기","lv":"talk","nw":13,"sp":null,"d":3},{"i":572,"en":"Italian, huh? As you may know I’m more of a burger person, but I’ll try.","ko":"이탈리안? 너도 혹시 알지 모르겠지만 난 버거파인데, 그래도 먹어볼게","u":12,"ut":"I was wondering","sec":"들어보기","lv":"talk","nw":15,"sp":null,"d":3},{"i":573,"en":"Can I ask you something? What would you do if your crush started texting you a lot?","ko":"뭐 물어보자. 네가 좋아하는 사람이 만약 너한테 많이 문자하면 어떻게 할거야?","u":12,"ut":"I was wondering","sec":"들어보기","lv":"talk","nw":17,"sp":null,"d":3},{"i":574,"en":"Oh, I always wonder if she likes me. If she did that, I would be so happy. But I wouldn’t text her first all the time.","ko":"오, 난 항상 그녀가 날 좋아하는 지 궁금해하던 참이야. 만약 그녀가 그런다면 행복하겠지. 그래도 항상 내가 먼저 문자 하지는 않을 거야.","u":12,"ut":"I was wondering","sec":"들어보기","lv":"talk","nw":26,"sp":null,"d":3},{"i":575,"en":"Why not? It might be your big chance!","ko":"왜 안 해? 좋은 찬스일 수도 있잖아","u":12,"ut":"I was wondering","sec":"들어보기","lv":"talk","nw":8,"sp":null,"d":2},{"i":576,"en":"I know, but I don’t want to seem too desperate.","ko":"알아, 그렇지만 너무 절박해 보이고 싶진 않아","u":12,"ut":"I was wondering","sec":"들어보기","lv":"talk","nw":10,"sp":null,"d":2},{"i":577,"en":"Hi, I have a reservation under the name Kim.","ko":"안녕하세요, ‘김’이라는 이름으로 예약했어요","u":12,"ut":"I was wondering","sec":"들어보기","lv":"talk","nw":9,"sp":null,"d":2},{"i":578,"en":"Let me check… Yes, we have your booking. Would you like a room with a view?","ko":"확인해 볼게요... 네 예약되어 있네요. 전망 좋은 방을 원하시나요?","u":12,"ut":"I was wondering","sec":"들어보기","lv":"talk","nw":16,"sp":null,"d":3},{"i":579,"en":"Oh, that would be nice! Is there an extra charge?","ko":"오, 그거 좋을 것 같네요. 추가 요금이 있나요?","u":12,"ut":"I was wondering","sec":"들어보기","lv":"talk","nw":10,"sp":null,"d":2},{"i":580,"en":"No, it’s available at the same rate.","ko":"아니요. 같은 가격에 가능해요","u":12,"ut":"I was wondering","sec":"들어보기","lv":"talk","nw":7,"sp":null,"d":2},{"i":581,"en":"Perfect! Also, I was wondering if you have late check-out.","ko":"완벽해요. 그리고 혹시 늦은 체크아웃 정책이 있나요?","u":12,"ut":"I was wondering","sec":"들어보기","lv":"talk","nw":10,"sp":null,"d":2},{"i":582,"en":"Yes, but there’s a small fee.","ko":"네, 하지만 약간의 추가요금이 있어요","u":12,"ut":"I was wondering","sec":"들어보기","lv":"talk","nw":6,"sp":null,"d":1},{"i":583,"en":"Got it. Would it be okay if I decide on that a bit later?","ko":"알겠어요. 그건 조금 후에 결정해도 될까요?","u":12,"ut":"I was wondering","sec":"들어보기","lv":"talk","nw":14,"sp":null,"d":3},{"i":584,"en":"Of course. Ju
