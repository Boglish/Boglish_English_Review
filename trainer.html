:"(이제) 갈 시간이야","u":16,"ut":"to","sec":"기본 표현","lv":"basic","nw":4,"sp":null,"d":1},{"i":733,"en":"Our plan is to visit Dubai next year.","ko":"우리의 계획은 내년에 두바이에 방문하는 거야","u":16,"ut":"to","sec":"기본 표현","lv":"basic","nw":8,"sp":null,"d":2},{"i":734,"en":"I finally have a chance.","ko":"드디어 기회가 생겼어","u":16,"ut":"to","sec":"기본 표현","lv":"basic","nw":5,"sp":null,"d":1},{"i":735,"en":"I finally have a chance to do my own business.","ko":"드디어 내 사업을 할 기회가 생겼어","u":16,"ut":"to","sec":"기본 표현","lv":"basic","nw":10,"sp":null,"d":2},{"i":736,"en":"There is no reason.","ko":"이유가 없어","u":16,"ut":"to","sec":"기본 표현","lv":"basic","nw":4,"sp":null,"d":1},{"i":737,"en":"There is no reason to be upset.","ko":"속상해 할 이유가 없어","u":16,"ut":"to","sec":"기본 표현","lv":"basic","nw":7,"sp":null,"d":2},{"i":738,"en":"She made a decision.","ko":"그녀는 결정했어","u":16,"ut":"to","sec":"기본 표현","lv":"basic","nw":4,"sp":null,"d":1},{"i":739,"en":"She made a decision to leave the country.","ko":"그녀는 이 나라를 떠나기로 결정했어","u":16,"ut":"to","sec":"기본 표현","lv":"basic","nw":8,"sp":null,"d":2},{"i":740,"en":"Is there a good way.","ko":"좋은 방법이 있어?","u":16,"ut":"to","sec":"기본 표현","lv":"basic","nw":5,"sp":null,"d":1},{"i":741,"en":"Is there a good way to learn English.","ko":"영어를 배우는 좋은 방법이 있어?","u":16,"ut":"to","sec":"기본 표현","lv":"basic","nw":8,"sp":null,"d":2},{"i":742,"en":"I’m happy","ko":"난 기뻐","u":16,"ut":"to","sec":"기본 표현","lv":"basic","nw":2,"sp":null,"d":1},{"i":743,"en":"I’m happy to see you again.","ko":"너를 다시 봐서 기뻐","u":16,"ut":"to","sec":"기본 표현","lv":"basic","nw":6,"sp":null,"d":1},{"i":744,"en":"I’m excited.","ko":"난 신나","u":16,"ut":"to","sec":"기본 표현","lv":"basic","nw":2,"sp":null,"d":1},{"i":745,"en":"I’m excited to start my new job.","ko":"새로운 일을 시작하게 돼서 신나","u":16,"ut":"to","sec":"기본 표현","lv":"basic","nw":7,"sp":null,"d":2},{"i":746,"en":"She’s not afraid.","ko":"그녀는 두려워하지 않아","u":16,"ut":"to","sec":"기본 표현","lv":"basic","nw":3,"sp":null,"d":1},{"i":747,"en":"She’s not afraid to speak in public.","ko":"그녀는 대중 앞에서 말하는 걸 두려워하지 않아","u":16,"ut":"to","sec":"기본 표현","lv":"basic","nw":7,"sp":null,"d":2},{"i":748,"en":"Be careful !","ko":"신중해!","u":16,"ut":"to","sec":"기본 표현","lv":"basic","nw":2,"sp":null,"d":1},{"i":749,"en":"Be careful to follow the instructions.","ko":"지시사항을 신중하게 따라야 해!","u":16,"ut":"to","sec":"기본 표현","lv":"basic","nw":6,"sp":null,"d":1},{"i":750,"en":"I was wondering how I can help.","ko":"어떻게 도울 수 있을지 궁금했어요 (어떻게 도와줄까요?)","u":16,"ut":"to","sec":"기본 표현","lv":"basic","nw":7,"sp":null,"d":2},{"i":751,"en":"I was wondering how I can help to make things easier.","ko":"어떻게 도와야 일이 더 쉬워질지 궁금했어요","u":16,"ut":"to","sec":"기본 표현","lv":"basic","nw":11,"sp":null,"d":2},{"i":752,"en":"I was wondering who would be there.","ko":"누가 거기 올지 궁금했어","u":16,"ut":"to","sec":"기본 표현","lv":"basic","nw":7,"sp":null,"d":2},{"i":753,"en":"I was wondering who would be there to give a speech.","ko":"누가 거기 와서 연설을 할지 궁금했어","u":16,"ut":"to","sec":"기본 표현","lv":"basic","nw":11,"sp":null,"d":2},{"i":754,"en":"Have you finished your work to meet the deadline?","ko":"마감일 맞추려고 너 일 끝냈어?","u":16,"ut":"to","sec":"기본 표현","lv":"basic","nw":9,"sp":null,"d":2},{"i":755,"en":"Would it be possible to meet tomorrow?","ko":"내일 만나는 게 가능하시겠습니까?","u":16,"ut":"to","sec":"기본 표현","lv":"basic","nw":7,"sp":null,"d":2},{"i":756,"en":"Would it be possible to meet tomorrow to discuss the project?","ko":"프로젝트를 논의하려고 내일 만나는 게 가능하시겠습니까?","u":16,"ut":"to","sec":"기본 표현","lv":"basic","nw":11,"sp":null,"d":2},{"i":757,"en":"Would it be strange to ask for help","ko":"도움을 요청하는 게 이상할까?","u":16,"ut":"to","sec":"기본 표현","lv":"basic","nw":8,"sp":null,"d":2},{"i":758,"en":"Would it be strange to ask for help to finish the task on time?","ko":"기한 내로 일을 끝내려고 도움을 요청하는 게 이상할까?","u":16,"ut":"to","sec":"기본 표현","lv":"basic","nw":14,"sp":null,"d":3},{"i":759,"en":"What are you gonna say to convince them?","ko":"그들을 설득하려고 뭐라고 말할 거야?","u":16,"ut":"to","sec":"기본 표현","lv":"basic","nw":8,"sp":null,"d":2},{"i":760,"en":"They moved to a new city.","ko":"그들은 새로운 도시로 이사했어","u":16,"ut":"to","sec":"기본 표현","lv":"basic","nw":6,"sp":null,"d":1},{"i":761,"en":"They moved to a new city to find better job opportunities.","ko":"그들은 더 좋은 일자리의 기회를 찾으려고 새로운 도시로 이사했어","u":16,"ut":"to","sec":"기본 표현","lv":"basic","nw":11,"sp":null,"d":2},{"i":762,"en":"To make a long story short, we decided to cancel the trip.","ko":"간단히 말하면, 우리는 여행을 취소하기로 했어","u":16,"ut":"to","sec":"기본 표현","lv":"basic","nw":12,"sp":null,"d":2},{"i":763,"en":"To my surprise, he agreed with me.","ko":"놀랍게도, 그가 내 의견에 동의했어","u":16,"ut":"to","sec":"기본 표현","lv":"basic","nw":7,"sp":null,"d":2},{"i":764,"en":"To be frank, I don’t think this plan will work.","ko":"솔직히 말하면, 난 이 계획이 성공할 것 같지 않아","u":16,"ut":"to","sec":"기본 표현","lv":"basic","nw":10,"sp":null,"d":2},{"i":765,"en":"To put it simply, we need more time to finish the project.","ko":"간단히 말하면, 우리는 프로젝트를 끝낼 시간이 더 필요해","u":16,"ut":"to","sec":"기본 표현","lv":"basic","nw":12,"sp":null,"d":2},{"i":766,"en":"(To put it) in a nutshell, the project they did was a failure.","ko":"간단히 말하면, 그들이 했던 프로젝트는 실패였어","u":16,"ut":"to","sec":"기본 표현","lv":"basic","nw":13,"sp":null,"d":3},{"i":767,"en":"To sum up, we need a new strategy.","ko":"요약하면, 우리는 새로운 전략이 필요해","u":16,"ut":"to","sec":"기본 표현","lv":"basic","nw":8,"sp":null,"d":2},{"i":768,"en":"To begin with, we should analyze the data.","ko":"우선 먼저, 데이터를 분석해야 해","u":16,"ut":"to","sec":"기본 표현","lv":"basic","nw":8,"sp":null,"d":2},{"i":769,"en":"To say the least, the weather was terrible.","ko":"조심스럽게 말하자면, 날씨가 정말 안 좋았어","u":16,"ut":"to","sec":"문장을 길게","lv":"mid","nw":8,"sp":null,"d":2},{"i":770,"en":"To say the least, the weather was terrible, and it completely ruined our plans","ko":"조심스럽게 말하자면, 날씨가 정말 안 좋았고, 그게 우리의 계획을 완전히 망가뜨렸어","u":16,"ut":"to","sec":"문장을 길게","lv":"mid","nw":14,"sp":null,"d":3},{"i":771,"en":"To say the least, the weather was terrible, and it completely ruined our plans for the outdoor event.","ko":"조심스럽게 말하자면, 날씨가 정말 안 좋았고, 그게 우리 야외 행사 계획을 완전히 망가뜨렸어","u":16,"ut":"to","sec":"문장을 길게","lv":"mid","nw":18,"sp":null,"d":3},{"i":772,"en":"To be fair, she did try her best.","ko":"공정하게 말하면, 그녀는 최선을 다 했어","u":16,"ut":"to","sec":"문장을 길게","lv":"mid","nw":8,"sp":null,"d":2},{"i":773,"en":"To be fair, she did try her best, but the circumstances made it really difficult.","ko":"공정하게 말하면, 그녀는 최선을 다 했어, 하지만 상황이 그걸 매우 어렵게 만들었지.","u":16,"ut":"to","sec":"문장을 길게","lv":"mid","nw":15,"sp":null,"d":3},{"i":774,"en":"To be fair, she did try her best, but the circumstances made it really difficult for her to succeed.","ko":"공정하게 말하면, 그녀는 최선을 다 했어, 하지만 상황이 그녀가 성공하기를 매우 어렵게 만들었지.","u":16,"ut":"to","sec":"문장을 길게","lv":"mid","nw":19,"sp":null,"d":3},{"i":775,"en":"Do you think it’s a good idea to go camping this weekend?","ko":"이번 주말에 캠핑 가는 게 좋은 아이디어라고 생각해?","u":16,"ut":"to","sec":"대화해보기","lv":"talk","nw":12,"sp":null,"d":2},{"i":776,"en":"Well, it sounds fun, but the weather forecast says it’s going to rain.","ko":"음, 재미있을 것 같긴 한데, 일기예보 보니까 비가 온대","u":16,"ut":"to","sec":"대화해보기","lv":"talk","nw":13,"sp":null,"d":3},{"i":777,"en":"Oh, really? Then it might be difficult to set up the tent.","ko":"아, 정말? 그러면 텐트를 치는 게 어려울 수도 있겠네","u":16,"ut":"to","sec":"대화해보기","lv":"talk","nw":12,"sp":null,"d":2},{"i":778,"en":"Yeah, and it would be uncomfortable to stay in a wet tent all night.","ko":"응, 그리고 젖은 텐트에서 밤새 있는 건 불편할 것 같아","u":16,"ut":"to","sec":"대화해보기","lv":"talk","nw":14,"sp":null,"d":3},{"i":779,"en":"True. But if the rain stops early, it could be a great chance to enjoy nature.","ko":"맞아. 하지만 비가 일찍 그치면, 자연을 즐길 좋은 기회가 될 수도 있어","u":16,"ut":"to","sec":"대화해보기","lv":"talk","nw":16,"sp":null,"d":3},{"i":780,"en":"That’s a good point. To be safe, we should check the forecast again tomorrow before making a decision.","ko":"좋은 지적이야. 안전을 위해서, 결정을 내리기 전에 내일 다시 예보를 확인하는 게 좋겠어","u":16,"ut":"to","sec":"대화해보기","lv":"talk","nw":18,"sp":null,"d":3},{"i":781,"en":"I like your hairstyle, the ponytail.","ko":"난 네 꼬랑지 머리 스타일이 좋아","u":17,"ut":"like","sec":"기본 표현","lv":"basic","nw":6,"sp":null,"d":1},{"i":782,"en":"She likes reading books.","ko":"그녀는 책 읽는 걸 좋아해","u":17,"ut":"like","sec":"기본 표현","lv":"basic","nw":4,"sp":null,"d":1},{"i":783,"en":"You look like a movie star today.","ko":"너 오늘 영화배우처럼 보여","u":17,"ut":"like","sec":"기본 표현","lv":"basic","nw":7,"sp":null,"d":2},{"i":784,"en":"I need someone to help me.","ko":"나는 나를 도와줄 누군가가 필요해","u":17,"ut":"like","sec":"기본 표현","lv":"basic","nw":6,"sp":null,"d":1},{"i":785,"en":"I need someone like you to help me.","ko":"나는 나를 도와줄 너 같은 사람이 필요해","u":17,"ut":"like","sec":"기본 표현","lv":"basic","nw":8,"sp":null,"d":2},{"i":786,"en":"I love music.","ko":"나는 음악을 좋아해","u":17,"ut":"like","sec":"기본 표현","lv":"basic","nw":3,"sp":null,"d":1},{"i":787,"en":"I love music like this.","ko":"나는 이런 음악을 좋아해","u":17,"ut":"like","sec":"기본 표현","lv":"basic","nw":5,"sp":null,"d":1},{"i":788,"en":"I want a car.","ko":"나는 자동차를 원해","u":17,"ut":"like","sec":"기본 표현","lv":"basic","nw":4,"sp":null,"d":1},{"i":789,"en":"I want a car like yours.","ko":"나는 네 차 같은 자동차를 원해","u":17,"ut":"like","sec":"기본 표현","lv":"basic","nw":6,"sp":null,"d":1},{"i":790,"en":"I wish I had a brother like you.","ko":"너 같은 형제가 있었으면 좋겠다","u":17,"ut":"like","sec":"기본 표현","lv":"basic","nw":8,"sp":null,"d":2},{"i":791,"en":"Have you ever had a day like this?","ko":"이런 날을 겪어 본 적 있어?","u":17,"ut":"like","sec":"기본 표현","lv":"basic","nw":8,"sp":null,"d":2},{"i":792,"en":"I don’t want to go through a situation like that.","ko":"난 저런 상황을 겪고 싶지 않아","u":17,"ut":"like","sec":"기본 표현","lv":"basic","nw":10,"sp":null,"d":2},{"i":793,"en":"He has a child-like innocence.","ko":"그는 아이 같은 순수함을 가지고 있어","u":17,"ut":"like","sec":"기본 표현","lv":"basic","nw":5,"sp":null,"d":1},{"i":794,"en":"She gave me a mother-like smile.","ko":"그녀는 나에게 엄마같은 미소를 지었어","u":17,"ut":"like","sec":"기본 표현","lv":"basic","nw":6,"sp":null,"d":1},{"i":795,"en":"Your reaction was very robot-like.","ko":"너의 반응은 너무 로봇 같았어","u":17,"ut":"like","sec":"기본 표현","lv":"basic","nw":5,"sp":null,"d":1},{"i":796,"en":"She talks like a teacher.","ko":"그녀는 마치 선생님처럼 말해","u":17,"ut":"like","sec":"기본 표현","lv":"basic","nw":5,"sp":null,"d":1},{"i":797,"en":"She talks to me like a teacher.","ko":"그녀는 나에게 선생님처럼 말해","u":17,"ut":"like","sec":"기본 표현","lv":"basic","nw":7,"sp":null,"d":2},{"i":798,"en":"It smells like fresh bread.","ko":"갓 구운 빵 냄새가 나는 것 같아","u":17,"ut":"like","sec":"기본 표현","lv":"basic","nw":5,"sp":null,"d":1},{"i":799,"en":"It feels like home.","ko":"집 같아 (편안하네)","u":17,"ut":"like","sec":"기본 표현","lv":"basic","nw":4,"sp":null,"d":1},{"i":800,"en":"His idea seems like a good one.","ko":"그의 아이디어는 괜찮은 아이디어 같아","u":17,"ut":"like","sec":"기본 표현","lv":"basic","nw":7,"sp":null,"d":2},{"i":801,"en":"There were like 100 people at the party yesterday.","ko":"어제 파티에 한 100명쯤 있었어","u":17,"ut":"like","sec":"기본 표현","lv":"basic","nw":8,"sp":null,"d":2},{"i":802,"en":"This place is like a dream.","ko":"여기 완전 꿈같아!","u":17,"ut":"like","sec":"기본 표현","lv":"basic","nw":6,"sp":null,"d":1},{"i":803,"en":"You’re like a big sister to me.","ko":"너는 (꼭) 나에게 누나 같아","u":17,"ut":"like","sec":"기본 표현","lv":"basic","nw":7,"sp":null,"d":2},{"i":804,"en":"That restaurant was like a five-star hotel.","ko":"저 레스토랑은 거의 5성급 호텔 같았어","u":17,"ut":"like","sec":"기본 표현","lv":"basic","nw":7,"sp":null,"d":2},{"i":805,"en":"You will be like a new person after the vacation.","ko":"너는 휴가 후에 완전 새로운 사람이 될 것 같을 거야","u":17,"ut":"like","sec":"기본 표현","lv":"basic","nw":10,"sp":null,"d":2},{"i":806,"en":"This year has been like a roller coaster ride.","ko":"올해는 완전 롤러코스터 같은 한 해야","u":17,"ut":"like","sec":"기본 표현","lv":"basic","nw":9,"sp":null,"d":2},{"i":807,"en":"He has been like a mentor to me.","ko":"그는 나에게 멘토 같은 존재여왔었어","u":17,"ut":"like","sec":"기본 표현","lv":"basic","nw":8,"sp":null,"d":2},{"i":808,"en":"They were like mindless zombies at the party.","ko":"걔네들 파티에서 아무 생각 없는 좀비처럼 굴더라고","u":17,"ut":"like","sec":"기본 표현","lv":"basic","nw":8,"sp":null,"d":2},{"i":809,"en":"Especially, he was being like a total jerk earlier.","ko":"특히 그 녀석은 아까 완전 재수 없게 굴고 있었어","u":17,"ut":"like","sec":"기본 표현","lv":"basic","nw":9,"sp":null,"d":2},{"i":810,"en":"What did he say?","ko":"그가 뭐래?","u":17,"ut":"like","sec":"기본 표현","lv":"basic","nw":4,"sp":null,"d":1},{"i":811,"en":"He was like, “I don’t care”","ko":"그가 막, “난 신경 안 써” 이랬어","u":17,"ut":"like","sec":"기본 표현","lv":"basic","nw":6,"sp":null,"d":1},{"i":812,"en":"How was the movie?","ko":"그 영화 어땠어?","u":17,"ut":"like","sec":"기본 표현","lv":"basic","nw":4,"sp":null,"d":1},{"i":813,"en":"It was like, so exciting.","ko":"그거 막, 흥분되었어","u":17,"ut":"like","sec":"기본 표현","lv":"basic","nw":5,"sp":null,"d":1},{"i":814,"en":"You’re like your mom.","ko":"너는 너네 엄마 같아","u":17,"ut":"like","sec":"기본 표현","lv":"basic","nw":4,"sp":null,"d":1},{"i":815,"en":"You’re just like your mom.","ko":"너는 딱 너네 엄마랑 같아","u":17,"ut":"like","sec":"기본 표현","lv":"basic","nw":5,"sp":null,"d":1},{"i":816,"en":"It’s just like in the movies!","ko":"이거 영화에서 나오는 장면 같잖아","u":17,"ut":"like","sec":"기본 표현","lv":"basic","nw":6,"sp":null,"d":1},{"i":817,"en":"This is just like what I imagined.","ko":"이건 내가 상상했던 거랑 딱 같네","u":17,"ut":"like","sec":"기본 표현","lv":"basic","nw":7,"sp":null,"d":2},{"i":818,"en":"You sounded just like him!","ko":"너 목소리 완전 그 사람 같았어","u":17,"ut":"like","sec":"기본 표현","lv":"basic","nw":5,"sp":null,"d":1},{"i":819,"en":"He talks like he knows everything about marketing.","ko":"그는 마치 마케팅에 대해서 다 아는 것처럼 말해","u":17,"ut":"like","sec":"기본 표현","lv":"basic","nw":8,"sp":null,"d":2},{"i":820,"en":"He’s acting like nothing happened.","ko":"그는 마치 아무 일도 없었던 것처럼 행동하고 있어","u":17,"ut":"like","sec":"기본 표현","lv":"basic","nw":5,"sp":null,"d":1},{"i":821,"en":"It’s not like what you think.","ko":"이건 네가 생각하는 그런 게 아니야","u":17,"ut":"like","sec":"기본 표현","lv":"basic","nw":6,"sp":null,"d":1},{"i":822,"en":"I did it just like how you showed me.","ko":"나는 그걸 네가 보여줬던 대로 했어","u":17,"ut":"like","sec":"기본 표현","lv":"basic","nw":9,"sp":null,"d":2},{"i":823,"en":"It’s like when we first met.","ko":"이거 우리가 처음 만났을 때랑 같아","u":17,"ut":"like","sec":"기본 표현","lv":"basic","nw":6,"sp":null,"d":1},{"i":824,"en":"He sounds like where I’m from.","ko":"그는 나랑 같은 지역 출신인 것처럼 들리네","u":17,"ut":"like","sec":"기본 표현","lv":"basic","nw":6,"sp":null,"d":1},{"i":825,"en":"There’s a lot of water dripping from above. It’s like it’s raining.","ko":"위에서 물이 많이 떨어지네. 이건 마치 비가 오는 것 같잖아","u":17,"ut":"like","sec":"기본 표현","lv":"basic","nw":12,"sp":null,"d":2},{"i":826,"en":"The birds are flying low. It’s likely to rain soon.","ko":"새들이 낮게 날아다니네. 곧 비가 올 가능성이 높아","u":17,"ut":"like","sec":"기본 표현","lv":"basic","nw":10,"sp":null,"d":2},{"i":827,"en":"It’s likely that we’ll be late.","ko":"우리는 늦을 가능성이 높아","u":17,"ut":"like","sec":"기본 표현","lv":"basic","nw":6,"sp":null,"d":1},{"i":828,"en":"The meeting will likely end by 5 p.m.","ko":"회의는 아마 오후 5시까지는 끝날 거야","u":17,"ut":"like","sec":"기본 표현","lv":"basic","nw":8,"sp":null,"d":2},{"i":829,"en":"He is most likely at home now.","ko":"그는 지금 집에 있을 가능성이 가장 커","u":17,"ut":"like","sec":"기본 표현","lv":"basic","nw":7,"sp":null,"d":2},{"i":830,"en":"She is likely to win the competition.","ko":"그녀가 대회에서 우승할 가능성이 높아","u":17,"ut":"like","sec":"기본 표현","lv":"basic","nw":7,"sp":null,"d":2},{"i":831,"en":"A Sudden Plan","ko":"갑작스러운 여행 계획","u":17,"ut":"like","sec":"연습하기","lv":"basic","nw":3,"sp":null,"d":1},{"i":832,"en":"Emma and Jake were talking at a café when Jake suddenly said,","ko":"Emma와 Jake는 카페에서 이야기하고 있었다. 그런데 갑자기 Jake가 말했다","u":17,"ut":"like","sec":"연습하기","lv":"basic","nw":12,"sp":null,"d":2},{"i":833,"en":"\"I was like, 'Let's go on a trip this weekend!'\"","ko":"\"나 있잖아, ‘이번 주말에 여행 가자!’ 이렇게 말했어.\"","u":17,"ut":"like","sec":"연습하기","lv":"basic","nw":10,"sp":null,"d":2},{"i":834,"en":"Emma laughed and replied,","ko":"Emma는 웃으며 대답했다","u":17,"ut":"like","sec":"연습하기","lv":"basic","nw":4,"sp":null,"d":1},{"i":835,"en":"\"Wait, are you serious? It’s not like we can just leave without planning.\"","ko":"\"잠깐만, 진심이야? 우리가 아무 계획 없이 그냥 떠날 수 있는 것도 아니잖아.\"","u":17,"ut":"like","sec":"연습하기","lv":"basic","nw":13,"sp":null,"d":3},{"i":836,"en":"Jake shrugged.","ko":"Jake는 어깨를 으쓱였다","u":17,"ut":"like","sec":"연습하기","lv":"basic","nw":2,"sp":null,"d":1},{"i":837,"en":"\"Come on, it'll be fun! Just imagine something like a peaceful cabin in the mountains.\"","ko":"\"에이, 재밌을 거야! 그냥 상상해 봐. 산속에 있는 조용한 오두막 같은 곳에서 쉬는 거.\"","u":17,"ut":"like","sec":"연습하기","lv":"basic","nw":15,"sp":null,"d":3},{"i":838,"en":"Emma sighed","ko":"Emma는 한숨을 쉬었다.","u":17,"ut":"like","sec":"연습하기","lv":"basic","nw":2,"sp":null,"d":1},{"i":839,"en":"Jake pulled out his phone.","ko":"Jake는 휴대폰을 꺼내 들었다","u":17,"ut":"like","sec":"연습하기","lv":"basic","nw":5,"sp":null,"d":1},{"i":840,"en":"\"Let me check. What if we get lucky? No matter what, I think we should try!\"","ko":"\"한번 찾아볼게. 혹시 운이 좋을지도 모르잖아? 어쨌든, 시도는 해봐야지!\"","u":17,"ut":"like","sec":"연습하기","lv":"basic","nw":16,"sp":null,"d":3},{"i":841,"en":"After a few minutes, Jake grinned.","ko":"몇 분 후, Jake는 환하게 웃으며 말했다","u":17,"ut":"like","sec":"연습하기","lv":"basic","nw":6,"sp":null,"d":1},{"i":842,"en":"\"See? I found something! A cabin just like the one I imagined.\"","ko":"봐봐! 딱 내가 상상한 그런 오두막을 찾았어","u":17,"ut":"like","sec":"연습하기","lv":"basic","nw":12,"sp":null,"d":2},{"i":843,"en":"Emma shook her head but smiled.","ko":"Emma는 고개를 절레절레 흔들었지만 미소를 지었다..\"","u":17,"ut":"like","sec":"연습하기","lv":"basic","nw":6,"sp":null,"d":1},{"i":844,"en":"\"Fine. But if something goes wrong, don’t say I didn’t warn you!\"","ko":"\"좋아. 근데 무슨 문제라도 생기면, 내가 경고 안 했다고는 하지 마!\"","u":17,"ut":"like","sec":"연습하기","lv":"basic","nw":12,"sp":null,"d":2},{"i":845,"en":"I know what you mean.","ko":"네가 무슨 말(생각)을 하는지 알아","u":18,"ut":"What I","sec":"기본 표현","lv":"basic","nw":5,"sp":null,"d":1},{"i":846,"en":"I don’t understand what you said.","ko":"네가 말한 걸 이해하지 못하겠어","u":18,"ut":"What I","sec":"기본 표현","lv":"basic","nw":6,"sp":null,"d":1},{"i":847,"en":"You can do what you like.","ko":"네가 좋아하는 대로 해도 돼","u":18,"ut":"What I","sec":"기본 표현","lv":"basic","nw":6,"sp":null,"d":1},{"i":848,"en":"Tell me what you need.","ko":"네가 필요한 걸 말해","u":18,"ut":"What I","sec":"기본 표현","lv":"basic","nw":5,"sp":null,"d":1},{"i":849,"en":"This is exactly what I wanted!","ko":"이게 정확히 내가 원했던 거야","u":18,"ut":"What I","sec":"기본 표현","lv":"basic","nw":6,"sp":null,"d":1},{"i":850,"en":"That’s not what I expected.","ko":"그건 내가 예상했던 게 아니야","u":18,"ut":"What I","sec":"기본 표현","lv":"basic","nw":5,"sp":null,"d":1},{"i":851,"en":"I regret what I did to you.","ko":"내가 너에게 한 거 후회해","u":18,"ut":"What I","sec":"기본 표현","lv":"basic","nw":7,"sp":null,"d":2},{"i":852,"en":"I finally realized what I was missing.","ko":"내가 놓치고 있던 걸 드디어 깨달았어","u":18,"ut":"What I","sec":"기본 표현","lv":"basic","nw":7,"sp":null,"d":2},{"i":853,"en":"Do you remember what she said?","ko":"그녀가 뭐라고 했는지 기억나?","u":18,"ut":"What I","sec":"의문문","lv":"basic","nw":6,"sp":null,"d":1},{"i":854,"en":"I remember some of it, but not all.","ko":"일부는 기억나는데, 전부 다는 아니에요","u":18,"ut":"What I","sec":"의문문","lv":"basic","nw":8,"sp":null,"d":2},{"i":855,"en":"Can you show me what you bought online last time?","ko":"지난 번 온라인으로 네가 산 거 나에게 보여줄 수 있어?","u":18,"ut":"What I","sec":"의문문","lv":"basic","nw":10,"sp":null,"d":2},{"i":856,"en":"I don’t remember what I bought","ko":"내가 뭘 샀는지 기억이 안나요","u":18,"ut":"What I","sec":"의문문","lv":"basic","nw":6,"sp":null,"d":1},{"i":857,"en":"Did you hear what they announced?","ko":"그들이 발표한 거 들었어?","u":18,"ut":"What I","sec":"의문문","lv":"basic","nw":6,"sp":null,"d":1},{"i":858,"en":"Yes, I heard what they announced. They're launching a new product next month.","ko":"네, 그들이 발표한 것을 들었어요. 다음 달에 신제품을 출시한다고 해요","u":18,"ut":"What I","sec":"의문문","lv":"basic","nw":13,"sp":null,"d":3},{"i":859,"en":"Do you know what time the meeting starts?","ko":"회의가 몇 시에 시작하는지 알아?","u":18,"ut":"What I","sec":"의문문","lv":"basic","nw":8,"sp":null,"d":2},{"i":860,"en":"Yes, the meeting starts at 10 AM.","ko":"네, 회의는 오전 10시에 시작합니다","u":18,"ut":"What I","sec":"의문문","lv":"basic","nw":6,"sp":null,"d":1},{"i":861,"en":"Would you mind explaining what you just said?","ko":"네가 방금 한 말을 설명해 주는 거 괜찮을까?","u":18,"ut":"What I","sec":"의문문","lv":"basic","nw":8,"sp":null,"d":2},{"i":862,"en":"Sure, which part didn't you understand? I was explaining how to use the new software.","ko":"물론이죠, 어떤 부분을 이해하지 못하셨나요? 새로운 소프트웨어 사용법을 설명하고 있었어요","u":18,"ut":"What I","sec":"의문문","lv":"basic","nw":15,"sp":null,"d":3},{"i":863,"en":"Can I have what I ordered yesterday?","ko":"어제 주문한 거 받을 수 있을까요?","u":18,"ut":"What I","sec":"의문문","lv":"basic","nw":7,"sp":null,"d":2},{"i":864,"en":"Yes, of course, let me get that for you right away.","ko":"네, 물론이죠. 바로 가져다 드릴게요","u":18,"ut":"What I","sec":"의문문","lv":"basic","nw":11,"sp":null,"d":2},{"i":865,"en":"What do you want me to do?","ko":"내가 뭘 하기를 원하니?","u":18,"ut":"What I","sec":"의문문","lv":"basic","nw":7,"sp":null,"d":2},{"i":866,"en":"Is that what you want me to do?","ko":"이게 당신이 내가 하기를 원하는 거야?","u":18,"ut":"What I","sec":"의문문","lv":"basic","nw":8,"sp":null,"d":2},{"i":867,"en":"Is that what you want me to do? Send this email to everyone in the department?","ko":"이게 당신이 내가 하기를 원하는 거야? 이 이메일을 부서의 모든 사람에게 보내는 거?","u":18,"ut":"What I","sec":"의문문","lv":"basic","nw":16,"sp":null,"d":3},{"i":868,"en":"I’ll do what I can.","ko":"내가 할 수 있는 건 해 볼게","u":18,"ut":"What I","sec":"의문문","lv":"basic","nw":5,"sp":null,"d":1},{"i":869,"en":"You are what you eat.","ko":"넌 네가 먹는 대로 되어","u":18,"ut":"What I","sec":"의문문","lv":"basic","nw":5,"sp":null,"d":1},{"i":870,"en":"That’s what I call amazing!","ko":"그게 바로 내가 말하는 대단한 거야!","u":18,"ut":"What I","sec":"의문문","lv":"basic","nw":5,"sp":null,"d":1},{"i":871,"en":"That’s what friends are for.","ko":"그게 친구가 존재하는 이유야","u":18,"ut":"What I","sec":"의문문","lv":"basic","nw":5,"sp":null,"d":1},{"i":872,"en":"What matters is how you handle the situation.","ko":"중요한 건 네가 그 상황을 어떻게 다루느냐야","u":18,"ut":"What I","sec":"의문문","lv":"basic","nw":8,"sp":null,"d":2},{"i":873,"en":"What I love most about this city is the food.","ko":"내가 이 도시에서 가장 사랑하는 건 음식이야","u":18,"ut":"What I","sec":"의문문","lv":"basic","nw":10,"sp":null,"d":2},{"i":874,"en":"What we have done here is important to them.","ko":"우리가 여기서 해 온 일들은 그들에게 중요해","u":18,"ut":"What I","sec":"의문문","lv":"basic","nw":9,"sp":null,"d":2},{"i":875,"en":"What if we try a different approach?","ko":"다른 방법을 시도하면 어떻게 될까?","u":18,"ut":"What I","sec":"의문문","lv":"basic","nw":7,"sp":null,"d":2},{"i":876,"en":"What happens next is up to you.","ko":"다음에 무슨 일이 일어날지는 너한테 달려 있어","u":18,"ut":"What I","sec":"의문문","lv":"basic","nw":7,"sp":null,"d":2},{"i":877,"en":"What worries me the most is your health.","ko":"나를 가장 걱정하게 하는 건 너의 건강이야","u":18,"ut":"What I","sec":"의문문","lv":"basic","nw":8,"sp":null,"d":2},{"i":878,"en":"Do you know what makes him so confident?","ko":"무엇이 그를 저렇게 자신감 있게 만드는지 아니?","u":18,"ut":"What I","sec":"의문문","lv":"basic","nw":8,"sp":null,"d":2},{"i":879,"en":"Can you tell me what changed your mind?","ko":"네 마음을 바꾼 게 뭔지 말해 줄 수 있어?","u":18,"ut":"What I","sec":"의문문","lv":"basic","nw":8,"sp":null,"d":2},{"i":880,"en":"What matters most is your happiness.","ko":"가장 중요한 건 너의 행복이야","u":18,"ut":"What I","sec":"의문문","lv":"basic","nw":6,"sp":null,"d":1},{"i":881,"en":"What surprised me was his reaction.","ko":"나를 놀라게 한 건 그의 반응이었어","u":18,"ut":"What I","sec":"의문문","lv":"basic","nw":6,"sp":null,"d":1},{"i":882,"en":"Life is unpredictable. No matter what happens, never stop chasing your dreams.","ko":"인생은 예측할 수 없어. 무슨 일이 있어도 꿈을 쫓는 걸 멈추지 마","u":18,"ut":"What I","sec":"들어보기","lv":"talk","nw":12,"sp":null,"d":2},{"i":883,"en":"Whatever obstacles come your way, face them with confidence.","ko":"어떤 장애물이 너에 길에 다가와도 자신감을 갖고 맞서","u":18,"ut":"What I","sec":"들어보기","lv":"talk","nw":9,"sp":null,"d":2},{"i":884,"en":"People might doubt you, but what really matters is how much you believe in yourself.","ko":"사람들이 널 의심할 수도 있지만, 정말 중요한 건 네가 얼마나 스스로를 믿느냐야","u":18,"ut":"What I","sec":"들어보기","lv":"talk","nw":15,"sp":null,"d":3},{"i":885,"en":"Do what makes you happy, and success will follow.","ko":"너를 행복하게 하는 일을 해, 그러면 성공은 따라올 거야","u":18,"ut":"What I","sec":"들어보기","lv":"talk","nw":9,"sp":null,"d":2},{"i":886,"en":"Lately, I feel like nothing is going right. I don’t know what to do with my life.","ko":"요즘 제대로 되는 게 없는 느낌이야. 내 인생을 어떻게 해야 할지 모르겠어","u":18,"ut":"What I","sec":"대화해보기","lv":"talk","nw":17,"sp":null,"d":3},{"i":887,"en":"I get it. Life can be tough sometimes. But no matter what, I’m here for you.","ko":"이해해. 가끔은 인생이 힘들 수도 있어. 하지만 무슨 일이 있어도 난 네 곁에 있을 거야","u":18,"ut":"What I","sec":"대화해보기","lv":"talk","nw":16,"sp":null,"d":3},{"i":888,"en":"Thanks. But what if things never get better?","ko":"고마워. 하지만 샹황이 나아지지 않으면 어떻하지?","u":18,"ut":"What I","sec":"대화해보기","lv":"talk","nw":8,"sp":null,"d":2},{"i":889,"en":"Whatever happens, time will pass, and things will change. Just let’s take it one step at a time.","ko":"무슨 일이 있어도 시간은 흐를 거고, 상황은 변할 거야. 그냥 한 걸음씩 나아가자.","u":18,"ut":"What I","sec":"대화해보기","lv":"talk","nw":18,"sp":null,"d":3},{"i":890,"en":"Swimming is fun.","ko":"수영하는 건 재미있어","u":19,"ut":"ing","sec":"기본 표현","lv":"basic","nw":3,"sp":null,"d":1},{"i":891,"en":"I enjoy reading books.","ko":"나는 책 읽는 것을 즐겨","u":19,"ut":"ing","sec":"기본 표현","lv":"basic","nw":4,"sp":null,"d":1},{"i":892,"en":"He is good at drawing.","ko":"그는 그림 그리기를 잘해","u":19,"ut":"ing","sec":"기본 표현","lv":"basic","nw":5,"sp":null,"d":1},{"i":893,"en":"I spent the whole day watching a Korean drama series.","ko":"나는 하루 종일 한국 드라마 보느라고 시간을 다 썼어","u":19,"ut":"ing","sec":"기본 표현","lv":"basic","nw":10,"sp":null,"d":2},{"i":894,"en":"I hurt my back.","ko":"나 허리를 다쳤어","u":19,"ut":"ing","sec":"기본 표현","lv":"basic","nw":4,"sp":null,"d":1},{"i":895,"en":"I hurt my back lifting a heavy box.","ko":"나 무거운 상자를 들다가 허리를 다쳤어","u":19,"ut":"ing","sec":"기본 표현","lv":"basic","nw":8,"sp":null,"d":2},{"i":896,"en":"He fell asleep.","ko":"그는 잠들어 버렸어","u":19,"ut":"ing","sec":"기본 표현","lv":"basic","nw":3,"sp":null,"d":1},{"i":897,"en":"He fell asleep watching TV.","ko":"그는 TV를 보다가 잠들어 버렸어","u":19,"ut":"ing","sec":"기본 표현","lv":"basic","nw":5,"sp":null,"d":1},{"i":898,"en":"I always drink coffee.","ko":"나는 항상 커피를 마셔","u":19,"ut":"ing","sec":"기본 표현","lv":"basic","nw":4,"sp":null,"d":1},{"i":899,"en":"I always drink coffee (while) reading the news.","ko":"나는 항상 뉴스를 읽으면서 커피를 마셔","u":19,"ut":"ing","sec":"기본 표현","lv":"basic","nw":8,"sp":null,"d":2},{"i":900,"en":"She listens to music.","ko":"그녀는 음악을 들어","u":19,"ut":"ing","sec":"기본 표현","lv":"basic","nw":4,"sp":null,"d":1},{"i":901,"en":"She listens to music while studying.","ko":"그녀는 공부하면서 음악을 들어","u":19,"ut":"ing","sec":"기본 표현","lv":"basic","nw":6,"sp":null,"d":1},{"i":902,"en":"Don’t talk.","ko":"말하지 마","u":19,"ut":"ing","sec":"기본 표현","lv":"basic","nw":2,"sp":null,"d":1},{"i":903,"en":"Don’t talk while eating.","ko":"먹으면서 말하지 마","u":19,"ut":"ing","sec":"기본 표현","lv":"basic","nw":4,"sp":null,"d":1},{"i":904,"en":"He walked into the room.","ko":"그는 (걸어서) 방에 들어왔어","u":19,"ut":"ing","sec":"기본 표현","lv":"basic","nw":5,"sp":null,"d":1},{"i":905,"en":"He walked into the room smiling.","ko":"그는 미소 지으며 방에 들어왔어","u":19,"ut":"ing","sec":"기본 표현","lv":"basic","nw":6,"sp":null,"d":1},{"i":906,"en":"She left.","ko":"그녀는 떠났어","u":19,"ut":"ing","sec":"기본 표현","lv":"basic","nw":2,"sp":null,"d":1},{"i":907,"en":"She left crying.","ko":"그녀는 울면서 떠났어","u":19,"ut":"ing","sec":"기본 표현","lv":"basic","nw":3,"sp":null,"d":1},{"i":908,"en":"I sat on the couch.","ko":"나는 소파에 앉았어요","u":19,"ut":"ing","sec":"기본 표현","lv":"basic","nw":5,"sp":null,"d":1},{"i":909,"en":"I sat on the couch thinking about my day.","ko":"나는 소파에 앉아서 오늘 하루를 생각했어요","u":19,"ut":"ing","sec":"기본 표현","lv":"basic","nw":9,"sp":null,"d":2},{"i":910,"en":"He stood there.","ko":"그는 거기 서 있었어","u":19,"ut":"ing","sec":"기본 표현","lv":"basic","nw":3,"sp":null,"d":1},{"i":911,"en":"He stood there looking at me.","ko":"그는 거기 서서 나를 바라봤어","u":19,"ut":"ing","sec":"기본 표현","lv":"basic","nw":6,"sp":null,"d":1},{"i":912,"en":"She got rich.","ko":"그녀는 부자가 되었어","u":19,"ut":"ing","sec":"기본 표현","lv":"basic","nw":3,"sp":null,"d":1},{"i":913,"en":"She got rich investing in stocks.","ko":"그녀는 주식에 투자해서 부자가 되었어","u":19,"ut":"ing","sec":"기본 표현","lv":"basic","nw":6,"sp":null,"d":1},{"i":914,"en":"I got lost.","ko":"나는 길을 잃었었어","u":19,"ut":"ing","sec":"기본 표현","lv":"basic","nw":3,"sp":null,"d":1},{"i":915,"en":"I got lost walking around the city.","ko":"나는 도시를 돌아다니다가 길을 잃었어","u":19,"ut":"ing","sec":"기본 표현","lv":"basic","nw":7,"sp":null,"d":2},{"i":916,"en":"I got in trouble.","ko":"나는 곤란해졌었어","u":19,"ut":"ing","sec":"기본 표현","lv":"basic","nw":4,"sp":null,"d":1},{"i":917,"en":"I got in trouble talking back to my boss.","ko":"나는 보스한테 말대꾸하다가 곤란해졌었어","u":19,"ut":"ing","sec":"기본 표현","lv":"basic","nw":9,"sp":null,"d":2},{"i":918,"en":"I gained weight.","ko":"나는 살이 쪘어","u":19,"ut":"ing","sec":"기본 표현","lv":"basic","nw":3,"sp":null,"d":1},{"i":919,"en":"I gained weight eating too much at night.","ko":"나는 밤에 너무 많이 먹어서 살이 쪘어","u":19,"ut":"ing","sec":"기본 표현","lv":"basic","nw":8,"sp":null,"d":2},{"i":920,"en":"He walked away.","ko":"그는 (걸어) 가버렸다","u":19,"ut":"ing","sec":"방식","lv":"basic","nw":3,"sp":null,"d":1},{"i":921,"en":"He walked away shaking his head.","ko":"그는 고개를 저으면서 가버렸다","u":19,"ut":"ing","sec":"방식","lv":"basic","nw":6,"sp":null,"d":1},{"i":922,"en":"She texted me.","ko":"그녀는 나에게 문자를 보냈어","u":19,"ut":"ing","sec":"방식","lv":"basic","nw":3,"sp":null,"d":1},{"i":923,"en":"She texted me laughing.","ko":"그녀는 웃으면서 나에게 문자를 보냈어","u":19,"ut":"ing","sec":"방식","lv":"basic","nw":4,"sp":null,"d":1},{"i":924,"en":"He spoke whispering.","ko":"그는 속삭이면서 말했어","u":19,"ut":"ing","sec":"방식","lv":"basic","nw":3,"sp":null,"d":1},{"i":925,"en":"She drives humming a song.","ko":"그녀는 노래를 흥얼거리며 운전한다","u":19,"ut":"ing","sec":"방식","lv":"basic","nw":5,"sp":null,"d":1},{"i":926,"en":"I’ve learned a lot.","ko":"나는 많이 배워왔어","u":19,"ut":"ing","sec":"경험","lv":"basic","nw":4,"sp":null,"d":1},{"i":927,"en":"I have learned a lot working at the company.","ko":"나는 그 회사에서 일하면서 많이 배워왔어","u":19,"ut":"ing","sec":"경험","lv":"basic","nw":9,"sp":null,"d":2},{"i":928,"en":"I met a lot of people.","ko":"나는 많은 사람들을 만났었어","u":19,"ut":"ing","sec":"경험","lv":"basic","nw":6,"sp":null,"d":1},{"i":929,"en":"I met a lot of people traveling abroad.","ko":"나는 해외 여행을 하면서 많은 사람들을 만났었어","u":19,"ut":"ing","sec":"경험","lv":"basic","nw":8,"sp":null,"d":2},{"i":930,"en":"He improved his English.","ko":"그는 영어 실력이 늘었어","u":19,"ut":"ing","sec":"경험","lv":"basic","nw":4,"sp":null,"d":1},{"i":931,"en":"He improved his English talking to foreigners.","ko":"그는 외국인들과 얘기하면서 영어 실력이 늘었어","u":19,"ut":"ing","sec":"경험","lv":"basic","nw":7,"sp":null,"d":2},{"i":932,"en":"She got confident.","ko":"그녀는 자신감을 얻었어","u":19,"ut":"ing","sec":"경험","lv":"basic","nw":3,"sp":null,"d":1},{"i":933,"en":"She got confident practicing speaking English every day.","ko":"그녀는 매일 영어 말하기를 연습하면서 자신감을 얻었어","u":19,"ut":"ing","sec":"경험","lv":"basic","nw":8,"sp":null,"d":2},{"i":934,"en":"I am taking care of my health by jogging every morning these days.","ko":"요즘 매일 아침 조깅하면서 건강을 챙기고 있어","u":19,"ut":"ing","sec":"대화해보기_전치사 뒤 ~ing","lv":"talk","nw":13,"sp":null,"d":3},{"i":935,"en":"My stamina improved a lot while jogging.","ko":"조깅하면서 체력이 많이 향상됐어","u":19,"ut":"ing","sec":"대화해보기_전치사 뒤 ~ing","lv":"talk","nw":7,"sp":null,"d":2},{"i":936,"en":"Are you doing other exercises as well?","ko":"다른 운동도 함께 하고 있어?","u":19,"ut":"ing","sec":"대화해보기_전치사 뒤 ~ing","lv":"talk","nw":7,"sp":null,"d":2},{"i":937,"en":"Yes, I am also improving my flexibility by taking yoga classes.","ko":"응, 요가 수업을 들으면서 유연성도 길러지고 있어","u":19,"ut":"ing","sec":"대화해보기_전치사 뒤 ~ing","lv":"talk","nw":11,"sp":null,"d":2},{"i":938,"en":"Taking yoga classes must be relaxing both your body and mind.","ko":"요가 수업을 들으면서 몸과 마음이 모두 편안해지겠네","u":19,"ut":"ing","sec":"대화해보기_전치사 뒤 ~ing","lv":"talk","nw":11,"sp":null,"d":2},{"i":939,"en":"Editing videos takes a lot of time, but it’s fun.","ko":"비디오 편집이 시간이 많이 걸리지만, 재미있어","u":19,"ut":"ing","sec":"대화해보기","lv":"talk","nw":10,"sp":null,"d":2},{"i":940,"en":"I know! Watching professional YouTubers, I learn so many tricks.","ko":"알아. 전문적인 유튜버들을 보면서, 나는 정말 많은 기법들을 배워","u":19,"ut":"ing","sec":"대화해보기","lv":"talk","nw":10,"sp":null,"d":2},{"i":941,"en":"Right! But talking to the camera feels awkward at first.","ko":"맞아, 하지만 처음에는 카메라 앞에서 얘기하는 게 정말 어색하게 느껴지지","u":19,"ut":"ing","sec":"대화해보기","lv":"talk","nw":10,"sp":null,"d":2},{"i":942,"en":"Yeah, but practicing every day helps.","ko":"응, 하지만 매일 반복하는 게 도움이 돼","u":19,"ut":"ing","sec":"대화해보기","lv":"talk","nw":6,"sp":null,"d":1},{"i":943,"en":"I’m thinking of starting my own channel.","ko":"나 내 채널 시작하는 거 생각 중이야","u":19,"ut":"ing","sec":"대화해보기","lv":"talk","nw":7,"sp":null,"d":2},{"i":944,"en":"That’s great! Creating engaging content is the key to success.","ko":"그거 좋네. 매력적인 컨텐츠를 만들어 내는 게 성공의 열쇠이지","u":19,"ut":"ing","sec":"대화해보기","lv":"talk","nw":10,"sp":null,"d":2},{"i":945,"en":"Traveling to China for business was a unique experience.","ko":"중국 출장 여행은 독특한 경험이었어","u":19,"ut":"ing","sec":"대화해보기","lv":"talk","nw":9,"sp":null,"d":2},{"i":946,"en":"Really? Communicating with local people must have been challenging.","ko":"정말? 현지인들과의 소통은 힘든 일이었겠네","u":19,"ut":"ing","sec":"대화해보기","lv":"talk","nw":9,"sp":null,"d":2},{"i":947,"en":"Yes, but using translation apps made it easier.","ko":"맞아, 하지만 통역 앱이 그걸 쉽게 만들긴 했지","u":19,"ut":"ing","sec":"대화해보기","lv":"talk","nw":8,"sp":null,"d":2},{"i":948,"en":"What about business meetings? Did you present in English?","ko":"비즈니스 미팅은 어땠어? 영어로 발표했었어?","u":19,"ut":"ing","sec":"대화해보기","lv":"talk","nw":9,"sp":null,"d":2},{"i":949,"en":"Yes. Speaking clearly and slowly helped them understand better.","ko":"응, 명확하고 천천히 얘기하는 것이 그들을 더 잘 알아듣게 했었지","u":19,"ut":"ing","sec":"대화해보기","lv":"talk","nw":9,"sp":null,"d":2},{"i":950,"en":"That makes sense. Some Chinese professionals are good at listening but struggle with speaking.","ko":"그거 이해되네. 일부 중국 전문가들은 듣는 건 잘하는데, 말하는 거에 어려움을 느끼더라고","u":19,"ut":"ing","sec":"대화해보기","lv":"talk","nw":14,"sp":null,"d":3},{"i":951,"en":"Exactly. Explaining ideas with simple words is useful.","ko":"정확해. 간단한 단어로 개념을 설명하는 것이 유용해","u":19,"ut":"ing","sec":"대화해보기","lv":"talk","nw":8,"sp":null,"d":2},{"i":952,"en":"I’m planning to visit China next month. I look forward to it.","ko":"나 다음 달에 중국 출장 계획하고 있어. 나 기대하고 있어","u":19,"ut":"ing","sec":"대화해보기","lv":"talk","nw":12,"sp":null,"d":2},{"i":953,"en":"People are very friendly.","ko":"사람들은 매우 우호적이야","u":20,"ut":"who","sec":"표현","lv":"basic","nw":4,"sp":null,"d":1},{"i":954,"en":"People who live in my neighborhood are very friendly.","ko":"내 이웃에 사는 사람들은 매우 우호적이야","u":20,"ut":"who","sec":"표현","lv":"basic","nw":9,"sp":null,"d":2},{"i":955,"en":"People living in my neighborhood are very friendly.","ko":"내 이웃에 살고 있는 사람들은 매우 우호적이야","u":20,"ut":"who","sec":"표현","lv":"basic","nw":8,"sp":null,"d":2},{"i":956,"en":"The girl is my best friend.","ko":"저 여자애는 내 베프야","u":20,"ut":"who","sec":"표현","lv":"basic","nw":6,"sp":null,"d":1},{"i":957,"en":"The girl who is sitting next to me is my best friend.","ko":"(지금) 내 옆에 앉아 있는 이 여자애는 내 베프야","u":20,"ut":"who","sec":"표현","lv":"basic","nw":12,"sp":null,"d":2},{"i":958,"en":"The girl sitting next to me is my best friend.","ko":"내 옆에 앉는 (앉아 있는) 이 여자애는 내 베프야","u":20,"ut":"who","sec":"표현","lv":"basic","nw":10,"sp":null,"d":2},{"i":959,"en":"I like teachers who encourage students.","ko":"나는 학생들에게 자극을 주는 선생님들을 좋아해","u":20,"ut":"who","sec":"표현","lv":"basic","nw":6,"sp":null,"d":1},{"i":960,"en":"I like teachers who encourage students to think creatively.","ko":"나는 학생들에게 창의적으로 생각하도록 자극을 주는 선생님들을 좋아해","u":20,"ut":"who","sec":"표현","lv":"basic","nw":9,"sp":null,"d":2},{"i":961,"en":"You are the only one.","ko":"너는 유일한 사람이야","u":20,"ut":"who","sec":"표현","lv":"basic","nw":5,"sp":null,"d":1},{"i":962,"en":"You are the only one who truly understands me.","ko":"너는 나를 진실로 이해해 주는 유일한 사람이야","u":20,"ut":"who","sec":"표현","lv":"basic","nw":9,"sp":null,"d":2},{"i":963,"en":"The customers were very satisfied.","ko":"그 고객들은 매우 만족했었어","u":20,"ut":"who","sec":"표현","lv":"basic","nw":5,"sp":null,"d":1},{"i":964,"en":"The customers who visited our shop yesterday were very satisfied.","ko":"어제 우리 샵에 방문했던 고객들은 매우 만족했었어","u":20,"ut":"who","sec":"표현","lv":"basic","nw":10,"sp":null,"d":2},{"i":965,"en":"Students who study hard usually get good grades.","ko":"공부를 열심히 하는 학생들은 보통 좋은 점수를 받는다","u":20,"ut":"who","sec":"표현","lv":"basic","nw":8,"sp":null,"d":2},{"i":966,"en":"The man was really kind.","ko":"그 남자는 매우 친절했어","u":20,"ut":"who","sec":"표현","lv":"basic","nw":5,"sp":null,"d":1},{"i":967,"en":"The man who helped me at the airport yesterday was really kind.","ko":"어제 공항에서 나를 도와줬던 남자는 매우 친절했어","u":20,"ut":"who","sec":"표현","lv":"basic","nw":12,"sp":null,"d":2},{"i":968,"en":"I enjoy talking with people.","ko":"나는 사람들과 이야기하는 것을 즐긴다","u":20,"ut":"who","sec":"표현","lv":"basic","nw":5,"sp":null,"d":1},{"i":969,"en":"I enjoy talking with people who have different perspectives.","ko":"나는 다른 관점을 가진 사람들과 이야기하는 것을 즐긴다","u":20,"ut":"who","sec":"표현","lv":"basic","nw":9,"sp":null,"d":2},{"i":970,"en":"I enjoy talking with people who have different perspectives from me.","ko":"나는 나와 다른 관점을 가진 사람들과 이야기하는 것을 즐긴다","u":20,"ut":"who","sec":"표현","lv":"basic","nw":11,"sp":null,"d":2},{"i":971,"en":"I’m wondering who you traveled with.","ko":"나는 네가 누구랑 여행을 다녀왔는지 궁금해","u":20,"ut":"who","sec":"표현","lv":"basic","nw":6,"sp":null,"d":1},{"i":972,"en":"Can you tell me?","ko":"나에게 말해줄 수 있겠니?","u":20,"ut":"who","sec":"표현","lv":"basic","nw":4,"sp":null,"d":1},{"i":973,"en":"Can you tell me who you got this gift from?","ko":"이 선물을 네가 누구에게 받았는지 나에게 말해줄 수 있겠니?","u":20,"ut":"who","sec":"표현","lv":"basic","nw":10,"sp":null,"d":2},{"i":974,"en":"Could you tell me from whom you got this gift?","ko":"이 선물을 누구에게 받으셨는지 저에게 말해주실 수 있겠습니까?","u":20,"ut":"who","sec":"표현","lv":"basic","nw":10,"sp":null,"d":2},{"i":975,"en":"She asked me.","ko":"그녀는 나에게 물어봤어 (요청했어)","u":20,"ut":"who","sec":"표현","lv":"basic","nw":3,"sp":null,"d":1},{"i":976,"en":"She asked who you were talking about.","ko":"그녀는 네가 누구에 대해 이야기하고 있었는지 물어봤어","u":20,"ut":"who","sec":"표현","lv":"basic","nw":7,"sp":null,"d":2},{"i":977,"en":"She asked me who you were talking about.","ko":"그녀는 네가 누구에 대해 이야기하고 있었는지 나에게 물어봤어","u":20,"ut":"who","sec":"표현","lv":"basic","nw":8,"sp":null,"d":2},{"i":978,"en":"She’s interested in people.","ko":"그녀는 사람들에게 관심이 있어","u":20,"ut":"who","sec":"표현","lv":"basic","nw":4,"sp":null,"d":1},{"i":979,"en":"She’s interested in people who I have met in China.","ko":"그녀는 내가 중국에서 만나왔던 사람들에게 관심이 있어","u":20,"ut":"who","sec":"표현","lv":"basic","nw":10,"sp":null,"d":2},{"i":980,"en":"They hired the guy you recommended.","ko":"그들은 네가 추천한 그를 채용했어","u":20,"ut":"who","sec":"표현","lv":"basic","nw":6,"sp":null,"d":1},{"i":981,"en":"She would like to only work with people she respects.","ko":"그녀는 그녀가 존중하는 사람들과 일만 하고 싶어해","u":20,"ut":"who","sec":"표현","lv":"basic","nw":10,"sp":null,"d":2},{"i":982,"en":"We care about people others ignore.","ko":"우리는 다른 사람들이 무시하는 이들을 신경 써줍니다","u":20,"ut":"who","sec":"표현","lv":"basic","nw":6,"sp":null,"d":1},{"i":983,"en":"He doesn't know who she is waiting for.","ko":"그는 그녀가 누구를 기다리고 있는지 몰라","u":20,"ut":"who","sec":"표현","lv":"basic","nw":8,"sp":null,"d":2},{"i":984,"en":"We talked about who they should apologize to.","ko":"우리는 그들이 누구에게 사과해야 하는지에 대하여 이야기했어","u":20,"ut":"who","sec":"표현","lv":"basic","nw":8,"sp":null,"d":2},{"i":985,"en":"I have no idea who she went to the party with.","ko":"나는 그녀가 누구랑 파티에 갔다 왔는지 전혀 모르겠어","u":20,"ut":"who","sec":"표현","lv":"basic","nw":11,"sp":null,"d":2},{"i":986,"en":"He is thinking about who he can trust.","ko":"그는 누구를 신뢰할 수 있는지 생각 중이야","u":20,"ut":"who","sec":"표현","lv":"basic","nw":8,"sp":null,"d":2},{"i":987,"en":"I am wondering with whom you traveled.","ko":"나는 당신이 누구와 여행을 하셨었는지 궁금해 하던 참입니다","u":20,"ut":"who","sec":"표현","lv":"basic","nw":7,"sp":null,"d":2},{"i":988,"en":"She asked about whom you were talking.","ko":"그녀는 당신이 누구에 대하여 이야기를 나누고 있던 중인지 물었습니다","u":20,"ut":"who","sec":"표현","lv":"basic","nw":7,"sp":null,"d":2},{"i":989,"en":"I’ll always support you, no matter what.","ko":"무슨 일이 있어도 난 항상 널 응원할 거야","u":21,"ut":"No matter what","sec":"표현","lv":"basic","nw":7,"sp":null,"d":2},{"i":990,"en":"I’ll be by your side, no matter what.","ko":"어떤 일이 있어도 네 곁에 있을게","u":21,"ut":"No matter what","sec":"표현","lv":"basic","nw":8,"sp":null,"d":2},{"i":991,"en":"No matter what, keep moving forward.","ko":"무슨 일이 있어도 계속 나아가","u":21,"ut":"No matter what","sec":"표현","lv":"basic","nw":6,"sp":null,"d":1},{"i":992,"en":"You look great no matter what you wear.","ko":"너는 뭘 입어도 멋져 보여","u":21,"ut":"No matter what","sec":"표현","lv":"basic","nw":8,"sp":null,"d":2},{"i":993,"en":"He looks great no matter what he wears.","ko":"그는 뭘 입어도 멋져 보어","u":21,"ut":"No matter what","sec":"표현","lv":"basic","nw":8,"sp":null,"d":2},{"i":994,"en":"No matter what happens, be careful.","ko":"무슨 일이 생겨도 신중해야 해","u":21,"ut":"No matter what","sec":"표현","lv":"basic","nw":6,"sp":null,"d":1},{"i":995,"en":"No matter what people say, don’t give up.","ko":"사람들이 뭐라고 얘기하든 포기하지마","u":21,"ut":"No matter what","sec":"표현","lv":"basic","nw":8,"sp":null,"d":2},{"i":996,"en":"No matter what you do, it’s important to do your best.","ko":"네가 뭘 하든지 간에 최선을 다하는 것이 중요해","u":21,"ut":"No matter what","sec":"표현","lv":"basic","nw":11,"sp":null,"d":2},{"i":997,"en":"No matter what you say, I won’t be mad at you.","ko":"네가 뭐라고 말하든 나는 너에게 화내지 않을거야","u":21,"ut":"No matter what","sec":"표현","lv":"basic","nw":11,"sp":null,"d":2},{"i":998,"en":"Come what may, I’ll never leave you.","ko":"무슨 일이 있든 난 널 떠나지 않을 거야","u":21,"ut":"No matter what","sec":"표현","lv":"basic","nw":7,"sp":null,"d":2},{"i":999,"en":"No matter what happens, I will be there for you.","ko":"무슨 일이 있어도 널 위해 그곳에 있을게(갈게)","u":21,"ut":"No matter what","sec":"표현","lv":"basic","nw":10,"sp":null,"d":2},{"i":1000,"en":"No matter what I say, he won’t change his mind.","ko":"내가 무슨 말을 하든, 그는 마음을 바꾸지 않을 거야","u":21,"ut":"No matter what","sec":"표현","lv":"basic","nw":10,"sp":null,"d":2},{"i":1001,"en":"No matter what the cost is, I’m buying you that.","ko":"비용이 얼마나 되든 내가 그걸 너에게 사주기로 했어","u":21,"ut":"No matter what","sec":"표현","lv":"basic","nw":10,"sp":null,"d":2},{"i":1002,"en":"No matter what the situation is like, we will complete this project.","ko":"상황이 어떠하더라도 우리는 이 프로젝트를 끝낼 거다","u":21,"ut":"No matter what","sec":"표현","lv":"basic","nw":12,"sp":null,"d":2},{"i":1003,"en":"No matter which one you choose (from these), you won’t regret it.","ko":"이 중에서 네가 뭘 선택하든지 간에 너는 후회하지 않을 거야","u":21,"ut":"No matter what","sec":"표현","lv":"basic","nw":12,"sp":null,"d":2},{"i":1004,"en":"Take whatever you want.","ko":"너가 원하는 것은 무엇이든 (그거) 가져가","u":21,"ut":"No matter what","sec":"표현","lv":"basic","nw":4,"sp":null,"d":1},{"i":1005,"en":"You can eat whatever is in the fridge.","ko":"냉장고에 무엇이 있든지 넌 먹을 수 있어","u":21,"ut":"No matter what","sec":"표현","lv":"basic","nw":8,"sp":null,"d":2},{"i":1006,"en":"Whatever you decide is fine with me.","ko":"너가 무엇을 결정하든지 간에 (난 다) 좋아","u":21,"ut":"No matter what","sec":"표현","lv":"basic","nw":7,"sp":null,"d":2},{"i":1007,"en":"No matter what you do, will you be happy?","ko":"너가 무엇을 하든, 너 행복하겠어?","u":21,"ut":"No matter what","sec":"표현","lv":"basic","nw":9,"sp":null,"d":2},{"i":1008,"en":"No matter what he tries, it doesn’t work.","ko":"그가 무엇을 시도하든, 그건 안돼","u":21,"ut":"No matter what","sec":"표현","lv":"basic","nw":8,"sp":null,"d":2},{"i":1009,"en":"No matter what anyone believes, the Earth is round.","ko":"누가 무엇을 믿든, 지구는 둥글다","u":21,"ut":"No matter what","sec":"표현","lv":"basic","nw":9,"sp":null,"d":2},{"i":1010,"en":"No matter what he says, I don’t believe him.","ko":"그가 무슨 말을 하든, 난 안 믿어","u":21,"ut":"No matter what","sec":"표현","lv":"basic","nw":9,"sp":null,"d":2},{"i":1011,"en":"No matter who calls, don’t answer.","ko":"누가 부르든지 (전화)간에 응답하지 마","u":21,"ut":"No matter what","sec":"표현","lv":"basic","nw":6,"sp":null,"d":1},{"i":1012,"en":"I will talk to whoever is in charge.","ko":"담당자가 누구든지 간에 그에게 얘기해 볼게","u":21,"ut":"No matter what","sec":"표현","lv":"basic","nw":8,"sp":null,"d":2},{"i":1013,"en":"No matter where you go, I’ll follow you.","ko":"니가 어디를 가든 난 따라갈 거다","u":21,"ut":"No matter what","sec":"표현","lv":"basic","nw":8,"sp":null,"d":2},{"i":1014,"en":"Take me wherever you want.","ko":"니가 어딜 가길 원하든 나도 데려가","u":21,"ut":"No matter what","sec":"표현","lv":"basic","nw":5,"sp":null,"d":1},{"i":1015,"en":"No matter when we start, it’ll be fun.","ko":"우리가 언제 시작하든 재미있을 거야","u":21,"ut":"No matter what","sec":"표현","lv":"basic","nw":8,"sp":null,"d":2},{"i":1016,"en":"You can visit Korea whenever you want.","ko":"언제든 너가 원할 때 한국을 방문해도 좋아","u":21,"ut":"No matter what","sec":"표현","lv":"basic","nw":7,"sp":null,"d":2},{"i":1017,"en":"No matter why you left, I still miss you.","ko":"너가 왜 떠났든 난 여전히 너가 그립다","u":21,"ut":"No matter what","sec":"표현","lv":"basic","nw":9,"sp":null,"d":2},{"i":1018,"en":"No matter how hard it is, it’s worth it to try.","ko":"그게 얼마나 힘들든, 해 볼만한 가치가 있다","u":21,"ut":"No matter what","sec":"표현","lv":"basic","nw":11,"sp":null,"d":2},{"i":1019,"en":"I don’t know if I can do this… What if I fail?","ko":"내가 이걸 해낼 수 있을지 모르겠어… 만약 실패하면 어떻하지?","u":21,"ut":"No matter what","sec":"들어보기","lv":"talk","nw":12,"sp":null,"d":2},{"i":1020,"en":"It doesn’t matter. I’ll always support you, no matter what.","ko":"그건 중요하지 않아. 무슨 일이 있어도 난 항상 널 응원할 거야","u":21,"ut":"No matter what","sec":"들어보기","lv":"talk","nw":10,"sp":null,"d":2},{"i":1021,"en":"That really means a lot. Thank you.","ko":"그 말 정말 큰 힘이 돼. 고마워","u":21,"ut":"No matter what","sec":"들어보기","lv":"talk","nw":7,"sp":null,"d":2},{"i":1022,"en":"Life can be unpredictable. What if things get really tough for us?","ko":"인생은 예측할 수 없잖아. 우리에게 정말 힘든 일이 생기면 어떻하지?","u":21,"ut":"No matter what","sec":"들어보기","lv":"talk","nw":12,"sp":null,"d":2},{"i":1023,"en":"No matter what happens, I’ll be by your side.","ko":"무슨 일이 생겨도 난 항상 너의 곁에 있을 거야","u":21,"ut":"No matter what","sec":"들어보기","lv":"talk","nw":9,"sp":null,"d":2},{"i":1024,"en":"I feel so lucky to have you.","ko":"너가 있어서 난 정말 행운이라 느껴","u":21,"ut":"No matter what","sec":"들어보기","lv":"talk","nw":7,"sp":null,"d":2},{"i":1025,"en":"I can’t decide between this dress or the other one. Which one do you like better?","ko":"이 드레스랑 저 드레스 중에서 못 고르겠어. 넌 어떤 게 더 좋아?","u":21,"ut":"No matter what","sec":"들어보기","lv":"talk","nw":16,"sp":null,"d":3},{"i":1026,"en":"Honestly? You look great no matter what you wear. Just go with whatever makes you feel comfortable.","ko":"솔직히? 넌 뭘 입든 멋져 보여. 그냥 편한 걸로 입어","u":21,"ut":"No matter what","sec":"들어보기","lv":"talk","nw":17,"sp":null,"d":3},{"i":1027,"en":"Aww, that’s so sweet. Okay, I’ll wear this one then!","ko":"아, 정말 다정하네. 좋아. 그럼 이거 입을게!","u":21,"ut":"No matter what","sec":"들어보기","lv":"talk","nw":10,"sp":null,"d":2},{"i":1028,"en":"No matter what they tell us","ko":"그들이 우리에게 뭐라고 얘기하든(상관없어)","u":21,"ut":"No matter what","sec":"들어보기","lv":"talk","nw":6,"sp":null,"d":1},{"i":1029,"en":"No matter what they do","ko":"그들이 무슨 짓을 하든","u":21,"ut":"No matter what","sec":"들어보기","lv":"talk","nw":5,"sp":null,"d":1},{"i":1030,"en":"No matter what they teach us","ko":"그들이 우리에게 무얼 가르치든","u":21,"ut":"No matter what","sec":"들어보기","lv":"talk","nw":6,"sp":null,"d":1},{"i":1031,"en":"What we believe is true.","ko":"우리가 믿는 게 진실이지","u":21,"ut":"No matter what","sec":"들어보기","lv":"talk","nw":5,"sp":null,"d":1},{"i":1032,"en":"No matter what they call us","ko":"그들이 우리를 뭐라고 부르든","u":21,"ut":"No matter what","sec":"들어보기","lv":"talk","nw":6,"sp":null,"d":1},{"i":1033,"en":"However they attack","ko":"그들이 어떻게 공격하든","u":21,"ut":"No matter what","sec":"들어보기","lv":"talk","nw":3,"sp":null,"d":1},{"i":1034,"en":"No matter where they take us","ko":"그들이 우리를 어디로 데려가든","u":21,"ut":"No matter what","sec":"들어보기","lv":"talk","nw":6,"sp":null,"d":1},{"i":1035,"en":"We'll find our own way back","ko":"우리는 우리의 길을 찾아 돌아올 거야","u":21,"ut":"No matter what","sec":"들어보기","lv":"talk","nw":6,"sp":null,"d":1},{"i":1036,"en":"I can't deny what I believe","ko":"내가 믿는 걸 부정할 수 없어","u":21,"ut":"No matter what","sec":"들어보기","lv":"talk","nw":6,"sp":null,"d":1},{"i":1037,"en":"I can't be what I'm not","ko":"내가 아닌 다른 사람이 될 수 없어","u":21,"ut":"No matter what","sec":"들어보기","lv":"talk","nw":6,"sp":null,"d":1},{"i":1038,"en":"I know our love's forever","ko":"우리 사랑이 영원하다는 걸 알아","u":21,"ut":"No matter what","sec":"들어보기","lv":"talk","nw":5,"sp":null,"d":1},{"i":1039,"en":"I know, no matter what","ko":"어떤 일이 있어도, 나는 알아","u":21,"ut":"No matter what","sec":"들어보기","lv":"talk","nw":5,"sp":null,"d":1},{"i":1040,"en":"If only tears were laughter","ko":"단지 눈물이 웃음이라면","u":21,"ut":"No matter what","sec":"들어보기","lv":"talk","nw":5,"sp":null,"d":1},{"i":1041,"en":"If only night was day","ko":"단지 밤이 낮이라면","u":21,"ut":"No matter what","sec":"들어보기","lv":"talk","nw":5,"sp":null,"d":1},{"i":1042,"en":"If only prayers were answered","ko":"단지 기도가 응답받는다면","u":21,"ut":"No matter what","sec":"들어보기","lv":"talk","nw":5,"sp":null,"d":1},{"i":1043,"en":"Then we would hear God say","ko":"그러면 우리는 신의 목소리를 들을텐데","u":21,"ut":"No matter what","sec":"들어보기","lv":"talk","nw":6,"sp":null,"d":1},{"i":1044,"en":"No matter what they tell you","ko":"그들이 너에게 뭐라고 얘기하든","u":21,"ut":"No matter what","sec":"들어보기","lv":"talk","nw":6,"sp":null,"d":1},{"i":1045,"en":"No matter what they teach you","ko":"그들이 너에게 무얼 가르치든","u":21,"ut":"No matter what","sec":"들어보기","lv":"talk","nw":6,"sp":null,"d":1},{"i":1046,"en":"What you believe is true.","ko":"너가 믿는 게 진실이지","u":21,"ut":"No matter what","sec":"들어보기","lv":"talk","nw":5,"sp":null,"d":1},{"i":1047,"en":"And I will keep you safe and strong","ko":"내가 널 안전하고 강하게 지켜줄게","u":21,"ut":"No matter what","sec":"들어보기","lv":"talk","nw":8,"sp":null,"d":2},{"i":1048,"en":"And sheltered from the storm","ko":"그리고 폭풍으로부터 보호할게","u":21,"ut":"No matter what","sec":"들어보기","lv":"talk","nw":5,"sp":null,"d":1},{"i":1049,"en":"No matter who they follow","ko":"그들이 누구를 따르든","u":21,"ut":"No matter what","sec":"들어보기","lv":"talk","nw":5,"sp":null,"d":1},{"i":1050,"en":"No matter where they lead","ko":"그들이 어디로 이끌든","u":21,"ut":"No matter what","sec":"들어보기","lv":"talk","nw":5,"sp":null,"d":1},{"i":1051,"en":"No matter how they judge us" ","sec":"기본표현","lv":"basic","nw":11,"sp":null,"d":2},{"i":1288,"en":"Even though I’m not a fan of horror movies, I watched a thriller last night.","ko":"난 호러영화 팬은 아니지만, 어제 밤에 스릴러 한 편 봤어","u":28,"ut":"even though","sec":"기본표현","lv":"basic","nw":15,"sp":null,"d":3},{"i":1289,"en":"When was the last time you talked to your best friend you told me about?","ko":"니가 나한테 말해 준 그 절친이랑 마지막으로 얘기한 건 언제야?","u":28,"ut":"even though","sec":"기본표현","lv":"basic","nw":15,"sp":null,"d":3},{"i":1290,"en":"Even though we live far apart, we talked on the phone last week.","ko":"비록 우리가 멀리 떨어져 살지만 지난 주에 전화로 얘기 나눴어","u":28,"ut":"even though","sec":"기본표현","lv":"basic","nw":13,"sp":null,"d":3},{"i":1291,"en":"What would you do if you had a time machine?","ko":"만약 타임머신을 가지고 있다면 뭘 할거에요?","u":28,"ut":"even though","sec":"기본표현","lv":"basic","nw":10,"sp":null,"d":2},{"i":1292,"en":"Even though I would have the power to travel through time, I would still choose to focus on the present moment.","ko":"심지어 시간을 통과해서 여행하는 능력을 갖게 되더라도, 나는 계속 현재 순간에 집중하는 걸 선택할 거에요","u":28,"ut":"even though","sec":"기본표현","lv":"basic","nw":21,"sp":null,"d":3},{"i":1293,"en":"Is this your first time visiting the city?","ko":"이 도시에 처음 방문하셨나요?","u":28,"ut":"even though","sec":"기본표현","lv":"basic","nw":8,"sp":null,"d":2},{"i":1294,"en":"Even though it’s my first time, I feel like I’ve been here before. The atmosphere is very familiar.","ko":"비록 처음이지만, 마치 이 전에 온 적이 있는 것 같이 느껴져요. 분위기에 매우 익숙해요","u":28,"ut":"even though","sec":"기본표현","lv":"basic","nw":18,"sp":null,"d":3},{"i":1295,"en":"Does this train go directly to the airport?","ko":"이 열차는 공항으로 바로 가나요?","u":28,"ut":"even though","sec":"기본표현","lv":"basic","nw":8,"sp":null,"d":2},{"i":1296,"en":"Even though it doesn’t go directly, there’s a convenient transfer at the next station. It won’t take too long.","ko":"직접 가지는 않지만, 편리한 환승이 있어요 다음 역에서. 시간이 오래 걸리지 않을 거에요","u":28,"ut":"even though","sec":"기본표현","lv":"basic","nw":19,"sp":null,"d":3},{"i":1297,"en":"Have you ever traveled alone?","ko":"혼자 여행해 본 적 있어?","u":28,"ut":"even though","sec":"기본표현","lv":"basic","nw":5,"sp":null,"d":1},{"i":1298,"en":"Yes, even though I was scared at first, it turned out to be amazing.","ko":"응 처음에는 무서웠지만, 나중에는 환상적으로 변하더라고","u":28,"ut":"even though","sec":"기본표현","lv":"basic","nw":14,"sp":null,"d":3},{"i":1299,"en":"Even though I’m sick, I’m going to work.","ko":"비록 내가 아프긴 한데, 그래도 일하러 갈 거야","u":28,"ut":"even though","sec":"기본표현","lv":"basic","nw":8,"sp":null,"d":2},{"i":1300,"en":"Even if I get sick, I’ll still go to work.","ko":"만약 내가 아프게 된다 해도, 그래도 난 일하러 갈 거야","u":28,"ut":"even though","sec":"기본표현","lv":"basic","nw":10,"sp":null,"d":2},{"i":1301,"en":"Do you wake up early every day?","ko":"매일 일찍 일어나니?","u":28,"ut":"even though","sec":"듣기","lv":"talk","nw":7,"sp":null,"d":2},{"i":1302,"en":"I try to, even though I’m not a morning person.","ko":"그렇게 하려고 노력해. 심지어 난 아침형 인간이 아니지만","u":28,"ut":"even though","sec":"듣기","lv":"talk","nw":10,"sp":null,"d":2},{"i":1303,"en":"That’s impressive.","ko":"그거 인상적이네","u":28,"ut":"even though","sec":"듣기","lv":"talk","nw":2,"sp":null,"d":1},{"i":1304,"en":"Yeah, and compared to last year, I’ve become more consistent.","ko":"응, 그리고 작년과 비교해서 내가 더 일관성 있게 되었어","u":28,"ut":"even though","sec":"듣기","lv":"talk","nw":10,"sp":null,"d":2},{"i":1305,"en":"Why the change?","ko":"왜 변했어?","u":28,"ut":"even though","sec":"듣기","lv":"talk","nw":3,"sp":null,"d":1},{"i":1306,"en":"I read some research related to productivity and sleep habits.","ko":"생산성과 수면습관과 관련된 어떤 연구를 읽었어","u":28,"ut":"even though","sec":"듣기","lv":"talk","nw":10,"sp":null,"d":2},{"i":1307,"en":"Interesting!","ko":"흥미롭네","u":28,"ut":"even though","sec":"듣기","lv":"talk","nw":1,"sp":null,"d":1},{"i":1308,"en":"So now, regardless of how tired I am, I get up at 6 a.m.","ko":"그래서 지금 내가 얼마나 피곤하든지 상관없이 나 6시에 일어나","u":28,"ut":"even though","sec":"듣기","lv":"talk","nw":14,"sp":null,"d":3},{"i":1309,"en":"This is the way to the station.","ko":"이쪽이 역으로 가는 길이야","u":29,"ut":"the way","sec":"길 (방향)","lv":"basic","nw":7,"sp":null,"d":2},{"i":1310,"en":"We lost our way in the forest.","ko":"숲에서 방향을 잃었어","u":29,"ut":"the way","sec":"길 (방향)","lv":"basic","nw":7,"sp":null,"d":2},{"i":1311,"en":"I like the way you explain things.","ko":"너가 무언가 설명하는 방식이 맘에 들어","u":29,"ut":"the way","sec":"방법, 방식~","lv":"basic","nw":7,"sp":null,"d":2},{"i":1312,"en":"I don’t like the way he talks to me.","ko":"그 사람이 나한테 말하는 방식이 맘에 안 들어","u":29,"ut":"the way","sec":"방법, 방식~","lv":"basic","nw":9,"sp":null,"d":2},{"i":1313,"en":"I love the way you smile.","ko":"너 웃는 게 맘에 들어","u":29,"ut":"the way","sec":"방법, 방식~","lv":"basic","nw":6,"sp":null,"d":1},{"i":1314,"en":"The way he solved the problem was impressive.","ko":"그가 문제를 푼 방식은 인상적이었어","u":29,"ut":"the way","sec":"방법, 방식~","lv":"basic","nw":8,"sp":null,"d":2},{"i":1315,"en":"That’s just the way it is.","ko":"원래 그런 거야 (세상이 그래)","u":29,"ut":"the way","sec":"방법, 방식~","lv":"basic","nw":6,"sp":null,"d":1},{"i":1316,"en":"Leave it the way it is.","ko":"그냥 그대로 놔둬","u":29,"ut":"the way","sec":"방법, 방식~","lv":"basic","nw":6,"sp":null,"d":1},{"i":1317,"en":"I miss the way it was before the pandemic.","ko":"팬데믹 전의 현실이 그리워","u":29,"ut":"the way","sec":"방법, 방식~","lv":"basic","nw":9,"sp":null,"d":2},{"i":1318,"en":"Things don’t always go the way we want.","ko":"일은 항상 우리가 원하는 대로 되진 않아","u":29,"ut":"the way","sec":"방법, 방식~","lv":"basic","nw":8,"sp":null,"d":2},{"i":1319,"en":"That’s the way she is.","ko":"원래 그녀가 그래 (저게 저 여자분 스타일이야)","u":29,"ut":"the way","sec":"방법, 방식~","lv":"basic","nw":5,"sp":null,"d":1},{"i":1320,"en":"He always gets his way.","ko":"걔는 항상 자기 뜻대로 하잖아","u":29,"ut":"the way","sec":"방법, 방식~","lv":"basic","nw":5,"sp":null,"d":1},{"i":1321,"en":"She pointed the way to the beach.","ko":"그녀가 해변 가는 길을 가리켰어","u":29,"ut":"the way","sec":"방법, 방식~","lv":"basic","nw":7,"sp":null,"d":2},{"i":1322,"en":"Do you know the way back?","ko":"너 다시 돌아가는 길 알아?","u":29,"ut":"the way","sec":"방법, 방식~","lv":"basic","nw":6,"sp":null,"d":1},{"i":1323,"en":"He found the way home in the dark.","ko":"그는 어둠 속에서 집으로 가는 길을 찾아냈어","u":29,"ut":"the way","sec":"방법, 방식~","lv":"basic","nw":8,"sp":null,"d":2},{"i":1324,"en":"The young student walked all the way home.","ko":"그 어린 학생은 집까지 내내 걸어갔어","u":29,"ut":"the way","sec":"방법, 방식~","lv":"basic","nw":8,"sp":null,"d":2},{"i":1325,"en":"I came all the way from Korea just to see you.","ko":"너 보러 저 멀리 한국에서부터 (일부러) 왔어","u":29,"ut":"the way","sec":"방법, 방식~","lv":"basic","nw":11,"sp":null,"d":2},{"i":1326,"en":"The movie was funny all the way through.","ko":"그 영화는 처음부터 끝까지 내내 웃겼어","u":29,"ut":"the way","sec":"방법, 방식~","lv":"basic","nw":8,"sp":null,"d":2},{"i":1327,"en":"He ate all the way through dinner without saying a word.","ko":"그는 저녁식사 내내 한 마디도 없이 먹기만 했어","u":29,"ut":"the way","sec":"방법, 방식~","lv":"basic","nw":11,"sp":null,"d":2},{"i":1328,"en":"I like the way you think. It’s similar to how I see things.","ko":"네가 생각하는 방식이 좋아. 내가 뭔가를 바라보는 (생각하는) 방식과 비슷해","u":29,"ut":"the way","sec":"종합","lv":"basic","nw":13,"sp":null,"d":3},{"i":1329,"en":"After the way they treated me, I’m not going back.","ko":"그들이 나를 대했던 방식 이후로, 나는 다시 안 갈 거야","u":29,"ut":"the way","sec":"종합","lv":"basic","nw":10,"sp":null,"d":2},{"i":1330,"en":"Compared to the way we used to do it, this is much easier.","ko":"예전에 우리가 그걸 하던 방식에 비하면, 이게 훨씬 쉬워","u":29,"ut":"the way","sec":"종합","lv":"basic","nw":13,"sp":null,"d":3},{"i":1331,"en":"I’m interested in the way language is related to culture.","ko":"나는 언어가 문화에 어떻게 관련되는 지에 대해 관심이 있어","u":29,"ut":"the way","sec":"종합","lv":"basic","nw":10,"sp":null,"d":2},{"i":1332,"en":"He changed the way he works so that he could spend more time with his family.","ko":"그는 가족과 시간을 더 보내기 위해 일하는 방식을 바꿨어","u":29,"ut":"the way","sec":"종합","lv":"basic","nw":16,"sp":null,"d":3},{"i":1333,"en":"the way back","ko":"돌아가는 길","u":29,"ut":"the way","sec":"종합","lv":"basic","nw":3,"sp":null,"d":1},{"i":1334,"en":"the way in","ko":"들어가는 길","u":29,"ut":"the way","sec":"종합","lv":"basic","nw":3,"sp":null,"d":1},{"i":1335,"en":"the way out","ko":"나가는 길","u":29,"ut":"the way","sec":"종합","lv":"basic","nw":3,"sp":null,"d":1},{"i":1336,"en":"the way down","ko":"내려가는 길","u":29,"ut":"the way","sec":"종합","lv":"basic","nw":3,"sp":null,"d":1},{"i":1337,"en":"the way over to my place","ko":"우리집 쪽으로 가는 길","u":29,"ut":"the way","sec":"종합","lv":"basic","nw":6,"sp":null,"d":1},{"i":1338,"en":"the way you treated me","ko":"네가 나를 대했던 방식","u":29,"ut":"the way","sec":"종합","lv":"basic","nw":5,"sp":null,"d":1},{"i":1339,"en":"the way we live","ko":"우리가 사는 방식","u":29,"ut":"the way","sec":"종합","lv":"basic","nw":4,"sp":null,"d":1},{"i":1340,"en":"the way it works","ko":"작동하는 방식","u":29,"ut":"the way","sec":"종합","lv":"basic","nw":4,"sp":null,"d":1},{"i":1341,"en":"the way I see the world","ko":"내가 세상을 바라보는 방식","u":29,"ut":"the way","sec":"종합","lv":"basic","nw":6,"sp":null,"d":1},{"i":1342,"en":"all the way up","ko":"위로 끝까지","u":29,"ut":"the way","sec":"종합","lv":"basic","nw":4,"sp":null,"d":1},{"i":1343,"en":"all the way back to Seoul","ko":"서울로 다시 쭉 돌아옴","u":29,"ut":"the way","sec":"종합","lv":"basic","nw":6,"sp":null,"d":1},{"i":1344,"en":"all the way over here","ko":"여기까지 쭉 옴","u":29,"ut":"the way","sec":"종합","lv":"basic","nw":5,"sp":null,"d":1},{"i":1345,"en":"the news that she got married","ko":"그녀가 결혼(식을) 했다는 소식","u":29,"ut":"the way","sec":"종합","lv":"basic","nw":6,"sp":null,"d":1},{"i":1346,"en":"the fact that he lied","ko":"그가 거짓말을 했다는 사실","u":29,"ut":"the way","sec":"종합","lv":"basic","nw":5,"sp":null,"d":1},{"i":1347,"en":"the information that he gave me","ko":"그가 나에게 준 정보","u":29,"ut":"the way","sec":"종합","lv":"basic","nw":6,"sp":null,"d":1},{"i":1348,"en":"the way that she used to laugh","ko":"과거에 그녀가 웃었던 방식","u":29,"ut":"the way","sec":"종합","lv":"basic","nw":7,"sp":null,"d":2},{"i":1349,"en":"The more you practice, the better you get.","ko":"연습을 많이 할수록, 너는 더 좋아져","u":30,"ut":"the more","sec":"기본","lv":"basic","nw":8,"sp":null,"d":2},{"i":1350,"en":"You eat more.","ko":"너는 더 많이 먹는다","u":30,"ut":"the more","sec":"문장전체","lv":"basic","nw":3,"sp":null,"d":1},{"i":1351,"en":"I’ll give you more.","ko":"나는 너에게 더 많이 줄 거다","u":30,"ut":"the more","sec":"문장전체","lv":"basic","nw":4,"sp":null,"d":1},{"i":1352,"en":"The more you eat, the more I’ll give you.","ko":"너가 더 많이 먹을수록, 내가 너에게 더 많이 줄 거다","u":30,"ut":"the more","sec":"문장전체","lv":"basic","nw":9,"sp":null,"d":2},{"i":1353,"en":"You smile more.","ko":"너는 더 많이 웃는다","u":30,"ut":"the more","sec":"문장전체","lv":"basic","nw":3,"sp":null,"d":1},{"i":1354,"en":"Your friends like you more.","ko":"너의 친구들이 너를 더 좋아한다","u":30,"ut":"the more","sec":"문장전체","lv":"basic","nw":5,"sp":null,"d":1},{"i":1355,"en":"The more you smile, the more your friends like you.","ko":"너가 더 많이 웃을수록, 너의 친구들이 너를 더 좋아한다","u":30,"ut":"the more","sec":"문장전체","lv":"basic","nw":10,"sp":null,"d":2},{"i":1356,"en":"You eat more. You feel fuller.","ko":"너는 더 많이 먹는다. 너는 더 배가 부르다고 느낀다","u":30,"ut":"the more","sec":"문장전체","lv":"basic","nw":6,"sp":null,"d":1},{"i":1357,"en":"The more you eat, the fuller you feel.","ko":"많이 먹을 수록 더 배가 부르다","u":30,"ut":"the more","sec":"문장전체","lv":"basic","nw":8,"sp":null,"d":2},{"i":1358,"en":"You smile more. You feel happier.","ko":"너는 더 많이 웃는다. 너는 더 기분이 좋아진다고 느낀다","u":30,"ut":"the more","sec":"문장전체","lv":"basic","nw":6,"sp":null,"d":1},{"i":1359,"en":"The more you smile, the happier you feel.","ko":"많이 웃을수록 기분이 더 좋아져","u":30,"ut":"the more","sec":"문장전체","lv":"basic","nw":8,"sp":null,"d":2},{"i":1360,"en":"People study more. They become smarter.","ko":"사람들이 공부를 더 많이 한다. 그들은 더 똑똑해진다","u":30,"ut":"the more","sec":"문장전체","lv":"basic","nw":6,"sp":null,"d":1},{"i":1361,"en":"The more people study, the smarter they become.","ko":"사람들이 공부를 많이 할수록 더 똑똑해져","u":30,"ut":"the more","sec":"문장전체","lv":"basic","nw":8,"sp":null,"d":2},{"i":1362,"en":"The more it rains, the colder it gets.","ko":"비가 많이 올수록 더 추워져","u":30,"ut":"the more","sec":"문장전체","lv":"basic","nw":8,"sp":null,"d":2},{"i":1363,"en":"You have more friends.","ko":"너는 더 많은 친구를 가진다","u":30,"ut":"the more","sec":"문장전체","lv":"basic","nw":4,"sp":null,"d":1},{"i":1364,"en":"The more you smile, the more friends you have.","ko":"더 많이 웃을수록 친구가 더 많아져","u":30,"ut":"the more","sec":"문장전체","lv":"basic","nw":9,"sp":null,"d":2},{"i":1365,"en":"I walk more.","ko":"나는 더 많이 걷는다","u":30,"ut":"the more","sec":"문장전체","lv":"basic","nw":3,"sp":null,"d":1},{"i":1366,"en":"I get more tired.","ko":"나는 더 피곤해진다","u":30,"ut":"the more","sec":"문장전체","lv":"basic","nw":4,"sp":null,"d":1},{"i":1367,"en":"The more I walk, the more tired I get.","ko":"나는 많이 걸을수록 더 피곤해져","u":30,"ut":"the more","sec":"문장전체","lv":"basic","nw":9,"sp":null,"d":2},{"i":1368,"en":"You have more friends. You get more support.","ko":"더 많은 친구를 가진다. 더 많은 지지를 받는다","u":30,"ut":"the more","sec":"문장전체","lv":"basic","nw":8,"sp":null,"d":2},{"i":1369,"en":"The more friends you have, the more support you get.","ko":"친구가 많을수록 더 많은 지지를 받게 돼","u":30,"ut":"the more","sec":"문장전체","lv":"basic","nw":10,"sp":null,"d":2},{"i":1370,"en":"He makes more money. You spend less time with him.","ko":"그가 더 많은 돈을 번다. 너는 더 적은 시간을 그와 함께 보낸다","u":30,"ut":"the more","sec":"문장전체","lv":"basic","nw":10,"sp":null,"d":2},{"i":1371,"en":"The more money he makes, the less time you spend with him.","ko":"그가 더 많이 벌수록 너가 그와 함께 하는 시간이 짧아져","u":30,"ut":"the more","sec":"문장전체","lv":"basic","nw":12,"sp":null,"d":2},{"i":1372,"en":"I am more tired.","ko":"나는 더 피곤하다","u":30,"ut":"the more","sec":"문장전체","lv":"basic","nw":4,"sp":null,"d":1},{"i":1373,"en":"It’s harder to focus.","ko":"집중하기가 더 어렵다","u":30,"ut":"the more","sec":"문장전체","lv":"basic","nw":4,"sp":null,"d":1},{"i":1374,"en":"The more tired I am, the harder it is to focus.","ko":"내가 더 피곤할수록 집중하기가 더 힘들어","u":30,"ut":"the more","sec":"문장전체","lv":"basic","nw":11,"sp":null,"d":2},{"i":1375,"en":"He’s more generous. You earn more money.","ko":"그는 더 너그럽다. 너는 더 많은 돈을 번다","u":30,"ut":"the more","sec":"문장전체","lv":"basic","nw":7,"sp":null,"d":2},{"i":1376,"en":"The more generous he is, the more money you earn.","ko":"그가 더 너그러울수록 너는 더 많은 돈을 벌어","u":30,"ut":"the more","sec":"문장전체","lv":"basic","nw":10,"sp":null,"d":2},{"i":1377,"en":"We talk more often. We get closer.","ko":"우리가 더 자주 대화한다. 우리가 더 가까워진다","u":30,"ut":"the more","sec":"문장전체","lv":"basic","nw":7,"sp":null,"d":2},{"i":1378,"en":"The more often we talk, the closer we get.","ko":"우리가 더 자주 대화할수록 더 가까워져","u":30,"ut":"the more","sec":"문장전체","lv":"basic","nw":9,"sp":null,"d":2},{"i":1379,"en":"You finish more quickly. You’ll have more free time.","ko":"너는 더 빨리 끝낸다. 너는 여유 시간이 더 많아 질거다","u":30,"ut":"the more","sec":"문장전체","lv":"basic","nw":9,"sp":null,"d":2},{"i":1380,"en":"The more quickly you finish, the more free time you’ll have.","ko":"빨리 끝낼수록 여유 시간이 더 많아질거야","u":30,"ut":"the more","sec":"문장전체","lv":"basic","nw":11,"sp":null,"d":2},{"i":1381,"en":"The more carefully you listen, the better you understand.","ko":"주의 깊게 들을수록 이해가 잘 돼","u":30,"ut":"the more","sec":"문장전체","lv":"basic","nw":9,"sp":null,"d":2},{"i":1382,"en":"You’re more honest.","ko":"너는 더 정직하다","u":30,"ut":"the more","sec":"문장전체","lv":"basic","nw":3,"sp":null,"d":1},{"i":1383,"en":"More people will trust you.","ko":"더 많은 사람이 너를 신뢰할 거다.","u":30,"ut":"the more","sec":"문장전체","lv":"basic","nw":5,"sp":null,"d":1},{"i":1384,"en":"The more honest you are, the more people will trust you.","ko":"정직할수록 더 많은 사람들이 너를 신뢰해","u":30,"ut":"the more","sec":"문장전체","lv":"basic","nw":11,"sp":null,"d":2},{"i":1385,"en":"You are more honest. People will trust you more.","ko":"너는 더 정직하다. 사람들이 너를 더 신뢰할 거다","u":30,"ut":"the more","sec":"문장전체","lv":"basic","nw":9,"sp":null,"d":2},{"i":1386,"en":"He speaks passionately. More people believe him.","ko":"그가 더 열정적으로 말한다. 더 많은 사람이 그를 믿는다","u":30,"ut":"the more","sec":"문장전체","lv":"basic","nw":7,"sp":null,"d":2},{"i":1387,"en":"The more passionately he speaks, the more people believe him.","ko":"그가 열정적으로 말할수록, 더 많은 사람들이 그를 믿는다","u":30,"ut":"the more","sec":"문장전체","lv":"basic","nw":10,"sp":null,"d":2},{"i":1388,"en":"Do you think the more you read, the smarter you get?","ko":"책을 더 많이 읽을수록 더 똑똑해진다고 생각해?","u":30,"ut":"the more","sec":"대화","lv":"talk","nw":11,"sp":null,"d":2},{"i":1389,"en":"Yeah, definitely. I feel like every book teaches me something new.","ko":"응 확실히 그래. 모든 책들이 나에게 뭔가 새로운 걸 가르치는 느낌이야","u":30,"ut":"the more","sec":"대화","lv":"talk","nw":11,"sp":null,"d":2},{"i":1390,"en":"Have you noticed that the more you rush, the more mistakes you make?","ko":"서두를수록 실수를 더 많이 하게 된다는 걸 느낀 적 있어?","u":30,"ut":"the more","sec":"대화","lv":"talk","nw":13,"sp":null,"d":3},{"i":1391,"en":"Totally. I always mess things up when I’m in a hurry.","ko":"완전 그래. 급할 땐 항상 실수를 하게 돼","u":30,"ut":"the more","sec":"대화","lv":"talk","nw":11,"sp":null,"d":2},{"i":1392,"en":"Do you believe the more you give, the more you receive?","ko":"더 많이 베풀수록 더 많이 받는다고 믿어?","u":30,"ut":"the more","sec":"대화","lv":"talk","nw":11,"sp":null,"d":2},{"i":1393,"en":"I want to believe that. I try to be generous anyway.","ko":"그렇게 믿고 싶어. 어쨌든 나는 너그럽게 대하려고 해","u":30,"ut":"the more","sec":"대화","lv":"talk","nw":11,"sp":null,"d":2},{"i":1394,"en":"Have you ever felt that the more confident you are, the better people treat you?","ko":"자신감이 있을수록 사람들이 더 잘 대해준다고 느낀 적 있어?","u":30,"ut":"the more","sec":"대화","lv":"talk","nw":15,"sp":null,"d":3},{"i":1395,"en":"Yes! Confidence really changes the way others see you.","ko":"응! 자신감이 있으면 사람들이 날 보는 태도가 진짜 달라지더라.","u":30,"ut":"the more","sec":"대화","lv":"talk","nw":9,"sp":null,"d":2},{"i":1396,"en":"The more I learn, the more I realize I don’t know.","ko":"배우면 배울수록, 내가 모르는 게 많다는 걸 깨달아","u":30,"ut":"the more","sec":"응용","lv":"basic","nw":11,"sp":null,"d":2},{"i":1397,"en":"The more I try to explain it, the more confused they seem to get.","ko":"내가 그것을 설명하려 하면 할수록, 그들은 더 혼란스러워지는 것 같아","u":30,"ut":"the more","sec":"응용","lv":"basic","nw":14,"sp":null,"d":3},{"i":1398,"en":"The more successful she becomes, the less time she has for herself.","ko":"그녀가 성공할수록, 자신을 위한 시간은 점점 줄어들어","u":30,"ut":"the more","sec":"응용","lv":"basic","nw":12,"sp":null,"d":2},{"i":1399,"en":"The more options I have, the harder it is to make a decision.","ko":"선택지가 많을수록, 결정을 내리는 것이 더 어려워져.","u":30,"ut":"the more","sec":"응용","lv":"basic","nw":13,"sp":null,"d":3},{"i":1400,"en":"The more you care about what others think, the harder it becomes to be yourself.","ko":"다른 사람들이 어떻게 생각할지 신경 쓸수록, 진짜 자신답게 사는 게 더 어려워져","u":30,"ut":"the more","sec":"응용","lv":"basic","nw":15,"sp":null,"d":3},{"i":1401,"en":"I’m supposed to meet him here at 5.","ko":"나 여기서 5시에 그를 만나기로 되어 있어","u":31,"ut":"supposed to","sec":"표현","lv":"basic","nw":7,"sp":null,"d":2},{"i":1402,"en":"I’m supposed to be here for the meeting.","ko":"나 회의 때문에 여기 있어야 해","u":31,"ut":"supposed to","sec":"표현","lv":"basic","nw":8,"sp":null,"d":2},{"i":1403,"en":"You have to go to the hospital.","ko":"너 병원 가야 해","u":31,"ut":"supposed to","sec":"다른 표현과 비교","lv":"mid","nw":7,"sp":null,"d":2},{"i":1404,"en":"You should go to the hospital.","ko":"너 병원에 가보는 게 좋겠어","u":31,"ut":"supposed to","sec":"다른 표현과 비교","lv":"mid","nw":6,"sp":null,"d":1},{"i":1405,"en":"You must go to the hospital.","ko":"넌 틀림없이 병원 가야 한다(책임감)","u":31,"ut":"supposed to","sec":"다른 표현과 비교","lv":"mid","nw":6,"sp":null,"d":1},{"i":1406,"en":"You’re going to go to the hospital.","ko":"너 병원 가기로 되어 있어(계획)","u":31,"ut":"supposed to","sec":"다른 표현과 비교","lv":"mid","nw":7,"sp":null,"d":2},{"i":1407,"en":"You’re supposed to go to the hospital.","ko":"(내가 알기로/듣기로는) 너 병원 가기로 되어 있어","u":31,"ut":"supposed to","sec":"다른 표현과 비교","lv":"mid","nw":7,"sp":null,"d":2},{"i":1408,"en":"You’re supposed to be in school at this time.","ko":"너 지금 학교에 있어야 하는 거 아니야?","u":31,"ut":"supposed to","sec":"다른 표현과 비교","lv":"mid","nw":9,"sp":null,"d":2},{"i":1409,"en":"He’s supposed to help me.","ko":"그가 나 도와주기로 돼 있어","u":31,"ut":"supposed to","sec":"다른 표현과 비교","lv":"mid","nw":5,"sp":null,"d":1},{"i":1410,"en":"He was supposed to help me, but he didn’t show up.","ko":"그가 나 도와주기로 돼 있었는데, 안 나타났어","u":31,"ut":"supposed to","sec":"다른 표현과 비교","lv":"mid","nw":11,"sp":null,"d":2},{"i":1411,"en":"They’re supposed to arrive at 8.","ko":"걔네들 8시에 도착하기로 돼 있어","u":31,"ut":"supposed to","sec":"다른 표현과 비교","lv":"mid","nw":5,"sp":null,"d":1},{"i":1412,"en":"They were supposed to arrive at 8, but they came at 10.","ko":"걔네들 8시에 도착하기로 돼 있었는데 10시에 왔어","u":31,"ut":"supposed to","sec":"다른 표현과 비교","lv":"mid","nw":10,"sp":null,"d":2},{"i":1413,"en":"I was supposed to meet her at 5, and I did as planned.","ko":"나 그녀를 5시 만나기로 돼 있었고, 계획대로 만났어","u":31,"ut":"supposed to","sec":"다른 표현과 비교","lv":"mid","nw":12,"sp":null,"d":2},{"i":1414,"en":"You weren’t supposed to go outside during the storm.","ko":"너는 폭풍우 중에는 밖에 나가면 안 되는 거였어","u":31,"ut":"supposed to","sec":"다른 표현과 비교","lv":"mid","nw":9,"sp":null,"d":2},{"i":1415,"en":"You’re not supposed to park here.","ko":"여기 주차하시면 안 되세요","u":31,"ut":"supposed to","sec":"다른 표현과 비교","lv":"mid","nw":6,"sp":null,"d":1},{"i":1416,"en":"He wasn’t supposed to eat too much sugary food, and his sugar level has gotten too high.","ko":"그는 설탕 들어간 음식을 많이 먹으면 안 되는 거였어. 당 수치가 너무 높아졌어","u":31,"ut":"supposed to","sec":"다른 표현과 비교","lv":"mid","nw":17,"sp":null,"d":3},{"i":1417,"en":"We’re not supposed to tell anyone about this, okay?","ko":"우리 이거 아무한테도 말하면 안 된다. 알았지?","u":31,"ut":"supposed to","sec":"다른 표현과 비교","lv":"mid","nw":9,"sp":null,"d":2},{"i":1418,"en":"You’re not supposed to take pictures here. There’s probably a copyright issue.","ko":"여기서 사진 찍으면 안 돼. 아마 저작권 문제가 있을 거야","u":31,"ut":"supposed to","sec":"다른 표현과 비교","lv":"mid","nw":12,"sp":null,"d":2},{"i":1419,"en":"Am I supposed to bring a pen and notebook to take notes at the meeting?","ko":"회의에 뭔가 적을 펜이나 노트를 가져가야 할까요?","u":31,"ut":"supposed to","sec":"다른 표현과 비교","lv":"mid","nw":15,"sp":null,"d":3},{"i":1420,"en":"No, you’re not supposed to bring anything. Just come on time.","ko":"아니요. 아무것도 안 가져와도 돼요. 시간 맞춰 오기만 하세요","u":31,"ut":"supposed to","sec":"다른 표현과 비교","lv":"mid","nw":11,"sp":null,"d":2},{"i":1421,"en":"Is he supposed to be here by now?","ko":"그가 지금쯤은 여기 와 있어야 되는 거 아니야?","u":31,"ut":"supposed to","sec":"다른 표현과 비교","lv":"mid","nw":8,"sp":null,"d":2},{"i":1422,"en":"Yeah, he’s supposed to be here at 2. Maybe he’s running late.","ko":"응, 2시에 여기 오기로 했어. 좀 늦는 것일 수도 있어","u":31,"ut":"supposed to","sec":"다른 표현과 비교","lv":"mid","nw":11,"sp":null,"d":2},{"i":1423,"en":"Why are you at home now? Are you supposed to be working today?","ko":"너 왜 지금 집에 있어? 오늘 일하고 있어야 하는 거 아니야?","u":31,"ut":"supposed to","sec":"다른 표현과 비교","lv":"mid","nw":13,"sp":null,"d":3},{"i":1424,"en":"No, I’m off today. I switched shifts.","ko":"아니야, 오늘 쉬는 날이야. 근무 바꿨어","u":31,"ut":"supposed to","sec":"다른 표현과 비교","lv":"mid","nw":7,"sp":null,"d":2},{"i":1425,"en":"Was I supposed to submit this paper yesterday?","ko":"어제 이 서류 제출했어야 했나?","u":31,"ut":"supposed to","sec":"다른 표현과 비교","lv":"mid","nw":8,"sp":null,"d":2},{"i":1426,"en":"The person in charge was waiting for it yesterday.","ko":"어제 담당자가 기다리고 있던데?","u":31,"ut":"supposed to","sec":"다른 표현과 비교","lv":"mid","nw":9,"sp":null,"d":2},{"i":1427,"en":"Weren’t you supposed to pick me up?","ko":"니가 나 데리러 오기로 했던 거 아니야?","u":31,"ut":"supposed to","sec":"다른 표현과 비교","lv":"mid","nw":7,"sp":null,"d":2},{"i":1428,"en":"Oh no! I completely forgot!","ko":"헉! 완전 까먹었어!","u":31,"ut":"supposed to","sec":"다른 표현과 비교","lv":"mid","nw":5,"sp":null,"d":1},{"i":1429,"en":"When are we supposed to leave?","ko":"우리 언제 출발해야 되는 걸로 되어 있지?","u":31,"ut":"supposed to","sec":"의문사","lv":"mid","nw":6,"sp":null,"d":1},{"i":1430,"en":"Fifteen minutes ago.. but you’re still in your pajamas.","ko":"15분 전에.. 그런데 너 아직 잠옷 입고 있잖아","u":31,"ut":"supposed to","sec":"의문사","lv":"mid","nw":9,"sp":null,"d":2},{"i":1431,"en":"What am I supposed to do with this gift you just gave me?","ko":"니가 막 나한테 준 선물로 내가 뭘 해야 하는 거지?","u":31,"ut":"supposed to","sec":"의문사","lv":"mid","nw":13,"sp":null,"d":3},{"i":1432,"en":"That’s more practical gift than you thought. You should look into how to use it.","ko":"그거 생각보다 더 실용적인 선물이야. 어떻게 쓰는 건지 잘 알아봐","u":31,"ut":"supposed to","sec":"의문사","lv":"mid","nw":15,"sp":null,"d":3},{"i":1433,"en":"Why are you supposed to do everything the boss assigned by yourself?","ko":"왜 보스가 지시한 걸 니가 혼자 다 해야 하는 거야?","u":31,"ut":"supposed to","sec":"의문사","lv":"mid","nw":12,"sp":null,"d":2},{"i":1434,"en":"Because I’m amazing... everyone thinks I’m amazing, but in reality, it’s actually a burden for me.","ko":"나 대단하다... 라고 모든 이들이 생각하니까. 사실 나도 그게 부담스러워","u":31,"ut":"supposed to","sec":"의문사","lv":"mid","nw":16,"sp":null,"d":3},{"i":1435,"en":"Where am I supposed to sit?","ko":"(니가 알기로는) 나 어디 앉아야 될까?","u":31,"ut":"supposed to","sec":"의문사","lv":"mid","nw":6,"sp":null,"d":1},{"i":1436,"en":"Anywhere you like- except the boss’s chair.","ko":"아무데나 너 좋을대로, 사장님 의자만 빼고","u":31,"ut":"supposed to","sec":"의문사","lv":"mid","nw":7,"sp":null,"d":2},{"i":1437,"en":"How am I supposed to know that? I wasn’t even there.","ko":"내가 그걸 어떻게 알아? 심지어 거기 난 없었는데","u":31,"ut":"supposed to","sec":"의문사","lv":"mid","nw":11,"sp":null,"d":2},{"i":1438,"en":"You don’t. That’s the mystery of life.","ko":"몰라. 그게 인생의 미스터리야","u":31,"ut":"supposed to","sec":"의문사","lv":"mid","nw":7,"sp":null,"d":2},{"i":1439,"en":"You didn’t even help her!","ko":"너 심지어 그녀를 돕지 않았어","u":31,"ut":"supposed to","sec":"의문사","lv":"mid","nw":5,"sp":null,"d":1},{"i":1440,"en":"What was I supposed to do? I didn’t even know she was moving out!","ko":"내가 무엇을 했어야 했는데? (내가 뭘 어쩌라는 거야). 난 그녀가 이사가고 있는지도 몰랐다고","u":31,"ut":"supposed to","sec":"의문사","lv":"mid","nw":14,"sp":null,"d":3},{"i":1441,"en":"Who am I?","ko":"나는 누구지?","u":32,"ut":"what do you think I am","sec":"기본","lv":"basic","nw":3,"sp":null,"d":1},{"i":1442,"en":"Who do you think I am?","ko":"너는 나를 누구라고 생각해?","u":32,"ut":"what do you think I am","sec":"기본","lv":"basic","nw":6,"sp":null,"d":1},{"i":1443,"en":"What should I do?","ko":"내가 뭘 해야 하지?","u":32,"ut":"what do you think I am","sec":"기본","lv":"basic","nw":4,"sp":null,"d":1},{"i":1444,"en":"What do you think I should do?","ko":"내가 뭘 해야 한다고 생각하니?","u":32,"ut":"what do y
