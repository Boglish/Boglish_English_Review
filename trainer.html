가 왜 화가 났었다고 말했었지?","u":33,"ut":"where did you say you are","sec":"표현","lv":"basic","nw":7,"sp":null,"d":2},{"i":1509,"en":"How did you get here?","ko":"여기 어떻게 왔어?","u":33,"ut":"where did you say you are","sec":"표현","lv":"basic","nw":5,"sp":null,"d":1},{"i":1510,"en":"How did you say you got here?","ko":"여기 어떻게 왔다고 했지?","u":33,"ut":"where did you say you are","sec":"표현","lv":"basic","nw":7,"sp":null,"d":2},{"i":1511,"en":"How did the guy solve the problem?","ko":"그 사람이 어떻게 그 문제를 해결했지?","u":33,"ut":"where did you say you are","sec":"표현","lv":"basic","nw":7,"sp":null,"d":2},{"i":1512,"en":"How did the guy say he solved the problem?","ko":"그 사람이 어떻게 그 문제를 해결했다고 말했어?","u":33,"ut":"where did you say you are","sec":"표현","lv":"basic","nw":9,"sp":null,"d":2},{"i":1513,"en":"Sorry, I didn’t catch that. Where did you say you live?","ko":"미안, 제대로 못 들었어. 어디 산다고 했지?","u":33,"ut":"where did you say you are","sec":"확장","lv":"mid","nw":11,"sp":null,"d":2},{"i":1514,"en":"I missed that part. What did you say he needs?","ko":"내가 이 부분을 놓쳤네. 그가 뭐가 필요하다고 너가 말했었지?","u":33,"ut":"where did you say you are","sec":"확장","lv":"mid","nw":10,"sp":null,"d":2},{"i":1515,"en":"Remind me again — when exactly did you say you’re leaving?","ko":"다시 상기시켜줄래? 정확히 언제 떠난다고 했지?","u":33,"ut":"where did you say you are","sec":"확장","lv":"mid","nw":10,"sp":null,"d":2},{"i":1516,"en":"Could you say that again? Where did you say you were going?","ko":"다시 말씀해 주실래요? 어디 가시고 있었다고 했죠?","u":33,"ut":"where did you say you are","sec":"확장","lv":"mid","nw":12,"sp":null,"d":2},{"i":1517,"en":"I forgot where you said you are.","ko":"나 너가 어디 있다고 말했는지 까먹었어","u":33,"ut":"where did you say you are","sec":"확장","lv":"mid","nw":7,"sp":null,"d":2},{"i":1518,"en":"Sorry, I don’t remember what time you said the movie starts.","ko":"미안, 니가 영화가 몇 시에 시작한다고 말했는지 기억이 안나","u":33,"ut":"where did you say you are","sec":"확장","lv":"mid","nw":11,"sp":null,"d":2},{"i":1519,"en":"I’m not sure when you said your flight is.","ko":"너의 비행기가 언제라고 말했는지 확실히는 모르겠어","u":33,"ut":"where did you say you are","sec":"확장","lv":"mid","nw":9,"sp":null,"d":2},{"i":1520,"en":"What did I hear you say?","ko":"네가 말하는 걸 내가 뭐라고 들었지? (뭐라고 했어?)","u":33,"ut":"where did you say you are","sec":"확장","lv":"mid","nw":6,"sp":null,"d":1},{"i":1521,"en":"He’s not smart.","ko":"그는 똑똑하진 않아","u":33,"ut":"where did you say you are","sec":"확장","lv":"mid","nw":3,"sp":null,"d":1},{"i":1522,"en":"He’s not as smart as you think he is.","ko":"그는 니가 생각하는 만큼 똑똑하진 않아","u":33,"ut":"where did you say you are","sec":"확장","lv":"mid","nw":9,"sp":null,"d":2},{"i":1523,"en":"How smart do you think he is?","ko":"너는 그가 얼마나 똑똑하다고 생각해?","u":33,"ut":"where did you say you are","sec":"확장","lv":"mid","nw":7,"sp":null,"d":2},{"i":1524,"en":"I hope this place is amazing.","ko":"이 장소가 어메이징하면 좋겠다","u":33,"ut":"where did you say you are","sec":"확장","lv":"mid","nw":6,"sp":null,"d":1},{"i":1525,"en":"I hope this place is as amazing as everyone says it is.","ko":"이 장소가 모든 사람들이 말하고 있는 것만큼 어메이징하면 좋겠다","u":33,"ut":"where did you say you are","sec":"확장","lv":"mid","nw":12,"sp":null,"d":2},{"i":1526,"en":"She’s exactly who I hoped she’d be.","ko":"그녀는 정확히 내가 바라던 그녀야","u":33,"ut":"where did you say you are","sec":"확장","lv":"mid","nw":7,"sp":null,"d":2},{"i":1527,"en":"Wait! Stop! What do you think you’re doing? That's the final report! Why are you trying to delete it?","ko":"잠깐! 멈춰! 너 지금 뭐 하거 있는 것 같니? 그거 최종 보고서잖아! 그걸 왜 삭제하려고 하는 거야?","u":33,"ut":"where did you say you are","sec":"확장","lv":"mid","nw":19,"sp":null,"d":3},{"i":1528,"en":"You mentioned a few places to stay. Just to be sure, where did you say you’re staying? The one near the park, right?","ko":"머물 곳 몇 군데를 언급하셨었죠. 확실히 하려고 하는데, 어디에 머문다고 했었죠? 공원 근처 맞죠?","u":33,"ut":"where did you say you are","sec":"확장","lv":"mid","nw":23,"sp":null,"d":3},{"i":1529,"en":"You mentioned she was in her late twenties? Just to be clear, how old did you say she was exactly?","ko":"그녀가 20대 후반이라고 언급했었죠? 확실히 하려고 하는데, 그녀가 정확히 몇 살이라고 했었죠?","u":33,"ut":"where did you say you are","sec":"확장","lv":"mid","nw":20,"sp":null,"d":3},{"i":1530,"en":"The meeting is supposed to start soon. When do you think they’ll get here? What's your guess?","ko":"회의가 곧 시작될 예정인데. 그들이 언제쯤 도착할 것 같아요? 당신 추측은 어때요?","u":33,"ut":"where did you say you are","sec":"확장","lv":"mid","nw":17,"sp":null,"d":3},{"i":1531,"en":"It's nice meeting you... What was it you said your name was? Sorry, I'm terrible with names.","ko":"만나서 반갑습니다... 성함이 뭐라고 하셨죠?(말씀하신 성함이 뭐 였었죠?) 죄송해요, 제가 이름을 잘 기억 못해서요","u":33,"ut":"where did you say you are","sec":"확장","lv":"mid","nw":17,"sp":null,"d":3},{"i":1532,"en":"I have a missed call. Who was it that called me earlier? I don't recognize the number.","ko":"부재중 전화가 와 있네. 조금 전에 나한테 전화한 사람이 누구였지? 모르는 번호인데","u":33,"ut":"where did you say you are","sec":"확장","lv":"mid","nw":17,"sp":null,"d":3},{"i":1533,"en":"I wasn't expecting much, but this isn’t what I thought it would be. It's actually really good!","ko":"별로 기대 안 했는데, 이건 내가 생각했던 것과 다르네. 완전 재밌어!","u":33,"ut":"where did you say you are","sec":"확장","lv":"mid","nw":17,"sp":null,"d":3},{"i":1534,"en":"She usually works out at the gym at this time. But she’s not where she said she’d be. I hope everything is okay.","ko":"그녀는 보통 이 시간에 헬스장에서 운동하는데. 자기가 있겠다고 한 곳에 없네. 별일 없어야 할 텐데.","u":33,"ut":"where did you say you are","sec":"확장","lv":"mid","nw":23,"sp":null,"d":3},{"i":1535,"en":"Don't be fooled by appearances. He’s not as rich as people think he is. He's got a lot of debt.","ko":"겉모습에 속지 마. 그는 사람들이 생각하는 것만큼 부유하지 않아. 빚이 많아","u":33,"ut":"where did you say you are","sec":"확장","lv":"mid","nw":20,"sp":null,"d":3},{"i":1536,"en":"I told you we should bring umbrellas. That’s exactly what I was afraid would happen. Now we're going to get soaked.","ko":"우산 가져왔어야 한다고 했잖아. 바로 그거야, 내가 걱정했던 일이 일어났어. 이제 우리 완전히 젖겠네.","u":33,"ut":"where did you say you are","sec":"확장","lv":"mid","nw":21,"sp":null,"d":3},{"i":1537,"en":"I’m with him.","ko":"나 그 사람 편이야 / 나는 그와 함께 있어","u":34,"ut":"with","sec":"기본","lv":"basic","nw":3,"sp":null,"d":1},{"i":1538,"en":"Are you with him?","ko":"이 분(him)이랑 같이 온 거에요?","u":34,"ut":"with","sec":"기본","lv":"basic","nw":4,"sp":null,"d":1},{"i":1539,"en":"I’m with you on this.","ko":"나 니 말에 동의해","u":34,"ut":"with","sec":"기본","lv":"basic","nw":5,"sp":null,"d":1},{"i":1540,"en":"He’s with the marketing team.","ko":"그는 마케팅 팀 소속이야","u":34,"ut":"with","sec":"기본","lv":"basic","nw":5,"sp":null,"d":1},{"i":1541,"en":"Are you with me?","ko":"나 이해하고 있어? / 잘 따라오고 있어?","u":34,"ut":"with","sec":"기본","lv":"basic","nw":4,"sp":null,"d":1},{"i":1542,"en":"I’m not with you. Can you explain it again?","ko":"이해가 잘 안 돼. 다시 설명해 줄래?","u":34,"ut":"with","sec":"기본","lv":"basic","nw":9,"sp":null,"d":2},{"i":1543,"en":"I’m here with him.","ko":"나 이 사람(him)이랑 왔어","u":34,"ut":"with","sec":"기본","lv":"basic","nw":4,"sp":null,"d":1},{"i":1544,"en":"I’m here with mixed feelings.","ko":"여기 왔는데 마음이 좀 복잡하네","u":34,"ut":"with","sec":"기본","lv":"basic","nw":5,"sp":null,"d":1},{"i":1545,"en":"I’m here with a question.","ko":"궁금한 게 있어서 왔어","u":34,"ut":"with","sec":"기본","lv":"basic","nw":5,"sp":null,"d":1},{"i":1546,"en":"I’m here with the documents you asked for.","ko":"요청하신 서류를 가지고 왔어요","u":34,"ut":"with","sec":"기본","lv":"basic","nw":8,"sp":null,"d":2},{"i":1547,"en":"I’m not here with bad intentions.","ko":"나 나쁜 의도로 온 게 아니야","u":34,"ut":"with","sec":"기본","lv":"basic","nw":6,"sp":null,"d":1},{"i":1548,"en":"I’ll go with this one.","ko":"나 이걸로 갈게요 (살게요)","u":34,"ut":"with","sec":"기본","lv":"basic","nw":5,"sp":null,"d":1},{"i":1549,"en":"I fixed the chair.","ko":"나는 의자를 고쳤어","u":34,"ut":"with","sec":"기본","lv":"basic","nw":4,"sp":null,"d":1},{"i":1550,"en":"I fixed the chair with some glue.","ko":"나는 본드로 의자를 고쳤어","u":34,"ut":"with","sec":"기본","lv":"basic","nw":7,"sp":null,"d":2},{"i":1551,"en":"What are you doing?","ko":"너 뭐하고 있는 거야?","u":34,"ut":"with","sec":"기본","lv":"basic","nw":4,"sp":null,"d":1},{"i":1552,"en":"What are you doing with that hammer?","ko":"너 그 망치로 뭐하고 있는 거야?","u":34,"ut":"with","sec":"기본","lv":"basic","nw":7,"sp":null,"d":2},{"i":1553,"en":"I can’t open this bottle.","ko":"이 병 못 열겠어","u":34,"ut":"with","sec":"기본","lv":"basic","nw":5,"sp":null,"d":1},{"i":1554,"en":"I can’t open this bottle with my hands.","ko":"이 병 손으로는 못 열겠어","u":34,"ut":"with","sec":"기본","lv":"basic","nw":8,"sp":null,"d":2},{"i":1555,"en":"Don’t speak.","ko":"말하지 마 (입열지 마)","u":34,"ut":"with","sec":"기본","lv":"basic","nw":2,"sp":null,"d":1},{"i":1556,"en":"Don’t speak with your mouth full.","ko":"입에 음식이 가득 찬 채로 말하지 마","u":34,"ut":"with","sec":"기본","lv":"basic","nw":6,"sp":null,"d":1},{"i":1557,"en":"He was walking.","ko":"그는 걷고 있었다","u":34,"ut":"with","sec":"기본","lv":"basic","nw":3,"sp":null,"d":1},{"i":1558,"en":"He was walking with his hands in his pockets.","ko":"그는 주머니에 손을 넣은 채로 걷고 있었다","u":34,"ut":"with","sec":"기본","lv":"basic","nw":9,"sp":null,"d":2},{"i":1559,"en":"Why did she leave so early?","ko":"그녀는 왜 그렇게 일찍 떠났어?","u":34,"ut":"with","sec":"기본","lv":"basic","nw":6,"sp":null,"d":1},{"i":1560,"en":"Why did she leave so early with tears in her eyes?","ko":"왜 그녀는 눈에 눈물을 머금은 채로 그렇게 일찍 떠났을까?","u":34,"ut":"with","sec":"기본","lv":"basic","nw":11,"sp":null,"d":2},{"i":1561,"en":"I came here.","ko":"나 여기 왔어","u":34,"ut":"with","sec":"기본","lv":"basic","nw":3,"sp":null,"d":1},{"i":1562,"en":"I came here with my sister.","ko":"나 여기 여동생이랑 왔어","u":34,"ut":"with","sec":"기본","lv":"basic","nw":6,"sp":null,"d":1},{"i":1563,"en":"There’s a man outside.","ko":"밖에 남자가 있어","u":34,"ut":"with","sec":"기본","lv":"basic","nw":4,"sp":null,"d":1},{"i":1564,"en":"There’s a man outside with a big dog.","ko":"밖에 큰 개를 데리고 있는 남자가 있어","u":34,"ut":"with","sec":"기본","lv":"basic","nw":8,"sp":null,"d":2},{"i":1565,"en":"I can’t go out.","ko":"나 외출 못 하겠어","u":34,"ut":"with","sec":"기본","lv":"basic","nw":4,"sp":null,"d":1},{"i":1566,"en":"I can’t go out with this headache.","ko":"나 이 두통때문에 외출 못 하겠어","u":34,"ut":"with","sec":"기본","lv":"basic","nw":7,"sp":null,"d":2},{"i":1567,"en":"If I had more time, I could finish the report.","ko":"내가 시간이 더 있다면, 리포트를 끝낼 수 있을 것 같아","u":34,"ut":"with","sec":"기본","lv":"basic","nw":10,"sp":null,"d":2},{"i":1568,"en":"This deadline is crazy! I don’t think I can finish it on time. With more time, I could finish the report.","ko":"마감시한이 이거 미친 거 아니야? 제 시간에 이거 못 끝낼 거 같아. 시간이 더 있다면 끝낼 수는 있겠지","u":34,"ut":"with","sec":"기본","lv":"basic","nw":21,"sp":null,"d":3},{"i":1569,"en":"Because he helped us, we finished early.","ko":"그가 우리를 도와줬기 때문에 일찍 끝냈어","u":34,"ut":"with","sec":"기본","lv":"basic","nw":7,"sp":null,"d":2},{"i":1570,"en":"We weren’t sure we’d make the deadline. With his help, we finished early.","ko":"우리가 마감 시간을 맞출거라고 확신하지 못했어. 그가 우리를 도와줘서 일찍 끝낸거지","u":34,"ut":"with","sec":"기본","lv":"basic","nw":13,"sp":null,"d":3},{"i":1571,"en":"Although her voice was shaking, she told the truth.","ko":"그녀의 목소리는 떨렸지만 진실을 말했다","u":34,"ut":"with","sec":"기본","lv":"basic","nw":9,"sp":null,"d":2},{"i":1572,"en":"She didn’t hesitate, even though it was hard. With her voice shaking, she told the truth.","ko":"그녀는 망설이지 않았어. 힘들 일이었겠지만 말이야. 그녀의 목소리는 떨렸지만 진실을 말했어","u":34,"ut":"with","sec":"기본","lv":"basic","nw":16,"sp":null,"d":3},{"i":1573,"en":"As the sun was setting, we headed home.","ko":"해가 지는 동안 우리는 집으로 향했다","u":34,"ut":"with","sec":"기본","lv":"basic","nw":8,"sp":null,"d":2},{"i":1574,"en":"It was getting late. With the sun setting, we headed home.","ko":"점점 늦어지고 있었어. 해가지는 가운데 우리는 집으로 향했지","u":34,"ut":"with","sec":"기본","lv":"basic","nw":11,"sp":null,"d":2},{"i":1575,"en":"Now that all that has been said, let’s move on.","ko":"이제 모든 것이 얘기되었으니, 다음으로 넘어가자","u":34,"ut":"with","sec":"기본","lv":"basic","nw":10,"sp":null,"d":2},{"i":1576,"en":"Alright, that’s all I have to say for now. With all that said, let’s move on.","ko":"좋아, 지금은 그게 내가 해야할 말 다야. 모든 게 얘기되었으니, 다음으로 넘어가자","u":34,"ut":"with","sec":"기본","lv":"basic","nw":16,"sp":null,"d":3},{"i":1577,"en":"Because she is so talented, it’s no surprise she won.","ko":"그녀가 재능이 상당히 많기 때문에 그녀가 우승하는 것이 전혀 놀랍지 않다","u":34,"ut":"with","sec":"기본","lv":"basic","nw":10,"sp":null,"d":2},{"i":1578,"en":"Everyone knew she had something special. With her being so talented, it’s no surprise she won.","ko":"모두가 그녀가 뭔가 특별한 것을 가지고 있는 걸 알고 있다. 그녀가 재능이 많기 때문에 우승하는 건 전혀 놀랍지 않다","u":34,"ut":"with","sec":"기본","lv":"basic","nw":16,"sp":null,"d":3},{"i":1579,"en":"I can’t do this without your support.","ko":"니 도움 없이는 난 이거 못해","u":34,"ut":"with","sec":"기본","lv":"basic","nw":7,"sp":null,"d":2},{"i":1580,"en":"He left without saying goodbye.","ko":"그는 작별 인사도 없이 떠났어","u":34,"ut":"with","sec":"기본","lv":"basic","nw":5,"sp":null,"d":1},{"i":1581,"en":"If we didn’t have your support, we would have failed.","ko":"우리가 너의 도움을 받지 못했다면, 우리는 실패했을지 몰라","u":34,"ut":"with","sec":"기본","lv":"basic","nw":10,"sp":null,"d":2},{"i":1582,"en":"Without your support, we would’ve failed.","ko":"너의 도움 없이는 우리는 실패했을지 몰라","u":34,"ut":"with","sec":"기본","lv":"basic","nw":6,"sp":null,"d":1},{"i":1583,"en":"She had always dreamed of starting her own bakery, and now, with the help of her friends and family, that dream was finally becoming a reality.","ko":"수년 동안 같은 회사에서 일한 끝에, 무거운 마음으로 안나는 퇴사를 결심했다.","u":34,"ut":"with","sec":"기본","lv":"basic","nw":26,"sp":null,"d":3},{"i":1584,"en":"On the opening day, she welcomed her first customers with a smile and with open arms.","ko":"그녀는 늘 자신의 빵집을 여는 꿈을 꿔왔고, 이제는 친구들과 가족의 도움으로 그 꿈이 마침내 현실이 되고 있었다.","u":34,"ut":"with","sec":"기본","lv":"basic","nw":16,"sp":null,"d":3},{"i":1585,"en":"With time, the bakery grew more popular, and Anna completed her daily tasks with speed and confidence.","ko":"개업 첫날, 그녀는 첫 손님들을 미소를 지으며 그리고 따뜻하게 맞이했다. 몇 가지 실수가 있었지만, 그녀는 그것들을 거뜬히 처리했다.","u":34,"ut":"with","sec":"기본","lv":"basic","nw":17,"sp":null,"d":3},{"i":1586,"en":"One day, a customer said, \"With all due respect, your cakes are amazing, but your coffee could use some work!\" Anna laughed and promised to improve.","ko":"때로는 자기 의심과 두려움과 싸우고 있는 것 같은 기분이 들었다. 하지만 낙심할 때마다, 그녀는 지금까지 걸어온 길을 스스로 떠올리며 마음을 다잡았다.","u":34,"ut":"with","sec":"기본","lv":"basic","nw":26,"sp":null,"d":3},{"i":1587,"en":"With that said, Anna knew this was just the beginning of her sweet journey.","ko":"연말이 되었을 때, 그녀는 모든 어려움을 훌륭히 극복해내며 마을 최고의 제빵사로 이름을 알리게 되었다.","u":34,"ut":"with","sec":"기본","lv":"basic","nw":14,"sp":null,"d":3},{"i":1588,"en":"I could’ve helped you.","ko":"널 도울 수 있었는데","u":35,"ut":"could've","sec":"기본","lv":"basic","nw":4,"sp":null,"d":1},{"i":1589,"en":"I could’ve been hurt.","ko":"나 다칠 뻔했어","u":35,"ut":"could've","sec":"기본","lv":"basic","nw":4,"sp":null,"d":1},{"i":1590,"en":"I could’ve helped you if you had asked in advance.","ko":"내가 너 도울 수 있었지, 니가 미리 말 했다면","u":35,"ut":"could've","sec":"기본","lv":"basic","nw":10,"sp":null,"d":2},{"i":1591,"en":"She could’ve joined us, but she chose not to.","ko":"그녀가 우리와 함께 할 수도 있었는데 그렇게 안 하는 걸로 선택하더라고","u":35,"ut":"could've","sec":"기본","lv":"basic","nw":9,"sp":null,"d":2},{"i":1592,"en":"I could’ve studied more.","ko":"좀 더 공부할 걸 그랬네","u":35,"ut":"could've","sec":"기본","lv":"basic","nw":4,"sp":null,"d":1},{"i":1593,"en":"We could’ve spent more time together.","ko":"우리 함께 더 오랜 시간을 보낼 수도 있었는데 (아쉽다)","u":35,"ut":"could've","sec":"기본","lv":"basic","nw":6,"sp":null,"d":1},{"i":1594,"en":"You could’ve told me the truth.","ko":"나한테 진실을 말 할 수도 있었잖아","u":35,"ut":"could've","sec":"기본","lv":"basic","nw":6,"sp":null,"d":1},{"i":1595,"en":"You could’ve been more careful.","ko":"좀 더 조심할 수도 있었잖아요","u":35,"ut":"could've","sec":"기본","lv":"basic","nw":5,"sp":null,"d":1},{"i":1596,"en":"I could’ve lost my phone.","ko":"나 핸드폰 잃어버릴 뻔했어","u":35,"ut":"could've","sec":"기본","lv":"basic","nw":5,"sp":null,"d":1},{"i":1597,"en":"She could’ve been hurt if she hadn’t worn a helmet.","ko":"그녀가 헬멧 안 썼으면 다칠 뻔했어","u":35,"ut":"could've","sec":"기본","lv":"basic","nw":10,"sp":null,"d":2},{"i":1598,"en":"We could’ve been famous by now.","ko":"우리 지금쯤은 유명해졌을 수도 있었을텐데","u":35,"ut":"could've","sec":"기본","lv":"basic","nw":6,"sp":null,"d":1},{"i":1599,"en":"He could’ve become a doctor if he had stayed in school.","ko":"그가 학교에 계속 머물렀다면(공부했다면) 의사가 될 수도 있었겠지","u":35,"ut":"could've","sec":"기본","lv":"basic","nw":11,"sp":null,"d":2},{"i":1600,"en":"You could’ve died.","ko":"너 죽을 뻔 했었어","u":35,"ut":"could've","sec":"기본","lv":"basic","nw":3,"sp":null,"d":1},{"i":1601,"en":"He had such a high fever. Without medication, he could’ve died.","ko":"그는 열이 심했었어. 약 없었으면 죽을 뻔했어","u":35,"ut":"could've","sec":"기본","lv":"basic","nw":11,"sp":null,"d":2},{"i":1602,"en":"The thief was threatening you with a knife. You could’ve been killed.","ko":"도둑이 칼로 널 위협하고 있었다고. 너 죽을 뻔했다니까","u":35,"ut":"could've","sec":"기본","lv":"basic","nw":12,"sp":null,"d":2},{"i":1603,"en":"I could’ve missed my flight.","ko":"나 비행기 놓칠 뻔했어","u":35,"ut":"could've","sec":"기본","lv":"basic","nw":5,"sp":null,"d":1},{"i":1604,"en":"I could’ve been left behind.","ko":"나 (혼자) 남겨질 뻔했어","u":35,"ut":"could've","sec":"기본","lv":"basic","nw":5,"sp":null,"d":1},{"i":1605,"en":"I almost missed my flight and could’ve been left behind. It was a close call","ko":"나 거의 비행기 놓칠 뻔하고 혼자 남겨질 뻔했어. 정말 아찔했지","u":35,"ut":"could've","sec":"기본","lv":"basic","nw":15,"sp":null,"d":3},{"i":1606,"en":"I could’ve broken the vase.","ko":"내가 꽃병을 깨뜨릴 수도 있었어","u":35,"ut":"could've","sec":"기본","lv":"basic","nw":5,"sp":null,"d":1},{"i":1607,"en":"The vase could’ve been broken.","ko":"그 꽃병이 깨질 수도 있었어","u":35,"ut":"could've","sec":"기본","lv":"basic","nw":5,"sp":null,"d":1},{"i":1608,"en":"I dropped my phone outside, but luckily it landed on the grass.","ko":"나 밖에서 핸드폰을 떨어뜨렸는데 다행히 잔디 위에 떨어졌어","u":35,"ut":"could've","sec":"기본","lv":"basic","nw":12,"sp":null,"d":2},{"i":1609,"en":"I dropped my phone outside, but luckily it landed on the grass. It could’ve been broken.","ko":"나 밖에서 핸드폰을 떨어뜨렸는데 다행히 잔디 위에 떨어졌어. 망가질 뻔했지","u":35,"ut":"could've","sec":"기본","lv":"basic","nw":16,"sp":null,"d":3},{"i":1610,"en":"I could’ve made a huge mistake.","ko":"큰 실수할 뻔했어","u":35,"ut":"could've","sec":"속도내기","lv":"basic","nw":6,"sp":null,"d":1},{"i":1611,"en":"You could’ve told me earlier","ko":"니가 좀 더 일찍 말해줄 수도 있었잖아","u":35,"ut":"could've","sec":"속도내기","lv":"basic","nw":5,"sp":null,"d":1},{"i":1612,"en":"We could’ve had so much fun.","ko":"우리 진짜 재미있었을 수도 있었는데","u":35,"ut":"could've","sec":"속도내기","lv":"basic","nw":6,"sp":null,"d":1},{"i":1613,"en":"You could’ve called me!","ko":"나한테 전화 좀 해 주지 그랬어","u":35,"ut":"could've","sec":"속도내기","lv":"basic","nw":4,"sp":null,"d":1},{"i":1614,"en":"You could’ve been more honest.","ko":"너 좀 더 솔직할 수도 있었잖아","u":35,"ut":"could've","sec":"속도내기","lv":"basic","nw":5,"sp":null,"d":1},{"i":1615,"en":"It could’ve gone better.","ko":"좀 더 잘됐을 수도 있었는데","u":35,"ut":"could've","sec":"속도내기","lv":"basic","nw":4,"sp":null,"d":1},{"i":1616,"en":"It couldn’t have been better.","ko":"더 좋을 수가 없지 (최고였어)","u":35,"ut":"could've","sec":"속도내기","lv":"basic","nw":5,"sp":null,"d":1},{"i":1617,"en":"She couldn’t have said that.","ko":"그녀가 그렇게 말했을 리 없어","u":35,"ut":"could've","sec":"속도내기","lv":"basic","nw":5,"sp":null,"d":1},{"i":1618,"en":"I couldn’t have done it without you.","ko":"너 없이는 그거 못했을 거야","u":35,"ut":"could've","sec":"속도내기","lv":"basic","nw":7,"sp":null,"d":2},{"i":1619,"en":"I know it could’ve been hard for you.","ko":"알아 너에게 많이 힘들었을 수도 있지","u":35,"ut":"could've","sec":"속도내기","lv":"basic","nw":8,"sp":null,"d":2},{"i":1620,"en":"That could’ve been really scary.","ko":"그거 진짜 무서웠겠네","u":35,"ut":"could've","sec":"속도내기","lv":"basic","nw":5,"sp":null,"d":1},{"i":1621,"en":"It could’ve been painful to hear that.","ko":"그런 말 듣기 힘들었겠다","u":35,"ut":"could've","sec":"속도내기","lv":"basic","nw":7,"sp":null,"d":2},{"i":1622,"en":"He could’ve been seriously injured.","ko":"걔 심각한 부상을 입었을 수도 있어","u":35,"ut":"could've","sec":"속도내기","lv":"basic","nw":5,"sp":null,"d":1},{"i":1623,"en":"That could’ve been avoided.","ko":"그건 피할 수도 있었잖아","u":35,"ut":"could've","sec":"속도내기","lv":"basic","nw":4,"sp":null,"d":1},{"i":1624,"en":"You could’ve been really embarrassed.","ko":"너 정말 민망했을 수도 있겠다","u":35,"ut":"could've","sec":"속도내기","lv":"basic","nw":5,"sp":null,"d":1},{"i":1625,"en":"She could’ve been disappointed.","ko":"그녀가 실망했을 수도 있었겠다","u":35,"ut":"could've","sec":"속도내기","lv":"basic","nw":4,"sp":null,"d":1},{"i":1626,"en":"Unfortunately, due to poor communication and lack of leadership, the outcome could have been avoided entirely.","ko":"돌이켜보면, 그것은 우리가 해온 프로젝트 중 가장 성공적인 것 중 하나가 될 수도 있었다.","u":35,"ut":"could've","sec":"속도내기","lv":"basic","nw":16,"sp":null,"d":3},{"i":1627,"en":"Had we taken more time to prepare, things could have turned out very differently.","ko":"불행히도, 불충분한 소통과 리더십 부족으로 인해 그 결과는 완전히 피할 수도 있는 일이었다.","u":35,"ut":"could've","sec":"속도내기","lv":"basic","nw":14,"sp":null,"d":3},{"i":1628,"en":"You should’ve told me.","ko":"나한테 말했어야지","u":36,"ut":"should've","sec":"기본","lv":"basic","nw":4,"sp":null,"d":1},{"i":1629,"en":"You should’ve been more careful.","ko":"더 조심했어야지","u":36,"ut":"should've","sec":"기본","lv":"basic","nw":5,"sp":null,"d":1},{"i":1630,"en":"I should’ve studied harder.","ko":"더 열심히 공부할 걸 그랬다","u":36,"ut":"should've","sec":"후회_ 할 걸 그랬다","lv":"basic","nw":4,"sp":null,"d":1},{"i":1631,"en":"I should’ve told you the truth.","ko":"너에게 사실대로 말할 걸 그랬다","u":36,"ut":"should've","sec":"후회_ 할 걸 그랬다","lv":"basic","nw":6,"sp":null,"d":1},{"i":1632,"en":"You should’ve told me in advance.","ko":"나한테 미리 말했어야지","u":36,"ut":"should've","sec":"충고 / 비판_ 했어야지","lv":"basic","nw":6,"sp":null,"d":1},{"i":1633,"en":"You should’ve given me a heads up.","ko":"나한테 사전에 알려줬어야지","u":36,"ut":"should've","sec":"충고 / 비판_ 했어야지","lv":"basic","nw":7,"sp":null,"d":2},{"i":1634,"en":"The package should’ve arrived by now.","ko":"택배가 지금쯤은 도착했어야 하는데","u":36,"ut":"should've","sec":"충고 / 비판_ 했어야지","lv":"basic","nw":6,"sp":null,"d":1},{"i":1635,"en":"It should’ve been finished last week.","ko":"지난 주에 끝났어야 했는데","u":36,"ut":"should've","sec":"충고 / 비판_ 했어야지","lv":"basic","nw":6,"sp":null,"d":1},{"i":1636,"en":"I should’ve been there for you.","ko":"너 옆에 있어줬어야 했는데","u":36,"ut":"should've","sec":"충고 / 비판_ 했어야지","lv":"basic","nw":6,"sp":null,"d":1},{"i":1637,"en":"You should’ve been honest with me at least.","ko":"너 최소한 나에게는 솔직했어야지","u":36,"ut":"should've","sec":"충고 / 비판_ 했어야지","lv":"basic","nw":8,"sp":null,"d":2},{"i":1638,"en":"They should’ve been prepared for this.","ko":"그들을 이걸 대비했어야 했어","u":36,"ut":"should've","sec":"충고 / 비판_ 했어야지","lv":"basic","nw":6,"sp":null,"d":1},{"i":1639,"en":"She should’ve been informed earlier about passing the exam.","ko":"그녀는 시험 합격 통보를 더 일찍 받았어야 했어","u":36,"ut":"should've","sec":"충고 / 비판_ 했어야지","lv":"basic","nw":9,"sp":null,"d":2},{"i":1640,"en":"That should’ve been done already.","ko":"그건 이미 끝났어야 했어","u":36,"ut":"should've","sec":"충고 / 비판_ 했어야지","lv":"basic","nw":5,"sp":null,"d":1},{"i":1641,"en":"I should’ve been paying more attention back then.","ko":"그때 좀 더 집중하고 있었어야 했는데","u":36,"ut":"should've","sec":"충고 / 비판_ 했어야지","lv":"basic","nw":8,"sp":null,"d":2},{"i":1642,"en":"I should’ve been talking to you instead of watching Netflix.","ko":"넷플릭스 보지 말고 너랑 얘기하고 있었어야 했는데","u":36,"ut":"should've","sec":"충고 / 비판_ 했어야지","lv":"basic","nw":10,"sp":null,"d":2},{"i":1643,"en":"You should’ve taken a break.","ko":"(잠깐) 너 좀 쉬었어야 했어","u":36,"ut":"should've","sec":"속도내기","lv":"basic","nw":5,"sp":null,"d":1},{"i":1644,"en":"They should’ve prepared better.","ko":"그들은 더 잘 준비했어야 했어","u":36,"ut":"should've","sec":"속도내기","lv":"basic","nw":4,"sp":null,"d":1},{"i":1645,"en":"You should’ve known better.","ko":"그 정도는 알았어야지","u":36,"ut":"should've","sec":"속도내기","lv":"basic","nw":4,"sp":null,"d":1},{"i":1646,"en":"We should’ve done something to help.","ko":"우리가 도움이 될 뭔가를 했었어야 했는데","u":36,"ut":"should've","sec":"속도내기","lv":"basic","nw":6,"sp":null,"d":1},{"i":1647,"en":"You should’ve seen his face.","ko":"니가 걔 얼굴을 봤어야 했는데","u":36,"ut":"should've","sec":"속도내기","lv":"basic","nw":5,"sp":null,"d":1},{"i":1648,"en":"He shouldn’t have said that.","ko":"그는 그런 말 하면 안 됐지","u":36,"ut":"should've","sec":"속도내기","lv":"basic","nw":5,"sp":null,"d":1},{"i":1649,"en":"You shouldn’t have eaten that much.","ko":"그렇게 많이 먹지 말았어야지","u":36,"ut":"should've","sec":"속도내기","lv":"basic","nw":6,"sp":null,"d":1},{"i":1650,"en":"I shouldn’t have laughed.","ko":"웃지 말았어야 했는데","u":36,"ut":"should've","sec":"속도내기","lv":"basic","nw":4,"sp":null,"d":1},{"i":1651,"en":"You shouldn’t have bought me this.","ko":"이런 거 안 사줘도 됐는데","u":36,"ut":"should've","sec":"속도내기","lv":"basic","nw":6,"sp":null,"d":1},{"i":1652,"en":"She shouldn’t have been treated like that.","ko":"그녀는 이런 대우를 받지 말았어야 했어","u":36,"ut":"should've","sec":"속도내기","lv":"basic","nw":7,"sp":null,"d":2},{"i":1653,"en":"The message shouldn’t have been deleted.","ko":"그 메시지는 삭제되지 말았어야 했어","u":36,"ut":"should've","sec":"속도내기","lv":"basic","nw":6,"sp":null,"d":1},{"i":1654,"en":"I didn’t know it was her birthday yesterday. I should’ve checked the calendar.","ko":"어제가 그녀의 생일인지 몰랐네. 달력을 확인했었어야 했는데","u":36,"ut":"should've","sec":"속도내기","lv":"basic","nw":13,"sp":null,"d":3},{"i":1655,"en":"Why didn’t you call me? I was really worried. You should’ve let me know you were running late.","ko":"왜 나한테 전화 안 했어? 정말 걱정했잖아. 나한테 너 늦고 있다고 알려줬어야지","u":36,"ut":"should've","sec":"속도내기","lv":"basic","nw":18,"sp":null,"d":3},{"i":1656,"en":"We missed the last train. We should’ve left earlier.","ko":"우리 마지막 기차를 놓쳤어. 더 일찍 나왔어야 했는데","u":36,"ut":"should've","sec":"속도내기","lv":"basic","nw":9,"sp":null,"d":2},{"i":1657,"en":"This place is so crowded. We should’ve made a reservation.","ko":"여기 너무 붐빈다. 예약했어야 했어","u":36,"ut":"should've","sec":"속도내기","lv":"basic","nw":10,"sp":null,"d":2},{"i":1658,"en":"Sometimes I wonder who I think I am, acting like everything’s always under control. I should’ve asked for help instead of pretending I was fine. My friends were there, waiting. I could’ve been with them, but I chose to stay alone. Looking back, I realize I should’ve been more honest—with them, and with myself.","ko":"이메일을 보내기 전에 다시 확인했어야 했어. 첨부파일이 잘못돼 있었고, 지금 고객이 화났어. 이렇게 서두르지 않았더라면 이 실수는 피할 수 있었을 거야. 상사는 \"도대체 무슨 생각이었어?\"라고 했고, 솔직히 나도 모르겠어. 이번 주엔 내가 집중을 덜 했던 것 같아.","u":36,"ut":"should've","sec":"대화","lv":"talk","nw":55,"sp":null,"d":3},{"i":1659,"en":"I didn’t mean to ignore your message. I just forgot. But I could’ve texted you back when I saw it again. I should’ve been more thoughtful. You said, “Where did you say you were?”—and I had no answer, because I wasn’t really anywhere. I was just avoiding the truth. And for that, I’m sorry.","ko":"가끔은 내가 뭐라도 되는 줄 아는 것처럼 행동하는 나 자신이 누군지 궁금해. 괜찮은 척할 게 아니라 도움을 청했어야 했어. 친구들이 곁에 있었는데, 난 혼자 있으려고 선택했지. 돌아보면, 친구들에게도, 나 자신에게도 더 솔직했어야 했어.","u":36,"ut":"should've","sec":"대화","lv":"talk","nw":55,"sp":null,"d":3},{"i":1660,"en":"You shouldn't have talked to her like that. I know you were upset, but that doesn't excuse what you said. She could’ve been hurt badly. You remember where you said you were going that night? She was actually there too. She heard everything. You should’ve been more careful with your words.","ko":"네 메시지를 무시하려던 건 아니었어. 그냥 잊은 거야. 하지만 다시 봤을 때 답장했어야 했어. 더 배려했어야 했는데. 네가 “어디 있다고 했지?”라고 물었을 때 난 대답할 수 없었어. 사실 어디에도 있지 않았거든. 진실을 피하고 있었어. 그 점은 미안해.","u":36,"ut":"should've","sec":"대화","lv":"talk","nw":51,"sp":null,"d":3},{"i":1661,"en":"I could’ve gone, but I was so tired.","ko":"갈 수도 있었는데, 나 너무 피곤했어","u":37,"ut":"would've","sec":"비교","lv":"mid","nw":8,"sp":null,"d":2},{"i":1662,"en":"You should’ve told me earlier.","ko":"나한테 더 일찍 말했어야지","u":37,"ut":"would've","sec":"비교","lv":"mid","nw":5,"sp":null,"d":1},{"i":1663,"en":"I would’ve helped if I had known.","ko":"내가 알았으면 도와줬겠지","u":37,"ut":"would've","sec":"비교","lv":"mid","nw":7,"sp":null,"d":2},{"i":1664,"en":"I would’ve called, but I lost my phone.","ko":"전화하려고 했는데, 전화기를 잃어버렸어","u":37,"ut":"would've","sec":"후회_ 하려고 했는데","lv":"basic","nw":8,"sp":null,"d":2},{"i":1665,"en":"I would’ve called you back sooner, but my phone was dead.","ko":"바로 너한테 다시 전화하려고 했었는데, 전화기 배터리가 다 되었었어","u":37,"ut":"would've","sec":"후회_ 하려고 했는데","lv":"basic","nw":11,"sp":null,"d":2},{"i":1666,"en":"That would’ve been a perfect day for a picnic.","ko":"그때 소풍 가기 딱 좋은 날이었겠다","u":37,"ut":"would've","sec":"후회_ 하려고 했는데","lv":"basic","nw":9,"sp":null,"d":2},{"i":1667,"en":"If I were you, I would’ve said no.","ko":"내가 너라면 ‘아니’라고 말했겠다","u":37,"ut":"would've","sec":"가정_ (나 같으면) 그렇게 할 것 같다","lv":"basic","nw":8,"sp":null,"d":2},{"i":1668,"en":"If I had known it was your birthday, I would’ve gotten you something.","ko":"니 생일인 줄 알았으면 뭐라도 챙겼을텐데","u":37,"ut":"would've","sec":"가정_ (나 같으면) 그렇게 할 것 같다","lv":"basic","nw":13,"sp":null,"d":3},{"i":1669,"en":"She would’ve loved this gift.","ko":"그녀가 이 선물 좋아했을 걸?","u":37,"ut":"would've","sec":"추측_ 그렇지 않았을까 싶어","lv":"basic","nw":5,"sp":null,"d":1},{"i":1670,"en":"If you had left five minutes earlier, you would’ve been on time.","ko":"너 5분만 일찍 나왔으면 제시간에 도착했을텐데","u":37,"ut":"would've","sec":"추측_ 그렇지 않았을까 싶어","lv":"basic","nw":12,"sp":null,"d":2},{"i":1671,"en":"He would’ve told me if something was wrong.","ko":"뭔가 문제가 있으면 그가 나한테 말했을 거야","u":37,"ut":"would've","sec":"추측_ 그렇지 않았을까 싶어","lv":"basic","nw":8,"sp":null,"d":2},{"i":1672,"en":"I would’ve appreciated a little warning.","ko":"한마디라도 해줬으면 고마웠을텐데","u":37,"ut":"would've","sec":"추측_ 그렇지 않았을까 싶어","lv":"basic","nw":6,"sp":null,"d":1},{"i":1673,"en":"It would’ve been nice if you called.","ko":"전화라도 해줬으면 좋았잖아요","u":37,"ut":"would've","sec":"추측_ 그렇지 않았을까 싶어","lv":"basic","nw":7,"sp":null,"d":2},{"i":1674,"en":"That would’ve hurt.","ko":"그거 아팠겠다","u":37,"ut":"would've","sec":"추측_ 그렇지 않았을까 싶어","lv":"basic","nw":3,"sp":null,"d":1},{"i":1675,"en":"You would’ve loved it.","ko":"너 그거 정말 좋아했을 거야","u":37,"ut":"would've","sec":"추측_ 그렇지 않았을까 싶어","lv":"basic","nw":4,"sp":null,"d":1},{"i":1676,"en":"If she had studied medicine, she would’ve been a great doctor.","ko":"그녀가 의학을 공부했더라면 훌륭한 의사가 됐을 거야","u":37,"ut":"would've","sec":"추측_ 그렇지 않았을까 싶어","lv":"basic","nw":11,"sp":null,"d":2},{"i":1677,"en":"If you had taken my advice and brought an umbrella, you wouldn't have gotten soaked.","ko":"내가 말한대로 너 우산 챙겼으면, 흠뻑 안 젖었겠지","u":37,"ut":"would've","sec":"추측_ 그렇지 않았을까 싶어","lv":"basic","nw":15,"sp":null,"d":3},{"i":1678,"en":"We would’ve caught the train if we had left earlier, as I suggested.","ko":"내가 말한대로 우리가 일찍 출발했으면 기차 탔을 거야","u":37,"ut":"would've","sec":"추측_ 그렇지 않았을까 싶어","lv":"basic","nw":13,"sp":null,"d":3},{"i":1679,"en":"If I were taller, I would’ve asked her out.","ko":"내가 키가 좀 더 크다면 그녀에게 고백했을 거야","u":37,"ut":"would've","sec":"추측_ 그렇지 않았을까 싶어","lv":"basic","nw":9,"sp":null,"d":2},{"i":1680,"en":"If he were more careful, he wouldn’t have made that mistake.","ko":"그가 좀 더 조심스러우면, 그런 실수 안 했을 거야","u":37,"ut":"would've","sec":"추측_ 그렇지 않았을까 싶어","lv":"basic","nw":11,"sp":null,"d":2},{"i":1681,"en":"If I were you, I would’ve told her the truth.","ko":"내가 너라면 난 그녀에게 진실을 말했을 거야","u":37,"ut":"would've","sec":"추측_ 그렇지 않았을까 싶어","lv":"basic","nw":10,"sp":null,"d":2},{"i":1682,"en":"She would’ve been chosen if she had applied.","ko":"그녀가 지원했더라면 뽑혔을 거야","u":37,"ut":"would've","sec":"추측_ 그렇지 않았을까 싶어","lv":"basic","nw":8,"sp":null,"d":2},{"i":1683,"en":"I would’ve been told but no one informed me.","ko":"내가 들었을 수도 있는데, 아무도 나한테 알려주지 않았어","u":37,"ut":"would've","sec":"추측_ 그렇지 않았을까 싶어","lv":"basic","nw":9,"sp":null,"d":2},{"i":1684,"en":"Would you have said yes if I had asked you out?","ko":"내가 너한테 데이트 신청했으면 ‘그래’라고 했을까?","u":37,"ut":"would've","sec":"의문문 등","lv":"basic","nw":11,"sp":null,"d":2},{"i":1685,"en":"What do you think would’ve happened if we didn’t call him.","ko":"우리가 그에게 전화를 안 했으면 어떤 일이 생겼을 거라 생각하니?","u":37,"ut":"would've","sec":"의문문 등","lv":"basic","nw":11,"sp":null,"d":2},{"i":1686,"en":"I wonder if they would’ve liked it.","ko":"걔네들이 그걸 좋아했을지 궁금하네","u":37,"ut":"would've","sec":"의문문 등","lv":"basic","nw":7,"sp":null,"d":2},{"i":1687,"en":"It took me a while to solve the issue.","ko":"내가 그 문제를 해결하는데 시간이 좀 걸렸어","u":38,"ut":"It takes me","sec":"기본 표현","lv":"basic","nw":9,"sp":null,"d":2},{"i":1688,"en":"It takes me 30 minutes to get to work.","ko":"나는 출근하는데 30분이 걸려","u":38,"ut":"It takes me","sec":"기본 표현","lv":"basic","nw":8,"sp":null,"d":2},{"i":1689,"en":"It takes me about an hour on my makeup.","ko":"내가 화장을 하는 데는 대략 한 시간쯤 걸려요","u":38,"ut":"It takes me","sec":"기본 표현","lv":"basic","nw":9,"sp":null,"d":2},{"i":1690,"en":"It takes me a while to feel comfortable with new people.","ko":"나는 낯선 사람들과 편해지려면 시간이 좀 걸려요","u":38,"ut":"It takes me","sec":"기본 표현","lv":"basic","nw":11,"sp":null,"d":2},{"i":1691,"en":"It takes me a lot of energy to work in a noisy environment all day.","ko":"하루 종일 시끄러운 환경에서 일하려면 아주 많은 에너지가 들어요","u":38,"ut":"It takes me","sec":"기본 표현","lv":"basic","nw":15,"sp":null,"d":3},{"i":1692,"en":"It took me two hours to get here.","ko":"여기 오는데 2시간이 걸렸어요","u":38,"ut":"It takes me","sec":"기본 표현","lv":"basic","nw":8,"sp":null,"d":2},{"i":1693,"en":"It took me forever to fix that bug.","ko":"그 버그를 고치는 데 정말 오래 걸렸어","u":38,"ut":"It takes me","sec":"기본 표현","lv":"basic","nw":8,"sp":null,"d":2},{"i":1694,"en":"It took me some courage to speak in front of the president.","ko":"회장님 앞에서 말하려면 용기가 좀 필요했어요","u":38,"ut":"It takes me","sec":"기본 표현","lv":"basic","nw":12,"sp":null,"d":2},{"i":1695,"en":"It takes them a few days to respond.","ko":"걔네들은 답변하는 데 며칠 걸려","u":38,"ut":"It takes me","sec":"기본 표현","lv":"basic","nw":8,"sp":null,"d":2},{"i":1696,"en":"It took her more than two hours to get ready to go out.","ko":"그녀는 외출 준비하는데 2시간 이상이 걸렸어","u":38,"ut":"It takes me","sec":"기본 표현","lv":"basic","nw":13,"sp":null,"d":3},{"i":1697,"en":"It takes over ten hours to get to Australia.","ko":"호주에 가는데 10시간 이상 걸려","u":38,"ut":"It takes me","sec":"기본 표현","lv":"basic","nw":9,"sp":null,"d":2},{"i":1698,"en":"It takes time to build a good team.","ko":"좋은 팀을 만들려면 시간이 걸린다","u":38,"ut":"It takes me","sec":"기본 표현","lv":"basic","nw":8,"sp":null,"d":2},{"i":1699,"en":"It takes practice to speak English naturally.","ko":"영어를 자연스럽게 뱉으려면 반복이 필요하다","u":38,"ut":"It takes me","sec":"기본 표현","lv":"basic","nw":7,"sp":null,"d":2},{"i":1700,"en":"It took forever to find parking.","ko":"주차할 곳 찾는 데 진짜 오래 걸렸어","u":38,"ut":"It takes me","sec":"기본 표현","lv":"basic","nw":6,"sp":null,"d":1},{"i":1701,"en":"It took just a second to convince him.","ko":"그를 설득하는데 단 1초 걸렸어","u":38,"ut":"It takes me","sec":"기본 표현","lv":"basic","nw":8,"sp":null,"d":2},{"i":1702,"en":"It took a lot of calls to clear up the issue.","ko":"이 문제를 해결하는데 수많은 통화가 필요했어","u":38,"ut":"It takes me","sec":"기본 표현","lv":"basic","nw":11,"sp":null,"d":2},{"i":1703,"en":"It took you long enough.","ko":"너 한참 걸렸네~","u":38,"ut":"It takes me","sec":"기본 표현","lv":"basic","nw":5,"sp":null,"d":1},{"i":1704,"en":"Does it take long to get there?","ko":"거기 가는데 오래 걸려요?","u":38,"ut":"It takes me","sec":"질의 응답","lv":"basic","nw":7,"sp":null,"d":2},{"i":1705,"en":"Not really. It only takes about 10 minutes if there’s no traffic.","ko":"아니 별로요. 차 안 막히면 단지 10분 정도밖에 안 걸려요","u":38,"ut":"It takes me","sec":"질의 응답","lv":"basic","nw":11,"sp":null,"d":2},{"i":1706,"en":"Did it take forever?","ko":"그게 그렇게 오래 걸렸어?","u":38,"ut":"It takes me","sec":"질의 응답","lv":"basic","nw":4,"sp":null,"d":1},{"i":1707,"en":"Kinda! I thought it would never end.","ko":"거의 그랬어! 진짜 끝이 안 날 줄 알았어","u":38,"ut":"It takes me","sec":"질의 응답","lv":"basic","nw":7,"sp":null,"d":2},{"i":1708,"en":"Did it even take courage to say no?","ko":"‘아니’라고 말하는 게 용기까지 필요했어?","u":38,"ut":"It takes me","sec":"질의 응답","lv":"basic","nw":8,"sp":null,"d":2},{"i":1709,"en":"For sure. Especially since I’m the youngest on the team.","ko":"당연하지. 특히 내가 팀의 막내라서 더 그래","u":38,"ut":"It takes me","sec":"질의 응답","lv":"basic","nw":10,"sp":null,"d":2},{"i":1710,"en":"How long does it take to get to your office?","ko":"너네 사무실까지 얼마나 걸려?","u":38,"ut":"It takes me","sec":"질의 응답","lv":"basic","nw":10,"sp":null,"d":2},{"i":1711,"en":"It takes me about 40 minutes by subway.","ko":"지하철로 40분 정도 걸려","u":38,"ut":"It takes me","sec":"질의 응답","lv":"basic","nw":7,"sp":null,"d":2},{"i":1712,"en":"How long did it take you to finish the design?","ko":"너 그 디자인 끝내는 데 얼마나 걸렸어?","u":38,"ut":"It takes me","sec":"질의 응답","lv":"basic","nw":10,"sp":null,"d":2},{"i":1713,"en":"It took me about two days because there were a lot of changes.","ko":"이틀 정도 걸렸어. 왜냐면 수정 사항이 많았거든","u":38,"ut":"It takes me","sec":"질의 응답","lv":"basic","nw":13,"sp":null,"d":3},{"i":1714,"en":"What did it take to fix the bug.","ko":"그 버그 고치는 데 뭐가 필요했어?","u":38,"ut":"It takes me","sec":"질의 응답","lv":"basic","nw":8,"sp":null,"d":2},{"i":1715,"en":"It just took long time and lots of testing.","ko":"그냥 단지 긴 시간쓰고 수많은 테스트를 했어","u":38,"ut":"It takes me","sec":"질의 응답","lv":"basic","nw":9,"sp":null,"d":2},{"i":1716,"en":"On the contrary, it takes about 250 people four to five years to make one of those movies.","ko":"잠시 픽사 영화를 제작하는데 무엇이 필요한지 생각해 볼게요: 그런 영화들을 제작하는 것은 단 한 명의 천재도 아니고, 번뜩이는 영감도 아니에요.","u":38,"ut":"It takes me","sec":"들어보기","lv":"talk","nw":17,"sp":null,"d":3},{"i":1717,"en":"Through an act of disconnection, I found connection.","ko":"반대로 그런 영화를 제작하는데 대략 250명의 사람들이 4년에서 5년이 필요해요.","u":38,"ut":"It takes me","sec":"들어보기","lv":"talk","nw":8,"sp":null,"d":2},{"i":1718,"en":"And it took me a long time to understand that what is at the heart of that contradiction is also at the heart of the contradiction as to why I can be so good at something I am so bad at.","ko":"단절의 행위를 통해서 나는 연결을 찾아냈어요.","u":38,"ut":"It takes me","sec":"들어보기","lv":"talk","nw":41,"sp":null,"d":3},{"i":1719,"en":"I’m off.","ko":"나 간다, 출발한다, 일 끝났어, 상태가 안 좋아, 그만둘래, 빠질래","u":39,"ut":"off","sec":"기본","lv":"basic","nw":2,"sp":null,"d":1},{"i":1720,"en":"I’m off to work.","ko":"나 일하러 가","u":39,"ut":"off","sec":"떠남","lv":"basic","nw":4,"sp":null,"d":1},{"i":1721,"en":"He’s off on a trip.","ko":"걔 여행 가는 중이야","u":39,"ut":"off","sec":"떠남","lv":"basic","nw":5,"sp":null,"d":1},{"i":1722,"en":"What time are you off?","ko":"너 몇 시에 퇴근해?","u":39,"ut":"off","sec":"떠남","lv":"basic","nw":5,"sp":null,"d":1},{"i":1723,"en":"Turn off the light.","ko":"불 꺼","u":39,"ut":"off","sec":"떠남","lv":"basic","nw":4,"sp":null,"d":1},{"i":1724,"en":"The deal is off.","ko":"그 계약은 없던 일이야","u":39,"ut":"off","sec":"떠남","lv":"basic","nw":4,"sp":null,"d":1},{"i":1725,"en":"I’m off the clock.","ko":"이제 근무시간 끝났어","u":39,"ut":"off","sec":"떠남","lv":"basic","nw":4,"sp":null,"d":1},{"i":1726,"en":"Take a day off.","ko":"하루 쉬어","u":39,"ut":"off","sec":"떠남","lv":"basic","nw":4,"sp":null,"d":1},{"i":1727,"en":"The button came off.","ko":"단추가 떨어졌어","u":39,"ut":"off","sec":"떠남","lv":"basic","nw":4,"sp":null,"d":1},{"i":1728,"en":"He took the lid off.","ko":"그가 뚜껑을 열었어","u":39,"ut":"off","sec":"떠남","lv":"basic","nw":5,"sp":null,"d":1},{"i":1729,"en":"Take off your shoes.","ko":"신발 벗어","u":39,"ut":"off","sec":"떠남","lv":"basic","nw":4,"sp":null,"d":1},{"i":1730,"en":"I can’t get this stain off my shirt.","ko":"난 이 셔츠에서 얼룩을 못 지우겠어","u":39,"ut":"off","sec":"떠남","lv":"basic","nw":8,"sp":null,"d":2},{"i":1731,"en":"She’s off alcohol.","ko":"그녀는 술 끊었어","u":39,"ut":"off","sec":"떠남","lv":"basic","nw":3,"sp":null,"d":1},{"i":1732,"en":"You should be off sugar.","ko":"너 설탕 안 먹는 게 좋겠어","u":39,"ut":"off","sec":"떠남","lv":"basic","nw":5,"sp":null,"d":1},{"i":1733,"en":"I think she’s a little off today.","ko":"걔 오늘 좀 이상한 거 같아(평소 같이 않아)","u":39,"ut":"off","sec":"떠남","lv":"basic","nw":7,"sp":null,"d":2},{"i":1734,"en":"You’re better off taking the subway.","ko":"너 지하철 타는 게 나을 거야","u":39,"ut":"off","sec":"떠남","lv":"basic","nw":6,"sp":null,"d":1},{"i":1735,"en":"I think I’m better off working alone.","ko":"혼자 일하는 게 나한테는 더 나은 거 같아","u":39,"ut":"off","sec":"떠남","lv":"basic","nw":7,"sp":null,"d":2},{"i":1736,"en":"We’re better off without him.","ko":"우리에게는 걔가 없는 편이 나아","u":39,"ut":"off","sec":"떠남","lv":"basic","nw":5,"sp":null,"d":1},{"i":1737,"en":"We’d better be without him.","ko":"우리에게는 걔가 없어야 해","u":39,"ut":"off","sec":"떠남","lv":"basic","nw":5,"sp":null,"d":1},{"i":1738,"en":"We’re worse off now than before.","ko":"우리 지금은 예전보다 안 좋아","u":39,"ut":"off","sec":"떠남","lv":"basic","nw":6,"sp":null,"d":1},{"i":1739,"en":"The alarm went off at 6 a.m.","ko":"알람이 6시에 울렸어","u":39,"ut":"off","sec":"떠남","lv":"basic","nw":7,"sp":null,"d":2},{"i":1740,"en":"The light suddenly went off.","ko":"불이 갑자기 꺼졌어","u":39,"ut":"off","sec":"떠남","lv":"basic","nw":5,"sp":null,"d":1},{"i":1741,"en":"He just went off on me for no reason.","ko":"걔가 갑자기 이유없이 나에게 화냈어","u":39,"ut":"off","sec":"떠남","lv":"basic","nw":9,"sp":null,"d":2},{"i":1742,"en":"The milk’s gone off.","ko":"우유가 상했어","u":39,"ut":"off","sec":"떠남","lv":"basic","nw":4,"sp":null,"d":1},{"i":1743,"en":"Please take off your shoes.","ko":"신발을 벗어주세요","u":39,"ut":"off","sec":"떠남","lv":"basic","nw":5,"sp":null,"d":1},{"i":1744,"en":"The plane took off on time.","ko":"비행기가 제시간에 이륙했어요","u":39,"ut":"off","sec":"떠남","lv":"basic","nw":6,"sp":null,"d":1},{"i":1745,"en":"Her business really took off this year.","ko":"그녀의 사업이 올해 갑자기 잘 됐어","u":39,"ut":"off","sec":"떠남","lv":"basic","nw":7,"sp":null,"d":2},{"i":1746,"en":"The power was cut off.","ko":"전기가 끊겼다","u":39,"ut":"off","sec":"떠남","lv":"basic","nw":5,"sp":null,"d":1},{"i":1747,"en":"She tried to explain, but he cut her off.","ko":"그녀가 설명하려 했지만, 그가 말을 잘랐다","u":39,"ut":"off","sec":"떠남","lv":"basic","nw":9,"sp":null,"d":2},{"i":1748,"en":"Don’t cut me off while I’m talking.","ko":"내가 말하는 중에 끼어들지 마","u":39,"ut":"off","sec":"떠남","lv":"basic","nw":7,"sp":null,"d":2},{"i":1749,"en":"After the argument, he cut me off completely.","ko":"그 논쟁 이후로 그는 나와 완전히 연락을 끊었어","u":39,"ut":"off","sec":"떠남","lv":"basic","nw":8,"sp":null,"d":2},{"i":1750,"en":"That guy just cut me off out of nowhere.","ko":"방금 어떤 차가 내 앞으로 갑자기 확 끼어들었어","u":39,"ut":"off","sec":"떠남","lv":"basic","nw":9,"sp":null,"d":2},{"i":1751,"en":"Let’s put off the meeting until next week.","ko":"회의를 다음 주로 미루자","u":39,"ut":"off","sec":"떠남","lv":"basic","nw":8,"sp":null,"d":2},{"i":1752,"en":"His attitude really put off.","ko":"그의 태도에 진짜 정이 떨어졌어","u":39,"ut":"off","sec":"떠남","lv":"basic","nw":5,"sp":null,"d":1},{"i":1753,"en":"His arrogance really turns me off.","ko":"그의 거만함은 정말 정이 뚝 떨어지게 해","u":39,"ut":"off","sec":"떠남","lv":"basic","nw":6,"sp":null,"d":1},{"i":1754,"en":"Can you turn it off?","ko":"그것 좀 꺼줄래?","u":39,"ut":"off","sec":"떠남","lv":"basic","nw":5,"sp":null,"d":1},{"i":1755,"en":"They call off the wedding.","ko":"그들은 결혼식을 취소했어","u":39,"ut":"off","sec":"떠남","lv":"basic","nw":5,"sp":null,"d":1},{"i":1756,"en":"We hit it off right away. (We click.)","ko":"우리 처음부터 잘 통했어","u":39,"ut":"off","sec":"떠남","lv":"basic","nw":8,"sp":null,"d":2},{"i":1757,"en":"Off the top of my head, I’d say about 50 people came.","ko":"대충 생각해 보면, 50명쯤 온 것 같아","u":39,"ut":"off","sec":"기타","lv":"basic","nw":11,"sp":null,"d":2},{"i":1758,"en":"It’s been raining off and on all day.","ko":"하루 종일 비가 오락가락 하고 있어","u":39,"ut":"off","sec":"기타","lv":"basic","nw":8,"sp":null,"d":2},{"i":1759,"en":"You’re off the hook now - someone else confessed.","ko":"너 이제 책임 안 져도 돼. 다른 사람이 자백했어","u":39,"ut":"off","sec":"기타","lv":"basic","nw":8,"sp":null,"d":2},{"i":1760,"en":"That area is off-limits to the public.","ko":"그 구역은 일반인 출입 금지야","u":39,"ut":"off","sec":"기타","lv":"basic","nw":7,"sp":null,"d":2},{"i":1761,"en":"Spending on our local industry to make sure we have a robust industry that can survive these kinds of things.","ko":"내가 항상 주장하고자 하는 것이 있어요. 우리가 자금을 전환하는 것이 더 좋을 것이라고, 호주가 그 큰 미국 영화들을 끌어들이기 위해 쓰는 수억 달러를 정말로 호주로 돌리는 것이.","u":39,"ut":"off","sec":"들어보기","lv":"talk","nw":20,"sp":null,"d":3},{"i":1762,"en":"What I mean is that we need more time.","ko":"내 말은 우리가 시간이 더 필요하다는 거야","u":40,"ut":"What I mean","sec":"표현","lv":"basic","nw":9,"sp":null,"d":2},{"i":1763,"en":"What I mean is that we need more time to do it right.","ko":"내 말은 우리가 제대로 하려면 시간이 더 필요하다는 거야","u":40,"ut":"What I mean","sec":"표현","lv":"basic","nw":13,"sp":null,"d":3},{"i":1764,"en":"What I’m trying to say is that","ko":"내 말은 결정하기 전에 날씨부터 확인하자는 거야.","u":40,"ut":"What I mean","sec":"해석보고 영작하기","lv":"basic","nw":7,"sp":null,"d":2},{"i":1765,"en":"What I’m trying to say is that you shouldn’t give up.","ko":"내가 말하려는 건 넌 포기하면 안 된다는 거야","u":40,"ut":"What I mean","sec":"해석보고 영작하기","lv":"basic","nw":11,"sp":null,"d":2},{"i":1766,"en":"What I like about","ko":"내가 말하려던 건, 그냥 소외된 느낌이었어, 그게 다야.","u":40,"ut":"What I mean","sec":"해석보고 영작하기","lv":"basic","nw":4,"sp":null,"d":1},{"i":1767,"en":"What I like about my job is flexibility.","ko":"내가 내 일에서 좋은 점은 유연성이야","u":40,"ut":"What I mean","sec":"해석보고 영작하기","lv":"basic","nw":8,"sp":null,"d":2},{"i":1768,"en":"What I like about you is how kind you are to others.","ko":"내가 너에 대해 좋아하는 건 뭐냐면, 너가 다른 사람들에게 얼마나 친절한지 야","u":40,"ut":"What I mean","sec":"해석보고 영작하기","lv":"basic","nw":12,"sp":null,"d":2},{"i":1769,"en":"What I want you to do is","ko":"그 영화에서 좋았던 점은 말이 많지 않아도 생각하게 만들더라고.","u":40,"ut":"What I mean","sec":"해석보고 영작하기","lv":"basic","nw":7,"sp":null,"d":2},{"i":1770,"en":"Practice your piano for at least 30 minutes today.","ko":"오늘 최소 30분동안은 피아노 연습해","u":40,"ut":"What I mean","sec":"해석보고 영작하기","lv":"basic","nw":8,"sp":null,"d":2},{"i":1771,"en":"What I want you to do is practice your piano for at least 30 minutes today.","ko":"니가 했으면 하는 오늘 최소 30분동안은 피아노 연습을 해야 한다는 거야","u":40,"ut":"What I mean","sec":"해석보고 영작하기","lv":"basic","nw":15,"sp":null,"d":3},{"i":1772,"en":"What I want you to do is sign this contract and return it to me by the end of the day.","ko":"이 계약에 사인하고 나한테 그날 마지막 전에 다시 나에게 보내는 걸 했으면 좋겠어","u":40,"ut":"What I mean","sec":"해석보고 영작하기","lv":"basic","nw":21,"sp":null,"d":3},{"i":1773,"en":"My name is 00, but you can just call me ##.","ko":"제 이름은 00이지만, 저를 그냥 ##라 불러도 돼요","u":43,"ut":"빠르게 말하기","sec":"이름 소개","lv":"basic","nw":9,"sp":null,"d":2},{"i":1774,"en":"My name is 00, but you can simply call me ##.","ko":"제 이름은 00이지만, 저를 간단히 ##라 불러도 돼요","u":43,"ut":"빠르게 말하기","sec":"이름 소개","lv":"basic","nw":9,"sp":null,"d":2},{"i":1775,"en":"My name is 00, but people call me 00 which was my nickname in high school.","ko":"제 이름은 00이지만, 사람들이 저를 고등학교 때의 별명인 ##라고 불러요","u":43,"ut":"빠르게 말하기","sec":"이름 소개","lv":"basic","nw":14,"sp":null,"d":3},{"i":1776,"en":"My name is 00, please feel free to call me ## for short.","ko":"제 이름은 00이에요. 편하게 줄여서 ##라고 불러주세요","u":43,"ut":"빠르게 말하기","sec":"이름 소개","lv":"basic","nw":11,"sp":null,"d":2},{"i":1777,"en":"My name is 00, but I go by ##.","ko":"제 이름은 00이지만, ##라는 이름으로 활동하고 있어요","u":43,"ut":"빠르게 말하기","sec":"이름 소개","lv":"basic","nw":7,"sp":null,"d":2},{"i":1778,"en":"As you might guess from my name, I’m Korean.","ko":"제 이름에서 짐작하시겠지만, 저는 한국인이에요","u":43,"ut":"빠르게 말하기","sec":"국적 소개","lv":"basic","nw":9,"sp":null,"d":2},{"i":1779,"en":"My name probably sounds Korean, and indeed, I’m from Korea.","ko":"제 이름이 아마 한국인처럼 들릴거에요. 역시나 저는 한국에서 왔죠","u":43,"ut":"빠르게 말하기","sec":"국적 소개","lv":"basic","nw":10,"sp":null,"d":2},{"i":1780,"en":"Given my name, it’s probably no surprise that I’m from Korea.","ko":"제 이름을 고려하면 제가 한국에서 왔다는 것이 놀랍지는 않을 거에요","u":43,"ut":"빠르게 말하기","sec":"국적 소개","lv":"basic","nw":11,"sp":null,"d":2},{"i":1781,"en":"If my name gives it away, yes, I’m the only Korean here.","ko":"제 이름이 (어떤 정보를) 알려준다면, 맞습니다. 전 여기서 유일한 한국인이에요","u":43,"ut":"빠르게 말하기","sec":"국적 소개","lv":"basic","nw":12,"sp":null,"d":2},{"i":1782,"en":"I’m married, and I have a family of four.","ko":"저는 결혼했고, 저희 가족은 네 명이에요","u":43,"ut":"빠르게 말하기","sec":"가족 소개","lv":"basic","nw":9,"sp":null,"d":2},{"i":1783,"en":"I’m married with a family of four: my wife, two kids, and me.","ko":"저는 네 명의 가족을 둔 유부남이에요. 아내와 2명의 아이, 그리고 저죠","u":43,"ut":"빠르게 말하기","sec":"가족 소개","lv":"basic","nw":13,"sp":null,"d":3},{"i":1784,"en":"I’m married, and I’m a proud parent of two kids. So, there are four of us in my family.","ko":"저는 결혼했고, 두 아이의 자랑스러운 부모입니다. 그래서 저희 가족은 네 명이에요","u":43,"ut":"빠르게 말하기","sec":"가족 소개","lv":"basic","nw":19,"sp":null,"d":3},{"i":1785,"en":"I’m married, and currently, I live with my family of four.","ko":"저는 결혼했고, 현재 네 명의 가족과 함께 살고 있습니다","u":43,"ut":"빠르게 말하기","sec":"가족 소개","lv":"basic","nw":11,"sp":null,"d":2},{"i":1786,"en":"I’m married, and yeah, we’re a family of four.","ko":"저 결혼했구요, 네, 저희는 네 명의 가족입니다","u":43,"ut":"빠르게 말하기","sec":"가족 소개","lv":"basic","nw":9,"sp":null,"d":2},{"i":1787,"en":"I’m the kind of person who always has five thoughts at once — which means I’m either curious or easily distracted. Hopefully the first.","ko":"나는 항상 동시에 다섯 가지 생각을 하고 있는 타입이에요, 호기심이 많다는 뜻이기도 하고, 산만하다고 볼 수 있지요. 전자이길 바라지요","u":43,"ut":"빠르게 말하기","sec":"개인 성향 소개","lv":"basic","nw":23,"sp":null,"d":3},{"i":1788,"en":"These days, I’m trying to focus more on growth than perfection — especially when it comes to learning English.","ko":"요즘 나는 완벽함보다는 성장에 집중하려고 해요. 특히 영어를 배울 때 말이지요","u":43,"ut":"빠르게 말하기","sec":"개인 성향 소개","lv":"basic","nw":18,"sp":null,"d":3},{"i":1789,"en":"I come from a background in social welfare, so I’ve always been fascinated by people — their stories, their challenges, and their dreams.","ko":"나는 사회복지를 전공해서요, 항상 사람들, 그들의 이야기, 어려움, 꿈에 관심이 많아요.","u":43,"ut":"빠르게 말하기","sec":"개인 성향 소개","lv":"basic","nw":22,"sp":null,"d":3},{"i":1790,"en":"I like to think of my life as a notebook — always half-full with ideas, questions, and unfinished doodles.","ko":"나는 내 삶을 공책 같다고 생각하고 싶어. 늘 아이디어, 질문들, 미완성된 낙서들로 반쯤 채워진 그런 노트 말이야","u":43,"ut":"빠르게 말하기","sec":"개인 성향 소개","lv":"basic","nw":18,"sp":null,"d":3},{"i":1791,"en":"Learning English has been more than just picking up a new language — it’s been a way of expanding how I think and how I see the world.","ko":"영어를 배우는 건 단순히 언어를 익히는 걸 넘어서고 있어요. 그건 내 사고방식과 세상을 보는 방식을 넓히는 일이 되고 있어요","u":43,"ut":"빠르게 말하기","sec":"영어에 대한 이야기","lv":"basic","nw":27,"sp":null,"d":3},{"i":1792,"en":"I’ve come to realize that learning a language also means learning a different way of thinking. English has helped me notice things I never paid attention to in Korean.","ko":"언어를 배운다는 건 결국 다른 방식의 사고를 배우는 거라는 걸 알게 됐어요. 영어는 내가 한국어로는 그냥 지나쳤던 것들을 새롭게 보게 해줬죠","u":43,"ut":"빠르게 말하기","sec":"영어에 대한 이야기","lv":"basic","nw":29,"sp":null,"d":3},{"i":1793,"en":"I try to train my brain to think in English instead of translating from Korean. It’s not easy, but every little success feels like a tiny victory.","ko":"한국어에서 번역하지 않고 영어로 바로 생각하려고 뇌를 훈련 중이에요. 쉽진 않지만, 작은 성공 하나하나가 작지만 확실한 승리처럼 느껴져요","u":43,"ut":"빠르게 말하기","sec":"영어에 대한 이야기","lv":"basic","nw":27,"sp":null,"d":3},{"i":1794,"en":"What matters is that you tried your best.","ko":"중요한 건 넌 최선을 다 했다는 거야","u":45,"ut":"What matters is","sec":"표현","lv":"basic","nw":8,"sp":null,"d":2},{"i":1795,"en":"What surprised me was","ko":"그러지 마 — 중요한 건 우리가 올바른 방향으로 가고 있다는 거야.","u":45,"ut":"What matters is","sec":"해석보고 영작하기","lv":"basic","nw":4,"sp":null,"d":1},{"i":1796,"en":"What surprised me was how calm she was.","ko":"나를 놀라게 한 건 그녀가 너무 침착했다는 거야","u":45,"ut":"What matters is","sec":"해석보고 영작하기","lv":"basic","nw":8,"sp":null,"d":2},{"i":1797,"en":"What you need to do is","ko":"맞아 — 놀란 건 바로 OK 하셨다는 거야.","u":45,"ut":"What matters is","sec":"해석보고 영작하기","lv":"basic","nw":6,"sp":null,"d":1},{"i":1798,"en":"What you need to do is take a break.","ko":"너한테 필요한 건 쉬는 거야","u":45,"ut":"What matters is","sec":"해석보고 영작하기","lv":"basic","nw":9,"sp":null,"d":2},{"i":1799,"en":"What I don’t get is","ko":"네가 해야 할 건, 슬퍼도 괜찮다고 스스로 허락해 주는 거야 — 그리고 시간을 가져.","u":45,"ut":"What matters is","sec":"해석보고 영작하기","lv":"basic","nw":5,"sp":null,"d":1},{"i":1800,"en":"What I don’t get is why he left without a word.","ko":"내가 이해가 안 가는 건 왜 그가 말없이 떠났냐는 거야","u":45,"ut":"What matters is","sec":"해석보고 영작하기","lv":"basic","nw":11,"sp":null,"d":2},{"i":1801,"en":"I thought I would enjoy the movies, but it was boring.","ko":"그 영화 재미있을 줄 알았는데 지루했어","u":48,"ut":"I thought I would","sec":"표현","lv":"basic","nw":11,"sp":null,"d":2},{"i":1802,"en":"I thought it would be cheaper.","ko":"더 쌀 줄 알았는데","u":48,"ut":"I thought I would","sec":"표현","lv":"basic","nw":6,"sp":null,"d":1},{"i":1803,"en":"I thought she would call me back.","ko":"그녀가 다시 전화할 줄 알았지","u":48,"ut":"I thought I would","sec":"표현","lv":"basic","nw":7,"sp":null,"d":2},{"i":1804,"en":"I thought it would take longer.","ko":"더 오래 걸릴 줄 알았어","u":48,"ut":"I thought I would","sec":"표현","lv":"basic","nw":6,"sp":null,"d":1},{"i":1805,"en":"I thought he’d be here by now.","ko":"지금쯤이면 걔 여기 와 있을 줄 알았어요","u":48,"ut":"I thought I would","sec":"표현","lv":"basic","nw":7,"sp":null,"d":2},{"i":1806,"en":"Can I please get an iced coffee?","ko":"아이스 커피 하나 주세요.","u":49,"ut":"복습1","sec":"대화 1_빈칸","lv":"talk","nw":7,"sp":"A","d":2},{"i":1807,"en":"Sure! Is this your first time here?","ko":"물론이죠. 여기 처음이세요?","u":49,"ut":"복습1","sec":"대화 1_빈칸","lv":"talk","nw":7,"sp":"B","d":2},{"i":1808,"en":"Yeah. I was wondering — what do you recommend?","ko":"네. 그런데.. 뭐 추천하시는 게 뭐 있을까요?","u":49,"ut":"복습1","sec":"대화 1_빈칸","lv":"talk","nw":8,"sp":"A","d":2},{"i":1809,"en":"Our iced vanilla latte is really popular. It’s getting more popular every summer.","ko":"저희 아이스 바닐라 라떼가 정말 인기가 많아요. 여름마다 점점 더 인기를 끌고 있어요.","u":49,"ut":"복습1","sec":"대화 1_빈칸","lv":"talk","nw":13,"sp":"B","d":3},{"i":1810,"en":"Sounds great. Let me try that.","ko":"좋네요. 그걸로 할게요.","u":49,"ut":"복습1","sec":"대화 1_빈칸","lv":"talk","nw":6,"sp":"A","d":1},{"i":1811,"en":"You got it. By the way, what do you want me to write on the cup? Your name?","ko":"알겠습니다. 그런데 컵에 뭐라고 써드릴까요? 이름이요?","u":49,"ut":"복습1","sec":"대화 1_빈칸","lv":"talk","nw":18,"sp":"B","d":3},{"i":1812,"en":"It’s Jeong-Sun","ko":"종선이요.","u":49,"ut":"복습1","sec":"대화 1_빈칸","lv":"talk","nw":2,"sp":"A","d":1},{"i":1813,"en":"Got it.… Wait, what did you say your name was again?","ko":"알겠습니다. … 잠깐만요, 이름 뭐라고 하셨죠?","u":49,"ut":"복습1","sec":"대화 1_빈칸","lv":"talk","nw":11,"sp":"B","d":2},{"i":1814,"en":"Jeong-Sun. I feel like it’s a bit hard for you to recognize Korean names the first time.","ko":"종선이요. 처음에는 한국 이름을 인식하는 게 어려울 거라 느껴요.","u":49,"ut":"복습1","sec":"대화 1_빈칸","lv":"talk","nw":17,"sp":"A","d":3},{"i":1815,"en":"Haha, I know, however, I could’ve written it down right away.","ko":"하하, 맞아요. 그래도 바로 적을 수 있었어야 했는데.","u":49,"ut":"복습1","sec":"대화 1_빈칸","lv":"talk","nw":11,"sp":"B","d":2},{"i":1816,"en":"It’s okay. No matter what, I always get called Jenny anyway. You can also call me Jenny.","ko":"괜찮아요. 어차피 항상 사람들은 저를 제니라고 부르더라고요. 제니라고 부르셔도 돼요.","u":49,"ut":"복습1","sec":"대화 1_빈칸","lv":"talk","nw":17,"sp":"A","d":3},{"i":1817,"en":"You know, the way people remember foreign names is different.","ko":"사람들이 외국 이름을 기억하는 방식은 다양하잖아요.","u":49,"ut":"복습1","sec":"대화 1_빈칸","lv":"talk","nw":10,"sp":"B","d":2},{"i":1818,"en":"Yeah, and sometimes it’s related to what they were thinking about at the moment.","ko":"맞아요. 가끔은 그 순간 무슨 생각을 하고 있었는지랑도 관련이 있죠.","u":49,"ut":"복습1","sec":"대화 1_빈칸","lv":"talk","nw":14,"sp":"A","d":3},{"i":1819,"en":"True. So, when was the last time a foreigner like me got it right on the first try?","ko":"그럼, 나 같은 외국인이 한 번에 맞게 부른 마지막 기억은 언제예요?","u":49,"ut":"복습1","sec":"대화 1_빈칸","lv":"talk","nw":18,"sp":"B","d":3},{"i":1820,"en":"Hmm… I don’t remember. I guess it would’ve been when I was still in Canada two years ago.","ko":"음… 기억이 안 나네요. 아마 2년 전 캐나다에 있을 때였을 거예요.","u":49,"ut":"복습1","sec":"대화 1_빈칸","lv":"talk","nw":18,"sp":"A","d":3},{"i":1821,"en":"Wow. That long, huh?","ko":"와, 꽤 오래됐네요?","u":49,"ut":"복습1","sec":"대화 1_빈칸","lv":"talk","nw":4,"sp":"B","d":1},{"i":1822,"en":"Yeah. It’s not a big deal though. It can be funny sometimes.","ko":"네. 그래도 큰일은 아니에요. 가끔은 웃긴 일이 되기도 하죠.","u":49,"ut":"복습1","sec":"대화 1_빈칸","lv":"talk","nw":12,"sp":"A","d":2},{"i":1823,"en":"Can I get your opinion on something?","ko":"내가 너한테 뭔가에 대해서 좀 물어봐도 될까?","u":50,"ut":"복습2","sec":"대화 2_빈 칸","lv":"talk","nw":7,"sp":"A","d":2},{"i":1824,"en":"Sure, what is it?","ko":"물론이지, 뭔데?","u":50,"ut":"복습2","sec":"대화 2_빈 칸","lv":"talk","nw":4,"sp":"B","d":1},{"i":1825,"en":"I'm planning a trip, and I was wondering — would it be crazy to go to Iceland in the winter?","ko":"여행을 계획 중인데, 내가 궁금한 건... 겨울에 아이슬란드 가는 건 너무 무모할까?","u":50,"ut":"복습2","sec":"대화 2_빈 칸","lv":"talk","nw":19,"sp":"A","d":3},{"i":1826,"en":"Hmm… It can be freezing, but it’s also beautiful. What are you gonna do there?","ko":"음… 엄청 춥긴 할 텐데, 진짜 아름답긴 해. 거기서 뭐 할 건데?","u":50,"ut":"복습2","sec":"대화 2_빈 칸","lv":"talk","nw":15,"sp":"B","d":3},{"i":1827,"en":"I want to see the Northern Lights. Even though it’s cold, it’s something I’ve always wanted to do.","ko":"오로라를 보고 싶어. 춥긴 해도 항상 해보고 싶었던 일이야.","u":50,"ut":"복습2","sec":"대화 2_빈 칸","lv":"talk","nw":18,"sp":"A","d":3},{"i":1828,"en":"That makes sense. Let me show you some photos from when I went. They’re so different compared to anything I’d seen before.","ko":"그럴 수 있지. 내가 갔을 때 찍은 사진들 보여줄게. 내가 전에 봤던 것들이랑 정말 달라.","u":50,"ut":"복습2","sec":"대화 2_빈 칸","lv":"talk","nw":22,"sp":"B","d":3},{"i":1829,"en":"Wow, that looks amazing. I should’ve gone last year, but I got too busy.","ko":"우와, 진짜 멋지다. 작년에 갔어야 했는데 너무 바빴어.","u":50,"ut":"복습2","sec":"대화 2_빈 칸","lv":"talk","nw":14,"sp":"A","d":3},{"i":1830,"en":"Yeah, I remember. You said there was a conference or something, right?","ko":"응, 기억나. 그때 뭐 컨퍼런스인가 뭐 있었잖아, 맞지?","u":50,"ut":"복습2","sec":"대화 2_빈 칸","lv":"talk","nw":12,"sp":"B","d":2},{"i":1831,"en":"Yeah. No matter what, I think I’ll go this year. The more I wait, the less likely it is to happen.","ko":"응. 어찌됐든 올해는 갈 거야. 기다리면 기다릴수록 오히려 못 갈 것 같거든.","u":50,"ut":"복습2","sec":"대화 2_빈 칸","lv":"talk","nw":21,"sp":"A","d":3},{"i":1832,"en":"You're right. Sometimes you just have to go for it.","ko":"맞아. 가끔은 그냥 질러야 돼.","u":50,"ut":"복습2","sec":"대화 2_빈 칸","lv":"talk","nw":10,"sp":"B","d":2},{"i":1833,"en":"By the way, where did you say you stayed when you went?","ko":"그런데, 너 거기 갔을 때 어디에 머물렀다고 했지?","u":50,"ut":"복습2","sec":"대화 2_빈 칸","lv":"talk","nw":12,"sp":"A","d":2},{"i":1834,"en":"It was a little cabin near Reykjavik. It’s supposed to be good for watching the aurora.","ko":"레이캬비크 근처에 있는 작은 팬션이었어. 오로라 보기 좋다고 하더라고.","u":50,"ut":"복습2","sec":"대화 2_빈 칸","lv":"talk","nw":16,"sp":"B","d":3},{"i":1835,"en":"I like the way you plan trips — simple but thoughtful.","ko":"넌 여행 계획 세우는 방식이 좋아. 간단한데 배려가 느껴져.","u":50,"ut":"복습2","sec":"대화 2_빈 칸","lv":"talk","nw":10,"sp":"A","d":2},{"i":1836,"en":"Haha, thanks! What do you want me to help with? Booking stuff?","ko":"하하, 고마워! 뭐 도와줄까? 예약 같은 거?","u":50,"ut":"복습2","sec":"대화 2_빈 칸","lv":"talk","nw":12,"sp":"B","d":2},{"i":1837,"en":"That’d be great. And… do you think I’m being too spontaneous?","ko":"그러면 진짜 좋지. 근데… 내가 너무 충동적인 거 같아?","u":50,"ut":"복습2","sec":"대화 2_빈 칸","lv":"talk","nw":11,"sp":"A","d":2},{"i":1838,"en":"What do you think I am — a planner? I say go for it!","ko":"나를 뭐라고 생각하는 거야, 계획쟁이? 그냥 가버려!","u":50,"ut":"복습2","sec":"대화 2_빈 칸","lv":"talk","nw":13,"sp":"B","d":3},{"i":1839,"en":"You’re right. It would've been a regret if I didn’t even try.","ko":"맞아. 시도도 안 했으면 평생 후회했을 거야.","u":50,"ut":"복습2","sec":"대화 2_빈 칸","lv":"talk","nw":12,"sp":"A","d":2},{"i":1840,"en":"Can I have the latest update on the client feedback from yesterday’s demo?","ko":"어제 데모에 대한 클라이언트 피드백 최신 내용 좀 받을 수 있을까요?","u":51,"ut":"복습3","sec":"대화_듣기","lv":"talk","nw":13,"sp":"A (PM)","d":3},{"i":1841,"en":"Sure. There’s been some positive feedback, especially on the new layout.","ko":"물론입니다. 긍정적인 피드백이 좀 있었어요. 특히 새 레이아웃에 대해서요.","u":51,"ut":"복습3","sec":"대화_듣기","lv":"talk","nw":11,"sp":"B (Designer)","d":2},{"i":1842,"en":"Great. Is this version final, or are we still making changes?","ko":"좋아요. 지금 버전이 최종인가요, 아니면 아직 수정 중인가요?","u":51,"ut":"복습3","sec":"대화_듣기","lv":"talk","nw":11,"sp":"A","d":2},{"i":1843,"en":"We're still iterating. Would it be okay if we delay the handoff by one more day?","ko":"아직 반복 수정 중이에요. 하루 더 연기해도 괜찮을까 해서요.","u":51,"ut":"복습3","sec":"대화_듣기","lv":"talk","nw":16,"sp":"B","d":3},{"i":1844,"en":"Let me check with the dev team, but I think it can be arranged.","ko":"개발팀에 확인해볼게요, 근데 가능할 것 같아요.","u":51,"ut":"복습3","sec":"대화_듣기","lv":"talk","nw":14,"sp":"A","d":3},{"i":1845,"en":"Sorry to jump in, but does this mean the new assets won’t be ready today?","ko":"끼어들어 미안한데, 그럼 오늘 새 에셋이 안 나온다는 뜻인가요?","u":51,"ut":"복습3","sec":"대화_듣기","lv":"talk","nw":15,"sp":"C (Developer)","d":3},{"i":1846,"en":"Yeah, it would’ve been ideal to deliver them this morning, but we caught a major UI inconsistency.","ko":"네, 오늘 오전에 전달됐으면 이상적이었겠지만, 큰 UI 불일치를 발견해서요.","u":51,"ut":"복습3","sec":"대화_듣기","lv":"talk","nw":17,"sp":"B","d":3},{"i":1847,"en":"Okay, but no matt
