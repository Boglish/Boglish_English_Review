tters is","name":"대화 듣기3","lines":[{"sp":"A","t":"Work has been so stressful lately."},{"sp":"B","t":"Are you taking any breaks during the day?"},{"sp":"A","t":"Not really. I just push through."}],"sample":"What you need to do is take at least 10 minutes to walk outside each day.","ko":["요즘 직장 스트레스가 너무 심해.","중간에 쉬는 시간은 좀 가져?","별로. 그냥 계속 버텨.","네가 해야 할 건 하루에 최소 10분이라도 밖을 걸으며 쉬는 거야."]},{"u":45,"ut":"What matters is","name":"대화 듣기4","lines":[{"sp":"A","t":"I just don’t know how to get over this breakup."},{"sp":"B","t":"I’m really sorry you’re going through this."},{"sp":"A","t":"Thanks. It just hurts so much. I can’t stop thinking of her."}],"sample":"What you need to do is give yourself permission to feel sad — and take your time.","ko":["이별을 어떻게 극복해야 할지 모르겠어.","지금 많이 힘들겠네, 안타깝다.","고마워. 진짜 너무 아파. 그녀 생각이 떠나질 않아."]},{"u":45,"ut":"What matters is","name":"대화 듣기1","lines":[{"sp":"A","t":"I skipped breakfast again today."},{"sp":"B","t":"Don’t you feel tired in the morning?"},{"sp":"A","t":"I do, but I just don’t feel like eating."}],"sample":"What I don't get is how you survive without food until lunch!","ko":["오늘 또 아침 안 먹었어.","아침에 피곤하지 않아?","피곤하긴 한데 그냥 먹기 싫어.","내가 이해 안 되는 건 점심까지 어떻게 버티냐는 거야!"]},{"u":45,"ut":"What matters is","name":"대화 듣기2","lines":[{"sp":"A","t":"Sorry I’m late again."},{"sp":"B","t":"That’s the third time this week."},{"sp":"A","t":"I know, traffic was crazy."}],"sample":"What I don't get is why you never leave earlier.","ko":["또 늦어서 미안.","이번 주만 세 번째야.","알아, 근데 차가 너무 막혔어.","내가 이해가 안 되는 건 왜 항상 일찍 안 나서냐는 거야."]},{"u":45,"ut":"What matters is","name":"대화 듣기3","lines":[{"sp":"A","t":"He just walked away without saying anything."},{"sp":"B","t":"That was really weird."},{"sp":"A","t":"I know! We were having a normal conversation."}],"sample":"What I don't get is why he acted like nothing happened.","ko":["걔가 그냥 아무 말없이 가버렸어.","진짜 이상했어.","그치? 우리 그냥 평범하게 얘기하고 있었는데.","내가 이해 안 되는 건 그가 왜 아무 일 없던 것처럼 행동했냐는 거야."]},{"u":45,"ut":"What matters is","name":"대화 듣기4","lines":[{"sp":"A","t":"Did you understand the ending of that movie?"},{"sp":"B","t":"Not really. It was kind of confusing."},{"sp":"A","t":"I kept wondering if it was real or just a dream."}],"sample":"What I don't get is why the main character smiled at the end.","ko":["그 영화 결말 이해됐어?","잘 모르겠어. 좀 헷갈렸어.","그게 진짜였는지 꿈이었는지 계속 헷갈렸어.","내가 이해가 안 되는 건 왜 주인공이 마지막에 웃었냐는 거야."]},{"u":46,"ut":"What surprised me was","name":"대화 듣기1","lines":[{"sp":"A","t":"How was your trip to Vietnam?"},{"sp":"B","t":"Amazing! The food, the people — everything."},{"sp":"A","t":"I bet the beaches were your favorite part."}],"sample":"They were nice, but what surprised me was how popular I felt there as a Korean.","ko":["베트남 여행 어땠어?","최고였어! 음식도, 사람들도 다 좋았어.","해변이 제일 좋았겠다.","해변도 좋았지만, 내가 놀란 건 거기서 내가 한국 사람으로서 인기가 많았다는 거야."]},{"u":46,"ut":"What surprised me was","name":"대화 듣기2","lines":[{"sp":"A","t":"Did you enjoy the movie?"},{"sp":"B","t":"Yeah, especially the ending."},{"sp":"A","t":"I thought it would be predictable."}],"sample":"Same here — what surprised me was the twist at the very end.","ko":["영화 재미있었어?","응, 특히 결말이 좋았어.","전개가 뻔할 줄 알았는데?","나도 그렇게 생각했어 — 놀란 건 마지막 반전이었어."]},{"u":46,"ut":"What surprised me was","name":"대화 듣기3","lines":[{"sp":"A","t":"So how did your interview go?"},{"sp":"B","t":"It was actually much more casual than I expected."},{"sp":"A","t":"Really? I thought that company was super formal."}],"sample":"Same here — what surprised me was how friendly the interviewer was.","ko":["인터뷰는 어땠어?","생각보다 훨씬 캐주얼했어.","정말? 그 회사 엄청 딱딱한 줄 알았는데.","나도 그럴 줄 알았지 — 내가 놀란 건 면접관이 정말 친절했다는 거야."]},{"u":46,"ut":"What surprised me was","name":"대화 듣기4","lines":[{"sp":"A","t":"I thought the manager would reject our idea."},{"sp":"B","t":"Me too, it seemed too bold."},{"sp":"A","t":"But he actually liked it."}],"sample":"Right — what surprised me was how quickly he said yes.","ko":["팀장님이 우리 아이디어 거절할 줄 알았어.","나도, 너무 과감하잖아.","근데 오히려 마음에 들어 하시던데.","맞아 — 놀란 건 바로 OK 하셨다는 거야."]},{"u":47,"ut":"What you need to do is","name":"대화 듣기1","lines":[{"sp":"A","t":"I can't focus on working these days."},{"sp":"B","t":"Is something distracting you?"},{"sp":"A","t":"I think it's my phone. I'm always checking it."}],"sample":"Then what you need to do is turn off your notifications for a while.","ko":["요즘 일에 집중이 안돼.","뭐가 방해하는 거야?","핸드폰 때문인 것 같아. 자꾸 확인하게 돼.","그렇다면 네가 해야 할 건 알림을 잠시 꺼두는 거야."]},{"u":47,"ut":"What you need to do is","name":"대화 듣기2","lines":[{"sp":"A","t":"I feel like I’m forgetting something for the trip."},{"sp":"B","t":"Do you have your passport and tickets?"},{"sp":"A","t":"Yes, but I still feel nervous."}],"sample":"Then what you need to do is make a checklist — it’ll help calm your nerves.","ko":["여행 준비에 뭔가 빠뜨린 것 같아.","여권이랑 티켓은 챙겼어?","응, 근데 여전히 불안해.","그럼 네가 해야 할 건 체크리스트를 만드는 거야 — 그럼 마음이 좀 놓일 거야."]},{"u":47,"ut":"What you need to do is","name":"대화 듣기3","lines":[{"sp":"A","t":"Work has been so stressful lately."},{"sp":"B","t":"Are you taking any breaks during the day?"},{"sp":"A","t":"Not really. I just push through."}],"sample":"What you need to do is take at least 10 minutes to walk outside each day.","ko":["요즘 직장 스트레스가 너무 심해.","중간에 쉬는 시간은 좀 가져?","별로. 그냥 계속 버텨.","네가 해야 할 건 하루에 최소 10분이라도 밖을 걸으며 쉬는 거야."]},{"u":47,"ut":"What you need to do is","name":"대화 듣기4","lines":[{"sp":"A","t":"I just don’t know how to get over this breakup."},{"sp":"B","t":"I’m really sorry you’re going through this."},{"sp":"A","t":"Thanks. It just hurts so much. I can’t stop thinking of her."}],"sample":"What you need to do is give yourself permission to feel sad — and take your time.","ko":["이별을 어떻게 극복해야 할지 모르겠어.","지금 많이 힘들겠네, 안타깝다.","고마워. 진짜 너무 아파. 그녀 생각이 떠나질 않아.","네가 해야 할 건, 슬퍼도 괜찮다고 스스로 허락해 주는 거야 — 그리고 시간을 가져.","그 영화 결말 이해됐어?","잘 모르겠어. 좀 헷갈렸어.","그게 진짜였는지 꿈이었는지 계속 헷갈렸어.","내가 이해가 안 되는 건 왜 주인공이 마지막에 웃었냐는 거야."]}],"dialogs":[{"u":1,"ut":"Can I get","name":"대화해보기","turns":[{"sp":"A","en":"Can I get a caramel latte, please?","ko":"카라멜 라떼 하나 주세요."},{"sp":"B","en":"Sure! Would you like it hot or iced?","ko":"네! 따뜻하게 드릴까요, 차갑게 드릴까요?"},{"sp":"A","en":"Iced, please. Oh, can I also have a cheesecake?","ko":"차갑게 주세요. 아, 치즈케이크도 하나 추가할 수 있을까요?"},{"sp":"B","en":"Of course! Anything else?","ko":"물론이죠! 더 필요한 건 없으신 가요?"},{"sp":"A","en":"No, that’s all. Can I pay by card?","ko":"아니요. 그게 다 에요. 카드로 결제해도 될까요?"},{"sp":"B","en":"Yes, you can. Tap your card right here.","ko":"네 가능합니다. 여기 카드를 터치해 주세요."}]},{"u":1,"ut":"Can I get","name":"대화해보기","turns":[{"sp":"A","en":"Can I get your thoughts on the proposal we discussed?","ko":"우리가 논의한 제안서에 대한 생각을 들어 볼 수 있을까요?"},{"sp":"B","en":"Sure! I think it’s well-organized, but can we adjust the timeline slightly?","ko":"물론이죠! 잘 정리된 것 같은데, 일정만 조금 조정할 수 있을까요?"},{"sp":"A","en":"Of course. Can I ask which part you think needs more time?","ko":"당연히 되죠. 어떤 부분에 시간이 더 필요하다고 생각하시는지 여쭤봐도 될까요?"},{"sp":"B","en":"The market research section. It’s crucial, so we shouldn’t rush it.","ko":"시장조사 부분이요. 매우 중요한 부분이에요. 그래서 서두르면 안 된다고 봐요."},{"sp":"A","en":"Got it. Can I send you a revised version by tomorrow?","ko":"잘 알겠어요. 수정된 버전을 내일까지 보내 드려도 될까요?"},{"sp":"B","en":"That would be great. Thanks!","ko":"그거 좋을 것 같네요. 감사해요"}]},{"u":2,"ut":"Is this, Does this","name":"대화해보기","turns":[{"sp":"A","en":"Is this the right way to the subway station?","ko":"이게 지하철역으로 가는 맞는 길인가요?"},{"sp":"B","en":"Yes, it is. Just go straight for two blocks.","ko":"네, 맞아요. 두 블록 직진하세요."},{"sp":"A","en":"Does this take long to walk?","ko":"걸어서 오래 걸리나요?"},{"sp":"B","en":"Not at all, about five minutes.","ko":"전혀요, 약 5분 정도요"}]},{"u":2,"ut":"Is this, Does this","name":"대화해보기","turns":[{"sp":"A","en":"Is this the presentation file you wanted?","ko":"이게 요청하신 프레젠테이션 파일인가요?"},{"sp":"B","en":"Yes, it is. Does this include the latest sales data?","ko":"네, 맞아요. 최신 판매 데이터가 포함되어 있나요?"},{"sp":"A","en":"Yes, on the last slide.","ko":"네, 마지막 슬라이드에 있습니다."},{"sp":"B","en":"Great, thank you.","ko":"좋네요, 고마워요"}]},{"u":2,"ut":"Is this, Does this","name":"대화해보기","turns":[{"sp":"A","en":"Is this the final version of the project timeline?","ko":"이게 프로젝트 일정표 최종 버전인가요?"},{"sp":"B","en":"Yes, it is. Does this include the changes from last week’s feedback?","ko":"네, 맞아요. 지난주 피드백에서 나온 변경 사항이 포함되어 있나요?"},{"sp":"A","en":"Yes, I added the revisions from both teams.","ko":"네, 두 팀에서 나온 수정 사항을 추가했어요."},{"sp":"B","en":"Great. Does this mean we’re still on track to meet the deadline?","ko":"좋아요. 그러면 여전히 마감 기한을 맞출 수 있다는 뜻인가요?"},{"sp":"A","en":"Yes, but only if we start the development phase by next Monday.","ko":"네, 하지만 개발 단계가 다음 주 월요일에 시작되어야만 가능합니다."},{"sp":"B","en":"Is this realistic, considering the pending approvals?","ko":"대기 중인 승인들을 고려했을 때 현실적인가요?"},{"sp":"A","en":"It’s tight, but if we get all approvals by Friday, it’s doable.","ko":"빠듯하긴 하지만, 금요일까지 승인이 완료되면 가능해요."},{"sp":"B","en":"Okay, let’s prioritize the approval process. Can you send out reminders to the stakeholders?","ko":"알겠어요. 승인 절차를 우선순위에 두죠. 이해관계자들에게 리마인더를 보낼 수 있나요?"},{"sp":"A","en":"Sure, I’ll handle that.","ko":"네, 제가 처리하겠습니다."}]},{"u":3,"ut":"There is","name":"대화해보기","turns":[{"sp":"A","en":"Hi! Is there a table available for two?","ko":"안녕하세요 두 명 앉을 자리 있을까요?"},{"sp":"B","en":"Let me check. Yes, there’s one by the window. Would you like to sit there?","ko":"확인해 볼게요. 네, 창가 옆에 하나 있네요. 거기 앉으실래요?"},{"sp":"A","en":"Sure, that’s perfect. By the way, is there a restroom here?","ko":"몰론이죠, 너무 좋아요. 그건 그렇고 여기 화장실도 있나요?"},{"sp":"B","en":"yes, It’s right at the back, past the counter.","ko":"네, 바로 뒤에 있어요, 카운터 지나서요."}]},{"u":3,"ut":"There is","name":"대화해보기","turns":[{"sp":"A","en":"Is there something to drink in the fridge?","ko":"냉장고에 마실 게 좀 있나?"},{"sp":"B","en":"Yeah, there’s soda and orange juice. What do you want?","ko":"어~ 탄산음료 랑 오렌지 주스 있어. 뭘 원해?"},{"sp":"A","en":"Soda would be fine. Oh, is there ice?","ko":"탄산음료가 좋을 것 같군. 얼음 있어?"},{"sp":"B","en":"Yep, it’s in the freezer.","ko":"어, 냉동실에 있어"}]},{"u":3,"ut":"There is","name":"대화해보기","turns":[{"sp":"A","en":"Is there anything fun to do in this town during the weekend?","ko":"이번 주말동안 그 도시에서 뭔가 할 재미있는 게 있을까?"},{"sp":"B","en":"There’s a farmers’ market downtown. It’s pretty popular.","ko":"시내에 농산물 시장이 있어. 거기 꽤 인기가 많아"},{"sp":"A","en":"Oh, cool. Are there good places to eat there?","ko":"거기 뭔가 먹을 수 있는 좋은 장소들이 있나?"},{"sp":"B","en":"Absolutely. There are some amazing food trucks. You’ll love it.","ko":"당연하지. 몇몇 아주 좋은 푸드 트럭들이 있어. 너도 아마 무척 좋아할거야."},{"sp":"A","en":"Great! Where are there parking spots nearby?","ko":"좋아. 근처에 주차할 장소들이 어디 있나?"},{"sp":"B","en":"There’s a parking lot two blocks away. We can park there and walk.","ko":"거기 두 블록 떨어진 곳에 주차장이 있어. 거기 차대고 걸어가면 돼."}]},{"u":3,"ut":"There is","name":"대화해보기","turns":[{"sp":"A","en":"Is there anything else we need to finalize before tomorrow’s presentation?","ko":"내일 발표 전에 마무리해야 할 다른 것들은 없나요?"},{"sp":"B","en":"Yes, there are a few points in the slides that need updating.","ko":"몇 슬라이드에 몇 가지 업데이트 해야 할 것들이 있어요."},{"sp":"A","en":"What are there in terms of data changes?","ko":"테이타 변경과 관련해서는 어떤 것들이 있을까요?"},{"sp":"B","en":"Just the sales numbers for Q3. Should I send you the updated figures?","ko":"3분기 판매 수치만요. 업데이트 된 수치를 보내드릴까요?"},{"sp":"A","en":"Yes, please. And is there anyone from the finance team available to double-check those numbers?","ko":"네, 부탁드려요. 그리고 재무팀에서 그 수치를 다시 한번 확인해 줄 수 있는 사람이 있나요?"},{"sp":"B","en":"I’ll ask Jane. She might be free later this afternoon.","ko":"제인에게 물어볼게요. 오후 늦게쯤 시간이 될 수도 있어요"}]},{"u":4,"ut":"Let me","name":"대화해보기","turns":[{"sp":"A","en":"We're running out of drinks.","ko":"음료수가 떨어져가네"},{"sp":"B","en":"Let me check the fridge.","ko":"냉장고 확인해 볼게"},{"sp":"A","en":"You don’t have to. There’s nothing left.","ko":"그럴 필요 없어. 하나도 안 남았어"},{"sp":"B","en":"Okay, I'll go buy some more.","ko":"그럼 내가 더 사올게"},{"sp":"A","en":"Let me know if you need help carrying them.","ko":"옮기는데 도움 필요하면 알려줘"},{"sp":"B","en":"I'll text you when I’m done.","ko":"끝나면 문자할게"}]},{"u":4,"ut":"Let me","name":"대화해보기","turns":[{"sp":"A","en":"Hi, can I get a cappuccino with almond milk, please?","ko":"안녕하세요, 아몬드 우유로 만든 카푸치노 하나 주세요."},{"sp":"Barista","en":"Sure! Is this for here or to go?","ko":"여기서 드시나요, 아니면 포장하시나요?"},{"sp":"A","en":"For here, thanks. Oh, let me check if my friend wants something too.","ko":"여기서요, 고마워요. 아, 제 친구도 뭔가 필요한지 확인해볼게요."},{"sp":"B","en":"Actually, can I get an iced latte? And is there any chance you have oat milk?","ko":"저는 아이스 라떼 하나 주세요. 혹시 오트 우유도 있나요?"},{"sp":"Barista","en":"Yes, we have oat milk! I'll let you add that for an extra 50 cents.","ko":"네, 오트 우유 있어요! 50센트만 더 내시면 추가하실 수 있어요."},{"sp":"A","en":"Great, we'll take both. Does this total include tax?","ko":"좋아요, 둘 다 주세요. 이 총 가격이 세금 포함인가요?"},{"sp":"Barista","en":"Yes, it does. You can pay whenever you're ready.","ko":"네, 포함된 가격입니다. 준비되시면 결제하세요."},{"sp":"B","en":"Let me pay this time!","ko":"이번엔 내가 살게"}]},{"u":5,"ut":"It's getting","name":"대화해보기","turns":[{"sp":"A","en":"Hey, should we go for a walk this afternoon?","ko":"이봐, 오후에 산책을 해야 하지 않을까?"},{"sp":"B","en":"I’d love to, but it’s getting really windy outside","ko":"나도 그렇게 하고 싶어. 그런데 밖에 바람이 진짜 심해지고 있어"},{"sp":"A","en":"Really? I thought it was sunny earlier.","ko":"정말? 아까 까지는 해 뜬 걸로 알고 있었는데"},{"sp":"B","en":"It was, but now it’s getting cloudy and cold.","ko":"그랬었지, 그런데 지금은 점점 구름 끼고 추워지고 있어"}]},{"u":5,"ut":"It's getting","name":"대화해보기","turns":[{"sp":"A","en":"What’s for dinner?","ko":"저녁 뭐야?"},{"sp":"B","en":"I’m making pasta. It’s getting ready in about 10 minutes.","ko":"파스타 만들고 있어. 대략 10분후면 준비될 거야"},{"sp":"A","en":"Perfect! Is it getting too salty?","ko":"완전 좋아. 많이 짜게 될까?"},{"sp":"B","en":"No, I tasted it. It’s getting delicious!","ko":"아니야, 내가 이미 맛봤어. 맛있게 되고 있어"}]},{"u":5,"ut":"It's getting","name":"대화해보기","turns":[{"sp":"A","en":"How’s the transition to the new office going?","ko":"새로운 사무실로 옮긴 건 어때?"},{"sp":"B","en":"It’s getting smoother day by day. The team is finally settling in.","ko":"매일매일 순조로워지고 있어. 팀이 마침내 잘 자리잡고 있지"},{"sp":"A","en":"That’s great. Do you think it’s getting more productive?","ko":"그거 좋네. 점점 생산성이 높아지고 있다고 봐?"},{"sp":"B","en":"Definitely. It’s getting easier for everyone to collaborate here.","ko":"당연하지. 모두가 협력하기가 수월해지고 있어"}]},{"u":5,"ut":"It's getting","name":"대화해보기","turns":[{"sp":"Passenger","en":"Excuse me, can I get a window seat, please?","ko":"실례합니다만, 창가 쪽 자리로 할 수 있을까요?"},{"sp":"Agent","en":"Let me check... Yes, I can assign you one.","ko":"확인해 볼게요, 예 하나 지정할 수 있네요"},{"sp":"Passenger","en":"Thanks. Is this gate the one for Flight 102?","ko":"감사합니다. 이 게이트가 102편 항공편으로 가는 게이트인가요?"},{"sp":"Agent","en":"Yes, it is. But there’s a delay. It’s getting rescheduled for 3 PM.","ko":"네 맞아요. 그런데 지연이 되었네요. 3시로 재조정되고 있어요"},{"sp":"Barista","en":"Does this mean I’m gonna miss our connection in Chicago?","ko":"그말인즉슨, 제가 시카고에서 비행기 연계를 못한다는 건가요?"},{"sp":"Agent","en":"Possibly. Let me coordinate with the airline to rebook you","ko":"아마도요. 다시 예약하도록 항공사에 조율을 해볼게요."}]},{"u":6,"ut":"Do you","name":"대화해보기","turns":[{"sp":"A","en":"Do you wanna try the new dessert here?","ko":"여기 새로운 디저트 먹어볼래?"},{"sp":"B","en":"Sure! Do you want me to order it for both of us?","ko":"좋아! 내가 우리 둘 걸 주문할까?"},{"sp":"A","en":"Yeah, that’d be great. Oh, do you mind getting an extra fork?","ko":"응, 그거 좋겠다. 아, 포크 하나 더 가져다줄래?"},{"sp":"B","en":"No problem.","ko":"문제없지"}]},{"u":6,"ut":"Do you","name":"대화해보기","turns":[{"sp":"A","en":"Do you think we can finish the report by tomorrow?","ko":"우리가 내일까지 보고서를 끝낼 수 있을 것 같아요?"},{"sp":"B","en":"I think so. Do you want me to review the draft tonight?","ko":"그럴 것 같아요. 초안을 오늘 밤에 검토할까요?"},{"sp":"A","en":"Yes, please. Also, do you mind checking the budget section?","ko":"네, 부탁드려요. 그리고 예산 부분도 확인하는 거 괜찮을까요?"},{"sp":"B","en":"Not at all.","ko":"전혀 문제없죠."}]},{"u":6,"ut":"Do you","name":"대화해보기","turns":[{"sp":"A","en":"Can I get your help with these boxes?","ko":"이 상자들 좀! 도와줄래?"},{"sp":"B","en":"Of course. Is this one going to the bedroom?","ko":"물론이지, 이건 침실로 가는 거야?"},{"sp":"A","en":"Yes. There are a few more for the kitchen, too.","ko":"어, 그리고 부엌으로 갈 것도 몇 개 있어."},{"sp":"B","en":"Got it. Does this shelf go in the living room?","ko":"내가 할게. 이 선반은 거실로 가는 거야?"},{"sp":"A","en":"No, let me check the label. Oh, it’s getting heavy. Can you carry it?","ko":"아니야, 내가 라벨 확인할게. 아, 이거 너무 무거워진다. 네가 들어줄 수 있어?"},{"sp":"B","en":"No problem. Do you want me to assemble it later?","ko":"문제없지. 이건 내가 나중에 조립해줄까?"},{"sp":"A","en":"That’d be great. Thanks for helping out!","ko":"그러면 좋지. 도와줘서 고마워"}]},{"u":7,"ut":"Are you","name":"대화해보기","turns":[{"sp":"A","en":"Do you wanna go hiking this Saturday?","ko":"이번 토요일에 등산 갈래?"},{"sp":"B","en":"Sure, but do you want me to bring some snacks for everyone?","ko":"좋아! 근데 내가 다른 사람들 간식까지 챙겨올까?"},{"sp":"A","en":"That’d be great. Oh, do you mind meeting at the park entrance at 9 a.m.?","ko":"그거 좋지. 아침 9시 공원 입구에서 만나도 괜찮을까?"},{"sp":"B","en":"Not at all. Are you gonna bring water bottles as usual?","ko":"난 무조건 괜찮지. 항상 그랬듯이 너가 물병 챙겨올 거야?"},{"sp":"A","en":"Yeah, I’ve got plenty. By the way, are you going to invite Sarah too?","ko":"응, 나 진짜 많아. 그건 그렇고, 사라도 초대할 예정이야?"},{"sp":"B","en":"I wasn’t sure. Is it okay if I text her even now to join us?","ko":"생각을 못 했었네(확실하지 않았어). 내가 지금 함께 할 수 있냐고 문자하는 거 괜찮지?"},{"sp":"A","en":"Of course! The more, the merrier","ko":"물론이지! 많으면 많을수록 즐겁지."}]},{"u":7,"ut":"Are you","name":"대화해보기","turns":[{"sp":"A","en":"Are you happy with staying in Korea so far?","ko":"지금까지는 한국에서 지내는 거 좋아?"},{"sp":"B","en":"Yes. It’s getting more exciting as I explore more places.","ko":"어. 여기 저기 가보면서 더 재미있어지고 있어"},{"sp":"A","en":"Sounds great! Is there anything you find different from your country?","ko":"그거 좋은 얘기네! 너네 나라와 다른 점이 있다고 느낀 게 있어?"},{"sp":"B","en":"Hmm.. Do you guys always eat together in groups at restaurants?","ko":"음.. 너희는 항상 식당에서 같이 모여서 먹어?"},{"sp":"A","en":"Most of time, yes. Eating together is important here.","ko":"대부분은 그래. 같이 먹는 게 여기서는 중요하지."},{"sp":"B","en":"I noticed that. Does this mean it’s rude to eat alone or before others?","ko":"나도 그렇게 느꼈어. 혼자 혹은 먼저 먹는 게 실례라는 의미인가?"},{"sp":"A","en":"Not really. You can eat alone, but people around you might be curious about it.","ko":"꼭 그런 건 아니야. 혼자 먹어도 돼, 하지만 주변 사람들이 궁금해할 수도 있어."},{"sp":"B","en":"Oh, I see. By the way, can I get some tips on using public transportation here?","ko":"아 알겠어. 그건 그렇고 대중교통 이용하는데 팀 좀 얻을 수 있을까?"},{"sp":"A","en":"Sure! The subway is very convenient. There are signs in English everywhere. You don’t have to worry.","ko":"물론이지. 여긴 지하철이 아주 편리해. 어디나 영어로 된 표지판이 있어. 걱정할 필요 없어."},{"sp":"B","en":"That’s good to know. And is this why people prefer to use the subway instead of driving?","ko":"알아서 다행이다. 그래서 사람들이 운전보다는 항상 지하철을 이용하는 걸 좋아하는 거야?"},{"sp":"A","en":"Exactly. Traffic can be bad, so it’s faster and cheaper.","ko":"정확해. 교통체증이 심할 수 있어서, 그게 더 빠르거든 그리고 싸고."},{"sp":"B","en":"Make sense. Oh let me ask one more. How do people usually greet each other here?","ko":"그렇구나. 아, 하나만 더 물어볼게. 여기 사람들은 보통 인사를 어떻게 해?"},{"sp":"A","en":"A small bow is common. And if it’s a friend, just a wave is fine.","ko":"가벼운 목례가 일반적이지. 친구라면 그냥 손만 흔드는 것도 괜찮아."},{"sp":"B","en":"Got it! Thanks for explaining. It’s getting easier to adjust to life here.","ko":"알겠어! 설명해줘서 고마워. 여기 생활에 적응하는 게 점점 쉬워지고 있어."},{"sp":"A","en":"You’re welcome! Let me know if you have more questions.","ko":"뭘~ 질문 더 있으면 (언제든) 알려줘."}]},{"u":8,"ut":"What do you What are you","name":"대화해보기","turns":[{"sp":"Emma","en":"Hey, Hana! Long time no see. How are you?","ko":"하나야! 오랜만이야. 잘 지내?"},{"sp":"Hana","en":"Hi, Emma! I’m good, thanks. How about you?","ko":"안녕 에마! 나 좋아. 고마워 너는 어때?"},{"sp":"Emma","en":"I’m doing great. What are you up to these days?","ko":"(요즘) 잘 지내고 있어. 요즘 뭐하고 지내?"},{"sp":"Hana","en":"I’ve been busy with work. What about you?","ko":"일 때문에 바빴어. 너는?"},{"sp":"Emma","en":"I’ve been traveling a lot. Do you like traveling?","ko":"난 여행을 쭉 많이 다녔어. 여행하는 거 좋아해?"},{"sp":"Hana","en":"Yes, I love it! Where did you go?","ko":"응, 엄청 좋아하지. 어디 다녀왔어?"},{"sp":"Emma","en":"I went to Japan and Thailand. Is there anywhere you want to visit?","ko":"일본이랑 태국에 갔다 왔어. 넌 어디든 가고 싶은 곳이 있어?"},{"sp":"Hana","en":"I’d love to visit Europe someday. Do you have any tips for traveling?","ko":"언젠가는 유럽에 가보고 싶어. 여행을 위한 팁이 있니?"},{"sp":"Emma","en":"Sure! Let me share some ideas. Always check the weather and pack light.","ko":"물론! 몇 가지 아이디어를 줄까? 항상 날씨를 체크하고 짐을 가볍게 싸."},{"sp":"Hana","en":"That sounds like good advice. Is this your first time visiting Thailand?","ko":"그거 좋은 아이디어로 들리네 이번이 태국은 처음 방문인 거야?"},{"sp":"Emma","en":"No, I’ve been there before. Does this sound strange—I liked the street food more than the restaurants!","ko":"아니 전에도 가봤어. 이상하게 들리려나? 난 레스토랑보다 길거리 음식이 더 좋더라고."},{"sp":"Hana","en":"Not strange at all. Thai street food is famous! Can I get some tips for food to try?","ko":"전혀 이상하지 않아. 태국 길거리 음식은 유명하잖아. 내가 시도해 볼 음식에 대해 팁 좀 줄래?"},{"sp":"Emma","en":"Definitely. Try Pad Thai and mango sticky rice. There’s also a great pizza franchise named “Pizza Factory” there.","ko":"물론이지. 팟타이랑 망고 스티끼라이스를 먹어봐. 거기 또한 ‘피자 팩토리’라는 이름의 좋은 피자 체인점도 있어"},{"sp":"Hana","en":"Yum! Are you planning your next trip yet?","ko":"맛있겠다! 다음 여행 계획은 아직 안 세웠지?"},{"sp":"Emma","en":"Not yet. What do you think—should I visit Korea again?","ko":"아직은. 어떻게 생각해? 나 한국에 다시 갈까?"},{"sp":"Hana","en":"Yes, you should! Let me know when you are coming. I’ll show you around.","ko":"응. 그래야지. 여기 올 때 꼭 알려줘. 내가 여기저기 구경시켜줄게."}]},{"u":8,"ut":"What do you What are you","name":"대화해보기","turns":[{"sp":"Ashley","en":"Hey, Minji, what do you usually eat for breakfast in Korea?","ko":"민지야, 한국에서는 보통 아침에 뭘 먹어?"},{"sp":"Minji","en":"We usually eat rice, soup, and some side dishes. What about you?","ko":"우린 보통 밥, 국, 반찬을 먹어. 너는?"},{"sp":"Ashley","en":"I usually just grab some toast or cereal. Is it common to have soup in the morning?","ko":"나는 보통 토스트나 시리얼을 먹어. 아침에 국 먹는 게 흔해?"},{"sp":"Minji","en":"Yes, it’s very common here. Does this sound strange to you?","ko":"응, 여기선 아주 흔해. 너에게는 좀 이상하게 들려?"},{"sp":"Ashley","en":"A little, but I’d love to try it. Can I get a recommendation for a good place to try a Korean breakfast?","ko":"조금? 하지만 먹어보고 싶어. 한국식 아침을 먹을 만한 좋은 곳 추천해 줄 수 있어?"},{"sp":"Minji","en":"Sure! There’s a small restaurant near my place. It’s getting pretty popular these days because of its traditional vibe.","ko":"그럼! 우리 집 근처에 작은 식당이 있어. 요즘 전통적인 분위기 덕분에 꽤 인기 있어지고 있어."},{"sp":"Ashley","en":"That sounds great. What are you planning to do this weekend?","ko":"그거 좋다. 너 이번 주말에 뭐 할 계획이야?"},{"sp":"Minji","en":"I’m going to visit a traditional market. Do you wanna come with me?","ko":"전통 시장 좀 가 보려고. 같이 갈래?"},{"sp":"Ashley","en":"That sounds fun! Are there any special foods or things I should look for there?","ko":"그거 재밌겠다! 거기에 특별한 음식이나 봐야 할 게 있어?"},{"sp":"Minji","en":"Yes! Let me show you the street food there. You’ll love tteokbokki and hotteok.","ko":"응! 내가 거기서 길거리 음식을 보여줄게. 떡볶이랑 호떡 좋아할 거야."},{"sp":"Ashley","en":"Is this where I can also find handmade goods?","ko":"거기가 수공예품도 찾을 수 있는 곳이야?"},{"sp":"Minji","en":"Absolutely! There’s a stall that sells traditional fans and pottery. Do you mind if we stop there first?","ko":"당연하지! 전통 부채랑 도자기를 파는 가게가 있어. 거기를 먼저 들러도 괜찮을까?"},{"sp":"Ashley","en":"Not at all. What do you think I should buy as a souvenir?","ko":"문제 없지. 기념품으로 뭐 사면 좋다고 생각해?"},{"sp":"Minji","en":"I’d recommend a small hanbok for decoration. It’s unique and very Korean.","ko":"장식용 작은 한복을 추천할게. 독특하고 정말 한국적이야."}]},{"u":9,"ut":"What are you gonna","name":"대화해보기","turns":[{"sp":"Alex","en":"Hey, I met a lot of Southeast Asian people recently. Do you know much about their culture?","ko":"나 최근에 동남아 사람들 많이 만났어. 그들의 문화에 대해 많이 아니?"},{"sp":"Emily","en":"Yeah, a little. Are you interested in Southeast Asian culture?","ko":"응. 조금. 동남아 문화에 관심 있어?"},{"sp":"Alex","en":"Yeah, I think so. What do you know about their lifestyle?","ko":"응, 그런 것 같아. 그들의 생활 방식에 대해 뭘 알고 있어?"},{"sp":"Emily","en":"Well, they are usually very friendly and warm. There is a strong sense of community in their culture. Many people live with their families, even after they get married.","ko":"음, 보통 정말 친절하고 따뜻해. 그들의 문화에는 강한 공동체 의식이 있어. 많은 이들은 결혼 이후에도 가족들과 함께 살아."},{"sp":"Alex","en":"That’s interesting. Is this common in all Southeast Asian countries?","ko":"그거 재미있네. 이게 모든 동남아 국가에서 흔한 일인가?"},{"sp":"Emily","en":"Mostly, yes. But of course, it depends on the country and the family. Oh, and they love street food! Have you ever tried Southeast Asian Street food?","ko":"대부분 그래. 하지만 물론 나라나 가족에 따라 다르기도 하지. 아 그리고 길거리 음식을 정말 좋아해. 동남아시아 길거리 음식 먹어본 적 있어?"},{"sp":"Alex","en":"Yeah, I had Thai food once. Does this mean they eat street food every day?","ko":"응, 태극 음식 한번 먹어봤어. (그럼) 그들은 매일 길거리 음식을 먹는다는 거야?"},{"sp":"Emily","en":"Not every day, but very often. It’s cheaper than eating at home, so it can be convenient. Can I get Thai street food in our city?","ko":"매일은 아니지만, 꽤 자주 먹어. 집에서 먹는 것보다 싸니, 편리할 수 있거든. 우리 도시에서도 태국 길거리 음식을 먹을 수 있나?"},{"sp":"Alex","en":"Yeah, there’s a Thai food truck downtown. Do you want me to take you there this weekend?","ko":"응, 시내에 태국 음식 트럭이 있어. 이번 주말에 내가 거기 데려갈까?"},{"sp":"Emily","en":"Sounds great! Oh, and I heard that in Southeast Asia, people don’t rush much. Is this true?","ko":"그거 좋지! 아, 그리고 동남아에서는 사람들이 그렇게 급하게 행동하지 않는다고 들었어. 이거 사실이야?"},{"sp":"Alex","en":"Yeah, it seems like that. Everything’s getting late. By the way, I should go now.","ko":"응, 그런 거 같아. 모든 게 늦어지지. 암튼 나 가야겠다."},{"sp":"Emily","en":"Alright! What are you gonna do tomorrow?","ko":"알겠어! 내일 뭐 할 거야?"},{"sp":"Alex","en":"I’m gonna meet some friends. Do you wanna join us?","ko":"친구 좀 만나려고. 너도 낄래?"},{"sp":"Emily","en":"Sure! What time are you gonna meet them?","ko":"좋아! 걔네 몇 시에 만나기로 했어?"},{"sp":"Alex","en":"Around 6 PM. Let me take care of tomorrow’s plans. I’ll text you later!","ko":"오후 6시쯤! 내일 일정은 나한테 맡겨. 이따 문자할게"}]},{"u":49,"ut":"복습1","name":"대화 1_빈칸","turns":[{"sp":"A","en":"Can I please get an iced coffee?","ko":"아이스 커피 하나 주세요."},{"sp":"B","en":"Sure! Is this your first time here?","ko":"물론이죠. 여기 처음이세요?"},{"sp":"A","en":"Yeah. I was wondering — what do you recommend?","ko":"네. 그런데.. 뭐 추천하시는 게 뭐 있을까요?"},{"sp":"B","en":"Our iced vanilla latte is really popular. It’s getting more popular every summer.","ko":"저희 아이스 바닐라 라떼가 정말 인기가 많아요. 여름마다 점점 더 인기를 끌고 있어요."},{"sp":"A","en":"Sounds great. Let me try that.","ko":"좋네요. 그걸로 할게요."},{"sp":"B","en":"You got it. By the way, what do you want me to write on the cup? Your name?","ko":"알겠습니다. 그런데 컵에 뭐라고 써드릴까요? 이름이요?"},{"sp":"A","en":"It’s Jeong-Sun","ko":"종선이요."},{"sp":"B","en":"Got it.… Wait, what did you say your name was again?","ko":"알겠습니다. … 잠깐만요, 이름 뭐라고 하셨죠?"},{"sp":"A","en":"Jeong-Sun. I feel like it’s a bit hard for you to recognize Korean names the first time.","ko":"종선이요. 처음에는 한국 이름을 인식하는 게 어려울 거라 느껴요."},{"sp":"B","en":"Haha, I know, however, I could’ve written it down right away.","ko":"하하, 맞아요. 그래도 바로 적을 수 있었어야 했는데."},{"sp":"A","en":"It’s okay. No matter what, I always get called Jenny anyway. You can also call me Jenny.","ko":"괜찮아요. 어차피 항상 사람들은 저를 제니라고 부르더라고요. 제니라고 부르셔도 돼요."},{"sp":"B","en":"You know, the way people remember foreign names is different.","ko":"사람들이 외국 이름을 기억하는 방식은 다양하잖아요."},{"sp":"A","en":"Yeah, and sometimes it’s related to what they were thinking about at the moment.","ko":"맞아요. 가끔은 그 순간 무슨 생각을 하고 있었는지랑도 관련이 있죠."},{"sp":"B","en":"True. So, when was the last time a foreigner like me got it right on the first try?","ko":"그럼, 나 같은 외국인이 한 번에 맞게 부른 마지막 기억은 언제예요?"},{"sp":"A","en":"Hmm… I don’t remember. I guess it would’ve been when I was still in Canada two years ago.","ko":"음… 기억이 안 나네요. 아마 2년 전 캐나다에 있을 때였을 거예요."},{"sp":"B","en":"Wow. That long, huh?","ko":"와, 꽤 오래됐네요?"},{"sp":"A","en":"Yeah. It’s not a big deal though. It can be funny sometimes.","ko":"네. 그래도 큰일은 아니에요. 가끔은 웃긴 일이 되기도 하죠."}]},{"u":49,"ut":"복습1","name":"대화 1_듣기","turns":[{"sp":"A","en":"Can I please get an iced coffee?","ko":"아이스 커피 하나 주세요."},{"sp":"B","en":"Sure! Is this your first time here?","ko":"물론이죠. 여기 처음이세요?"},{"sp":"A","en":"Yeah. I was wondering — what do you recommend?","ko":"네. 그런데.. 뭐 추천하시는 게 뭐 있을까요?"},{"sp":"B","en":"Our iced vanilla latte is really popular. It’s getting more popular every summer.","ko":"저희 아이스 바닐라 라떼가 정말 인기가 많아요. 여름마다 점점 더 인기를 끌고 있어요."},{"sp":"A","en":"Sounds great. Let me try that.","ko":"좋네요. 그걸로 할게요."},{"sp":"B","en":"You got it. By the way, what do you want me to write on the cup? Your name?","ko":"알겠습니다. 그런데 컵에 뭐라고 써드릴까요? 이름이요?"},{"sp":"A","en":"It’s Jeong-Sun","ko":"종선이요."},{"sp":"B","en":"Got it.… Wait, what did you say your name was again?","ko":"알겠습니다. … 잠깐만요, 이름 뭐라고 하셨죠?"},{"sp":"A","en":"Jeong-Sun. I feel like it’s a bit hard for you to recognize Korean names the first time.","ko":"종선이요. 처음에는 한국 이름을 인식하는 게 어려울 거라 느껴요."},{"sp":"B","en":"Haha, I know, however, I could’ve written it down right away.","ko":"하하, 맞아요. 그래도 바로 적을 수 있었어야 했는데."},{"sp":"A","en":"It’s okay. No matter what, I always get called Jenny anyway. You can also call me Jenny.","ko":"괜찮아요. 어차피 항상 사람들은 저를 제니라고 부르더라고요. 제니라고 부르셔도 돼요."},{"sp":"B","en":"You know, the way people remember foreign names is different.","ko":"사람들이 외국 이름을 기억하는 방식은 다양하잖아요."},{"sp":"A","en":"Yeah, and sometimes it’s related to what they were thinking about at the moment.","ko":"맞아요. 가끔은 그 순간 무슨 생각을 하고 있었는지랑도 관련이 있죠."},{"sp":"B","en":"True. So, when was the last time a foreigner like me got it right on the first try?","ko":"그럼, 나 같은 외국인이 한 번에 맞게 부른 마지막 기억은 언제예요?"},{"sp":"A","en":"Hmm… I don’t remember. I guess it would’ve been when I was still in Canada two years ago.","ko":"음… 기억이 안 나네요. 아마 2년 전 캐나다에 있을 때였을 거예요."},{"sp":"B","en":"Wow. That long, huh?","ko":"와, 꽤 오래됐네요?"},{"sp":"A","en":"Yeah. It’s not a big deal though. It can be funny sometimes.","ko":"네. 그래도 큰일은 아니에요. 가끔은 웃긴 일이 되기도 하죠."}]},{"u":50,"ut":"복습2","name":"대화 2_빈 칸","turns":[{"sp":"A","en":"Can I get your opinion on something?","ko":"내가 너한테 뭔가에 대해서 좀 물어봐도 될까?"},{"sp":"B","en":"Sure, what is it?","ko":"물론이지, 뭔데?"},{"sp":"A","en":"I'm planning a trip, and I was wondering — would it be crazy to go to Iceland in the winter?","ko":"여행을 계획 중인데, 내가 궁금한 건... 겨울에 아이슬란드 가는 건 너무 무모할까?"},{"sp":"B","en":"Hmm… .","ko":"맞아. 시도도 안 했으면 평생 후회했을 거야."}]}],"glossary":[{"term":"레이아웃 (Layout)","def":"화면이나 문서에서 버튼, 텍스트, 이미지 등을 어떻게 배치할지 정한 설계입니다. 예: 앱의 메뉴는 위에, 버튼은 아래에 놓을지 결정하는 것.","file":"영어자동화_51_복습3.docx"},{"term":"핸드오프 (Handoff)","def":"현 단계에서 다음 단계로 작업을 전달하는 과정","file":"영어자동화_51_복습3.docx"},{"term":"Dev team (개발팀)","def":"개발자 팀의 줄임말. 회사에서 앱, 웹사이트, 프로그램을 실제로 만드는 사람들입니다.","file":"영어자동화_51_복습3.docx"},{"term":"에셋 (Asset)","def":"디지털 작업에서 쓰는 자료들. 아이콘, 이미지, 폰트, 영상 등 시각 자료들이 포함됩니다. 디자이너가 만들어서 개발자에게 전달해주는 경우가 많아요.","file":"영어자동화_51_복습3.docx"},{"term":"UI 불일치 (UI inconsistency)","def":"UI는 User Interface (사용자 인터페이스)의 줄임말이고, UI 불일치는 말 그대로 화면에 보이는 요소들(버튼, 색상 등)의 스타일이 통일되지 않음을 말합니다. 예: 어떤 버튼은 파란색인데, 비슷한 버튼이 빨간색이면 UI 불일치입니다.","file":"영어자동화_51_복습3.docx"},{"term":"스테이징 (Staging)","def":"실제 서비스에 배포하기 전, 테스트를 위해 만든 미리보기용 환경입니다. 사용자에게는 아직 공개되지 않은 ‘시험판’이라 생각하면 됩니다.","file":"영어자동화_51_복습3.docx"},{"term":"에러 처리 컴포넌트 (Error handling component)","def":"앱이나 웹사이트에서 에러(오류)가 났을 때 보여주는 메시지나 처리 방식을 담당하는 코드 조각. 예: “인터넷 연결이 없습니다” 같은 안내창을 띄우는 기능.","file":"영어자동화_51_복습3.docx"},{"term":"엣지 케이스 (Edge case)","def":"일반적인 상황은 아니지만, 아주 드물게 발생할 수 있는 특이한 상황입니다. 예: 이름 입력칸에 특수문자를 넣었을 때 에러가 나는 경우.","file":"영어자동화_51_복습3.docx"},{"term":"로직 (Logic)","def":"프로그램이 어떤 상황에서 어떻게 작동할지를 정한 논리적 규칙 또는 흐름입니다. 예: \"사용자가 버튼을 누르면 이메일을 보내라\"는 명령 규칙도 하나의 로직입니다.","file":"영어자동화_51_복습3.docx"},{"term":"API (Application Programming Interface)","def":"프로그램끼리 정보를 주고받는 통신 방법 또는 다리입니다. 예: 날씨 앱이 기상청의 데이터(API)를 받아서 날씨를 보여주는 것.","file":"영어자동화_51_복습3.docx"},{"term":"API 처리 실패 (API failure)","def":"API를 요청했는데 정보가 오지 않거나, 에러가 나는 상황입니다. 예: 서버가 죽어서 날씨 정보를 못 받는 경우.","file":"영어자동화_51_복습3.docx"},{"term":"API 처리 방식 (API failure handling)","def":"위처럼 API가 실패했을 때 에러 메시지를 띄우거나, 다시 시도하거나, 다른 방법을 쓰는 처리 방법입니다.","file":"영어자동화_51_복습3.docx"},{"term":"대시보드 스타일링 (Dashboard styling)","def":"대시보드는 여러 데이터를 한눈에 보여주는 화면입니다. 이를 예쁘게 꾸미는 작업이 스타일링입니다. 색상, 아이콘, 정렬 방식 등을 다듬는 것.","file":"영어자동화_51_복습3.docx"},{"term":"에셋 (Asset) (반복)","def":"위에 설명했지만 다시 요약하면, 디자인 자료입니다. 디자이너가 만든 버튼 이미지,   sel.innerHTML = VOICES.length ? VOICES.map(v=>`<option value="${esc(v.name)}">${esc(v.name)} (${v.lang})</option>`).join('')
                                : '<option value="">기본 음성</option>';
  const pref = VOICES.find(v=>/samantha|aria|jenny|google us|natural/i.test(v.name)) || VOICES[0];
  if(pref && !S.voice){ S.voice=pref.name; sel.value=pref.name; }
  $('#voiceHint').textContent = VOICES.length? `사용 가능한 영어 음성 ${VOICES.length}개` : '이 브라우저에서 영어 음성을 찾지 못했습니다';
}
if('speechSynthesis' in window){ speechSynthesis.onvoiceschanged=loadVoices; loadVoices(); setTimeout(loadVoices,400); }
function speak(text, rate){
  if(!S.sound || !('speechSynthesis' in window)) return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang='en-US'; u.rate=rate||S.rate;
    const v=VOICES.find(x=>x.name===S.voice); if(v)u.voice=v;
    speechSynthesis.speak(u);
  }catch(e){}
}

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec=null, recOn=false;
function listen(onResult, onEnd){
  if(!SR){ onEnd&&onEnd('unsupported'); return; }
  try{
    rec=new SR(); rec.lang='en-US'; rec.interimResults=false; rec.maxAlternatives=3;
    rec.onresult=e=>{ const alts=[...e.results[0]].map(r=>r.transcript); onResult(alts); };
    rec.onerror=e=>{ onEnd&&onEnd(e.error); };
    rec.onend=()=>{ recOn=false; onEnd&&onEnd(null); };
    recOn=true; rec.start();
  }catch(e){ onEnd&&onEnd('fail'); }
}
function stopListen(){ try{ rec&&rec.stop(); }catch(e){} recOn=false; }

/* =============== session =============== */
function start(mode){
  S.mode=mode; S.idx=0; S.right=0; S.wrong=0; S.wrongList=[]; S.answered=false;
  if(mode==='role') S.queue=shuffle(rpPool()).slice(0,Math.min(S.sessionLen,rpPool().length));
  else if(mode==='read') S.queue=shuffle(dgPool()).slice(0,Math.min(S.sessionLen,dgPool().length));
  else {
    let q=shuffle(pool());
    if(mode==='build') q=q.filter(p=>p.nw>=3&&p.nw<=16);
    if(mode==='blank') q=q.filter(p=>p.nw>=4);
    if(mode==='dict')  q=q.filter(p=>p.nw<=14);
    S.queue=q.slice(0,S.sessionLen);
  }
  if(!S.queue.length){ alert('선택한 범위에 문제가 없어요. 범위를 넓혀 주세요.'); return; }
  go('study');
}
function next(){ S.idx++; S.answered=false; if(S.idx>=S.queue.length) go('done'); else go('study'); }
function mark(ok,item){ if(ok)S.right++; else {S.wrong++; if(item)S.wrongList.push(item);} }

const MODENAME={flash:'플래시카드',build:'단어 배열',blank:'빈칸 채우기',dict:'듣고 받아쓰기',speak:'따라 읽기',role:'롤플레이 대답',read:'대화 읽기'};
function shell(inner){
  const pct=Math.round(S.idx/S.queue.length*100);
  return `<div class="topbar">
      <button class="iconbtn" onclick="go('home')" title="나가기">←</button>
      <span class="ttl">${MODENAME[S.mode]}</span><div class="spacer"></div>
      <div class="stat"><span>${S.idx+1} / ${S.queue.length}</span>
      ${S.mode==='read'?'':`<span>✓ <b>${S.right}</b></span><span>✗ <b>${S.wrong}</b></span>`}</div>
    </div>
    <div class="prog"><i style="width:${pct}%"></i></div>${inner}`;
}
function unitTag(p){ return `<div class="meta">Unit ${String(p.u).padStart(2,'0')} · ${esc(p.ut)}${p.sec?' · '+esc(p.sec):''}</div>`; }

/* --- word build --- */
let bTokens=[], bPicked=[];
function mBuild(){
  const p=S.queue[S.idx];
  bTokens=p.en.split(/\s+/); bPicked=[];
  const bank=shuffle(bTokens.map((w,i)=>({w,i})));
  $('#view').innerHTML = shell(`<div class="stage">
    <div class="qlabel">한국어 뜻을 보고 영어 문장을 완성하세요</div>
    <div class="ko">${esc(p.ko)}</div>
    <div class="answerbox" id="ansbox"></div>
    <div class="bank" id="bank">${bank.map(t=>`<button class="tok" data-i="${t.i}" onclick="pick(${t.i})">${esc(t.w)}</button>`).join('')}</div>
    ${unitTag(p)}
    <div class="actions">
      <button class="btn ghost" onclick="undoTok()">← 되돌리기</button>
      <button class="btn ghost" onclick="hintTok()">힌트</button>
      <div class="spacer"></div>
      <span id="fbb"></span>
      <button class="btn" id="bnext" style="display:none" onclick="next()">다음 →</button>
    </div></div>`);
}
function drawAns(){
  $('#ansbox').innerHTML = bPicked.map((i,k)=>`<button class="tok sel" onclick="unpick(${k})">${esc(bTokens[i])}</button>`).join('');
}
function pick(i){
  if(S.answered)return;
  bPicked.push(i); document.querySelector(`#bank .tok[data-i="${i}"]`).classList.add('used'); drawAns();
  if(bPicked.length===bTokens.length) checkBuild();
}
function unpick(k){
  if(S.answered)return;
  const i=bPicked.splice(k,1)[0];
  document.querySelector(`#bank .tok[data-i="${i}"]`).classList.remove('used'); drawAns();
}
function undoTok(){ if(bPicked.length)unpick(bPicked.length-1); }
function hintTok(){
  if(S.answered)return;
  const need=bPicked.length; if(need>=bTokens.length)return;
  if(bPicked[need]!==need){ // clear wrong tail then push correct
    while(bPicked.length>need) unpick(bPicked.length-1);
  }
  pick(need);
}
function checkBuild(){
  const p=S.queue[S.idx];
  const got=bPicked.map(i=>bTokens[i]).join(' ');
  const ok = norm(got)===norm(p.en);
  S.answered=true; mark(ok,ok?null:p);
  $('#ansbox').className='answerbox '+(ok?'ok':'no');
  $('#fbb').innerHTML = ok?'<span class="fb ok">정답이에요! 👏</span>'
    :`<span class="fb no">정답: ${esc(p.en)}</span>`;
  $('#bnext').style.display='inline-block';
  if(S.autoSpeak) speak(p.en);
}

/* --- fill in blank --- */
const STOP=/^(the|a|an|is|are|am|to|of|in|on|at|it|i|you|we|he|she|they|do|does|did|and|or|but|my|me|your|so|that|this|these|those|be|been|was|were|will|would|can|could|not|no|for|with|as|if|up|out|huh|wow|oh|yeah|okay|ok)$/;
const ESCRE = s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
function findPattern(p){
  const cands = (D.pats[p.u]||[]).concat(D.allpats);
  for(const c of cands){
    if(c.split(/\s+/).length<2) continue;
    const re=new RegExp('(^|[^A-Za-z])('+ESCRE(c).replace(/[’']/g,"[’']")+')(?![A-Za-z])','i');
    const m=p.en.match(re);
    if(m) return {start:m.index+m[1].length, text:m[2], words:c.split(/\s+/).length};
  }
  return null;
}
function keyWord(p){
  const toks=p.en.split(/\s+/); const utw=words(p.ut||'');
  let best=-1,bs=-1;
  toks.forEach((t,i)=>{
    const w=norm(t); if(!w) return;
    let s=w.length;
    if(utw.includes(w)) s+=12;
    if(STOP.test(w)) s-=11;
    if(s>bs){bs=s;best=i}
  });
  return best<0?0:best;
}
function mBlank(){
  const p=S.queue[S.idx];
  const clean=w=>w.replace(/^[^A-Za-z0-9’']+|[^A-Za-z0-9’']+$/g,'');
  let target, shown, isPat=false;
  const pat=findPattern(p);
  if(pat){
    isPat=true; target=pat.text;
    shown = esc(p.en.slice(0,pat.start)) + `<span class="blankw" id="bw" style="min-width:${Math.max(90,target.length*11)}px">____</span>` + esc(p.en.slice(pat.start+target.length));
  }else{
    const toks=p.en.split(/\s+/), ki=keyWord(p);
    target=clean(toks[ki]);
    shown=toks.map((t,i)=>i===ki?`<span class="blankw" id="bw">____</span>`:esc(t)).join(' ');
  }
  let cand;
  if(isPat){
    const tw=target.split(/\s+/).length;
    cand=D.allpats.filter(x=>x.toLowerCase()!==target.toLowerCase() && Math.abs(x.split(/\s+/).length-tw)<=1);
  }else{
    cand=[...new Set(D.pairs.flatMap(x=>x.en.split(/\s+/)).map(clean)
      .filter(w=>w && w.toLowerCase()!==target.toLowerCase() && !STOP.test(w.toLowerCase())
                 && Math.abs(w.length-target.length)<=3 && /^[A-Za-z’']+$/.test(w)))];
  }
  const opts=shuffle([target,...shuffle(cand).slice(0,3)]);
  blankOpts=opts; blankTarget=target;
  $('#view').innerHTML = shell(`<div class="stage">
    <div class="qlabel">${isPat?'빈칸에 들어갈 <b style="color:var(--accent-ink)">핵심 표현</b>을 고르세요':'빈칸에 들어갈 단어를 고르세요'}</div>
    <div class="en">${shown}</div>
    <div style="font-size:14.5px;color:var(--ink2);margin-top:12px;font-weight:600">${esc(p.ko)}</div>
    <div class="choices" id="ch">${opts.map((o,i)=>`<button class="choice" data-k="${i}" onclick="pickBlank(this,${i})">${esc(o)}</button>`).join('')}</div>
    ${unitTag(p)}
    <div class="actions"><div class="spacer"></div>
      <button class="btn" id="bnext" style="display:none" onclick="next()">다음 →</button></div></div>`);
}
let blankOpts=[], blankTarget='';
function pickBlank(el,k){
  if(S.answered)return; S.answered=true;
  const p=S.queue[S.idx], target=blankTarget, val=blankOpts[k];
  const ok=val.toLowerCase()===target.toLowerCase();
  mark(ok,ok?null:p);
  [...document.querySelectorAll('#ch .choice')].forEach(b=>{
    if(blankOpts[+b.dataset.k].toLowerCase()===target.toLowerCase()) b.classList.add('ok');
    else if(b===el) b.classList.add('no');
    b.onclick=null;
  });
  $('#bw').textContent=target; $('#bw').style.color= ok?'var(--good)':'var(--bad)';
  $('#bnext').style.display='inline-block';
  if(S.autoSpeak) speak(p.en);
}

/* --- dictation --- */
function mDict(){
  const p=S.queue[S.idx];
  $('#view').innerHTML = shell(`<div class="stage">
    <div class="qlabel">들리는 문장을 그대로 입력하세요</div>
    <div style="display:flex;gap:10px;align-items:center;margin:8px 0 16px;flex-wrap:wrap">
      <button class="btn" onclick="speak(${JSON.stringify(p.en).replace(/"/g,'&quot;')})">🔊 듣기</button>
      <button class="btn ghost" onclick="speak(${JSON.stringify(p.en).replace(/"/g,'&quot;')},0.6)">🐢 천천히</button>
      <span class="muted" style="font-size:12.5px">단어 ${p.nw}개</span>
    </div>
    <input class="tinput" id="dinp" placeholder="여기에 영어로 입력…" autocomplete="off" autocapitalize="off" spellcheck="false"
      onkeydown="if(event.key==='Enter')checkDict()">
    <div id="dres" style="margin-top:16px"></div>
    ${unitTag(p)}
    <div class="actions">
      <button class="btn ghost" onclick="showKo()">뜻 보기</button>
      <div class="spacer"></div>
      <button class="btn" id="dbtn" onclick="checkDict()">확인</button>
      <button class="btn" id="bnext" style="display:none" onclick="next()">다음 →</button>
    </div></div>`);
  setTimeout(()=>{ $('#dinp').focus(); speak(p.en); },250);
}
function showKo(){ const p=S.queue[S.idx]; $('#dres').innerHTML=`<div style="font-size:14.5px;color:var(--ink2);font-weight:650">${esc(p.ko)}</div>`; }
function diffHTML(userStr, ansStr){
  const u=words(userStr), a=ansStr.split(/\s+/);
  return a.map((w,i)=>{
    const cw=norm(w);
    if(u[i]===cw) return `<span class="g">${esc(w)}</span>`;
    if(u.includes(cw)) return `<span class="m">${esc(w)}</span>`;
    return `<span class="b">${esc(w)}</span>`;
  }).join(' ');
}
function checkDict(){
  if(S.answered)return;
  const p=S.queue[S.idx], val=$('#dinp').value;
  if(!val.trim())return;
  S.answered=true;
  const a=words(p.en), u=words(val);
  const hit=a.filter((w,i)=>u[i]===w).length;
  const pct=Math.round(hit/a.length*100), ok=pct>=90;
  mark(ok,ok?null:p);
  $('#dres').innerHTML=`<div class="score ${pct>=90?'g':pct>=60?'y':'r'}">${pct}%</div>
    <div class="diffline" style="margin-top:6px">${diffHTML(val,p.en)}</div>
    <div style="font-size:14px;color:var(--ink2);margin-top:8px;font-weight:600">${esc(p.ko)}</div>`;
  $('#dinp').disabled=true; $('#dbtn').style.display='none'; $('#bnext').style.display='inline-block';
  if(S.autoSpeak) speak(p.en);
}

/* --- speak / pronunciation --- */
function mSpeak(){
  const p=S.queue[S.idx];
  $('#view').innerHTML = shell(`<div class="stage">
    <div class="qlabel">듣고 따라 읽어보세요</div>
    <div class="en big">${esc(p.en)}</div>
    <div style="font-size:14.5px;color:var(--ink2);margin-top:10px;font-weight:600">${esc(p.ko)}</div>
    <div style="display:flex;gap:14px;align-items:center;margin:22px 0 6px">
      <button class="btn ghost" onclick="speak(${JSON.stringify(p.en).replace(/"/g,'&quot;')})">🔊 듣기</button>
      <button class="btn ghost" onclick="speak(${JSON.stringify(p.en).replace(/"/g,'&quot;')},0.6)">🐢 천천히</button>
      <div class="spacer"></div>
      <button class="micbtn" id="mic" onclick="recSpeak()">🎤</button>
    </div>
    <div id="sres" style="margin-top:10px"><span class="muted" style="font-size:13px">마이크를 누르고 문장을 소리 내어 읽어 주세요</span></div>
    ${unitTag(p)}
    <div class="actions"><div class="spacer"></div>
      <button class="btn ghost" onclick="mark(false,S.queue[S.idx]);next()">건너뛰기</button>
      <button class="btn" id="bnext" style="display:none" onclick="next()">다음 →</button></div></div>`);
  setTimeout(()=>speak(p.en),250);
}
function scoreSpeech(said, target){
  const a=words(target), u=words(said);
  const set=new Set(u); let hit=0;
  a.forEach(w=>{ if(set.has(w)){hit++; set.delete(w);} });
  return Math.round(hit/Math.max(a.length,1)*100);
}
function recSpeak(){
  if(!SR){ $('#sres').innerHTML='<div class="notice">이 브라우저는 마이크 인식을 지원하지 않아요. 크롬(Chrome)에서 열어 주세요.</div>'; return; }
  const p=S.queue[S.idx], mic=$('#mic');
  if(recOn){ stopListen(); mic.classList.remove('rec'); return; }
  mic.classList.add('rec');
  $('#sres').innerHTML='<span class="muted" style="font-size:13px">듣고 있어요… 지금 말해 주세요</span>';
  listen(alts=>{
    let best=0,bestT=alts[0];
    alts.forEach(t=>{ const s=scoreSpeech(t,p.en); if(s>best){best=s;bestT=t} });
    const ok=best>=70; if(!S.answered){ S.answered=true; mark(ok,ok?null:p); }
    $('#sres').innerHTML=`<div class="score ${best>=85?'g':best>=60?'y':'r'}">${best}%</div>
      <div style="font-size:14px;color:var(--ink2);margin-top:2px;font-weight:600">들린 내용: “${esc(bestT)}”</div>
      <div class="diffline" style="margin-top:8px;font-size:16px">${diffHTML(bestT,p.en)}</div>`;
    $('#bnext').style.display='inline-block';
  }, err=>{
    mic.classList.remove('rec');
    if(err==='not-allowed') $('#sres').innerHTML='<div class="notice">마이크 권한이 필요해요. 주소창의 자물쇠 아이콘에서 마이크를 허용해 주세요.</div>';
    else if(err==='no-speech') $('#sres').innerHTML='<div class="notice">소리가 들리지 않았어요. 다시 눌러서 말해 주세요.</div>';
    else if(err==='unsupported') $('#sres').innerHTML='<div class="notice">이 브라우저는 마이크 인식을 지원하지 않아요.</div>';
  });
}

/* --- roleplay --- */
let rpStep=0;
function mRole(){
  const r=S.queue[S.idx];
  rpStep=0;
  $('#view').innerHTML = shell(`<div class="stage">
    <div class="qlabel">대화를 듣고 마지막에 당신이 대답하세요</div>
    <div class="turns" id="turns"></div>
    <div id="rpbody"></div>
    <div class="meta">Unit ${String(r.u).padStart(2,'0')} · ${esc(r.ut)} · ${esc(r.name)}</div>
    <div class="actions">
      <button class="btn ghost" onclick="playAll()">🔊 대화 전체 듣기</button>
      <div class="spacer"></div>
      <button class="btn" id="bnext" style="display:none" onclick="next()">다음 →</button>
    </div></div>`);
  drawTurns(); setTimeout(playAll,300);
}
function drawTurns(){
  const r=S.queue[S.idx];
  $('#turns').innerHTML = r.lines.map((l,i)=>`<div class="turn ${l.sp==='B'?'me':''}">
      <div class="av">${esc(l.sp||'?')}</div>
      <div class="bub">${esc(l.t)}<span class="play" onclick="speak(${JSON.stringify(l.t).replace(/"/g,'&quot;')})">▶</span>
      ${r.ko&&r.ko[i]?`<span class="kot">${esc(r.ko[i])}</span>`:''}</div></div>`).join('')
    + `<div class="turn me"><div class="av">나</div><div class="bub" style="background:#fff;border:1.5px dashed var(--line);color:var(--ink3)">
       당신의 차례예요 — 아래에서 영어로 대답해 보세요</div></div>`;
  $('#rpbody').innerHTML = `
    <div style="display:flex;gap:10px;align-items:center;margin:14px 0 8px;flex-wrap:wrap">
      <input class="tinput" id="rinp" style="flex:1;min-width:180px" placeholder="영어로 대답을 입력하거나 마이크를 누르세요"
        onkeydown="if(event.key==='Enter')checkRole($('#rinp').value)">
      <button class="micbtn" id="mic" onclick="recRole()">🎤</button>
    </div>
    <div class="actions" style="margin-top:4px">
      <button class="btn" onclick="checkRole($('#rinp').value)">확인</button>
      <button class="btn ghost" onclick="revealRole()">모범 답안 보기</button>
    </div>
    <div id="rres" style="margin-top:14px"></div>`;
}
function playAll(){
  const r=S.queue[S.idx]; if(!S.sound||!('speechSynthesis' in window))return;
  speechSynthesis.cancel();
  r.lines.forEach(l=>{
    const u=new SpeechSynthesisUtterance(l.t); u.lang='en-US'; u.rate=S.rate;
    const v=VOICES.find(x=>x.name===S.voice); if(v)u.voice=v;
    if(l.sp==='B'&&VOICES.length>1){ const alt=VOICES.find(x=>x.name!==S.voice); if(alt)u.voice=alt; }
    speechSynthesis.speak(u);
  });
}
function recRole(){
  if(!SR){ $('#rres').innerHTML='<div class="notice">이 브라우저는 마이크 인식을 지원하지 않아요. 크롬에서 열거나 직접 입력해 주세요.</div>'; return; }
  const mic=$('#mic');
  if(recOn){ stopListen(); mic.classList.remove('rec'); return; }
  mic.classList.add('rec'); $('#rres').innerHTML='<span class="muted" style="font-size:13px">듣고 있어요…</span>';
  listen(alts=>{ $('#rinp').value=alts[0]; checkRole(alts[0]); },
    err=>{ mic.classList.remove('rec');
      if(err==='not-allowed')$('#rres').innerHTML='<div class="notice">마이크 권한을 허용해 주세요.</div>';
      else if(err==='no-speech')$('#rres').innerHTML='<div class="notice">소리가 들리지 않았어요. 다시 시도해 주세요.</div>'; });
}
function checkRole(val){
  const r=S.queue[S.idx]; if(!val||!val.trim())return;
  const sc=scoreSpeech(val,r.sample);
  const key=words(r.sample).filter(w=>w.length>3);
  const used=key.filter(w=>words(val).includes(w)).length;
  const ok = sc>=45 || used>=Math.ceil(key.length*0.4);
  if(!S.answered){ S.answered=true; mark(ok, ok?null:{en:r.sample,ko:(r.ko&&r.ko[r.ko.length-1])||'',u:r.u,ut:r.ut}); }
  $('#rres').innerHTML=`
    <div class="fb ${ok?'ok':'no'}" style="display:inline-block">${ok?'좋아요! 핵심 표현을 잘 썼어요 👏':'조금 달라요 — 모범 답안을 확인해 보세요'} · 유사도 ${sc}%</div>
    <div style="margin-top:12px"><div class="qlabel">내 대답</div><div style="font-size:16px;font-weight:650">${esc(val)}</div></div>
    <div style="margin-top:12px"><div class="qlabel">모범 답안</div>
      <div style="font-size:17px;font-weight:700;color:var(--accent-ink)">${esc(r.sample)}
      <span class="play" style="cursor:pointer" onclick="speak(${JSON.stringify(r.sample).replace(/"/g,'&quot;')})">▶</span></div>
      ${r.ko&&r.ko.length>r.lines.length?`<div style="font-size:13.5px;color:var(--ink3);margin-top:3px">${esc(r.ko[r.ko.length-1])}</div>`:''}</div>`;
  $('#bnext').style.display='inline-block';
  if(S.autoSpeak) speak(r.sample);
}
function revealRole(){ checkRole($('#rinp').value.trim()||'(대답 없음)'); }

/* --- dialog reading --- */
let readShowKo=true;
function mRead(){
  const g=S.queue[S.idx];
  $('#view').innerHTML = shell(`<div class="stage">
    <div class="qlabel">소리 내어 읽어 보세요 · 문장을 누르면 읽어줍니다</div>
    <div class="turns" style="margin-top:6px">
      ${g.turns.map(t=>`<div class="turn ${/^B/.test(t.sp)?'me':''}">
        <div class="av">${esc((t.sp||'?').slice(0,1))}</div>
        <div class="bub" onclick="speak(${JSON.stringify(t.en).replace(/"/g,'&quot;')})" style="cursor:pointer">${esc(t.en)}
        <span class="kot" ${readShowKo?'':'style="display:none"'}>${esc(t.ko)}</span></div></div>`).join('')}
    </div>
    <div class="meta">Unit ${String(g.u).padStart(2,'0')} · ${esc(g.ut)} · ${esc(g.name)}</div>
    <div class="actions">
      <button class="btn ghost" onclick="playDialog()">🔊 전체 듣기</button>
      <button class="btn ghost" onclick="readShowKo=!readShowKo;render()">${readShowKo?'한국어 숨기기':'한국어 보기'}</button>
      <div class="spacer"></div>
      <button class="btn" onclick="S.right++;next()">다 읽었어요 →</button>
    </div></div>`);
}
function playDialog(){
  const g=S.queue[S.idx]; if(!S.sound||!('speechSynthesis' in window))return;
  speechSynthesis.cancel();
  g.turns.forEach(t=>{
    const u=new SpeechSynthesisUtterance(t.en); u.lang='en-US'; u.rate=S.rate;
    const v=VOICES.find(x=>x.name===S.voice); if(v)u.voice=v;
    if(/^B/.test(t.sp)&&VOICES.length>1){ const alt=VOICES.find(x=>x.name!==S.voice); if(alt)u.voice=alt; }
    speechSynthesis.speak(u);
  });
}

/* =============== done =============== */
function vDone(){
  const total=S.right+S.wrong, pct=total?Math.round(S.right/total*100):100;
  const msg = pct>=90?'완벽해요! 🎉':pct>=70?'잘하고 있어요 👏':pct>=50?'조금만 더 하면 돼요 💪':'다시 한 번 복습해 볼까요?';
  $('#view').innerHTML = `<div class="card done" style="margin-top:24px">
    <div class="muted" style="font-size:13px;font-weight:700">${MODENAME[S.mode]} 완료</div>
    <div class="big">${pct}%</div>
    <div style="font-weight:700;font-size:16px">${msg}</div>
    <div class="summary">
      <div><b>${S.queue.length}</b><span>푼 문제</span></div>
      <div><b style="color:var(--good)">${S.right}</b><span>맞음</span></div>
      <div><b style="color:var(--bad)">${S.wrong}</b><span>틀림</span></div>
    </div>
    <div class="row" style="justify-content:center;gap:8px;flex-wrap:wrap">
      <button class="btn ghost" onclick="go('home')">홈으로</button>
      ${S.wrongList.length?`<button class="btn ghost" onclick="retryWrong()">틀린 것만 다시 (${S.wrongList.length})</button>`:''}
      <button class="btn" onclick="start(S.mode)">한 번 더</button>
    </div>
    ${S.wrongList.length?`<div class="revlist"><div class="qlabel" style="margin-top:22px">복습할 문장</div>
      ${S.wrongList.map(p=>`<div class="revitem"><div class="e">${esc(p.en)} <span class="play" style="cursor:pointer" onclick="speak(${JSON.stringify(p.en).replace(/"/g,'&quot;')})">▶</span></div>
      <div class="k">${esc(p.ko)}</div></div>`).join('')}</div>`:''}
  </div>`;
}
function retryWrong(){
  const list=S.wrongList.slice();
  S.queue=list; S.idx=0; S.right=0; S.wrong=0; S.wrongList=[]; S.answered=false;
  if(S.mode==='role'||S.mode==='read'){ S.mode='flash'; }
  go('study');
}

/* =============== keyboard =============== */
document.addEventListener('keydown',e=>{
  if(S.view!=='study')return;
  if(e.target.tagName==='INPUT')return;
  if(e.code==='Space'){ e.preventDefault();
    if(S.mode==='flash'&&!S.answered) flip();
    else if(S.queue[S.idx]&&S.queue[S.idx].en) speak(S.queue[S.idx].en);
  }
  if(e.key==='Enter'&&$('#bnext')&&$('#bnext').style.display!=='none'){ next(); }
});
render();
</script>
</body>
</html>
